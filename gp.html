<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>

<style>
:root {
  color-scheme: light;
  --canvas: #EEF1F3; --paper: #FFFFFF; --ink: #17212B; --muted: #5C6873; --line: #D7DDE2; --field: #FFFFFF;
  --brand: #234E5C; --brand-text: var(--brand); --on-brand: #FFFFFF;
  --soft: color-mix(in srgb, var(--brand) 9%, var(--paper));
  --gain: #2C7A4B; --warn: #9A5516;
  --sans: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #0E1316; --paper: #161D21; --ink: #E3E8EB; --muted: #9AA6AE; --line: #2B353C; --field: #11171B;
    --brand-text: color-mix(in srgb, var(--brand) 55%, #FFFFFF); --soft: color-mix(in srgb, var(--brand) 22%, var(--paper));
    --gain: #6CC08F; --warn: #E0A26A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0E1316; --paper: #161D21; --ink: #E3E8EB; --muted: #9AA6AE; --line: #2B353C; --field: #11171B;
  --brand-text: color-mix(in srgb, var(--brand) 55%, #FFFFFF); --soft: color-mix(in srgb, var(--brand) 22%, var(--paper));
  --gain: #6CC08F; --warn: #E0A26A;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.brand small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
#bandeau { display: flex; gap: 0; margin-left: auto; flex-wrap: wrap; }
.kpi { padding: 2px 18px; border-left: 1px solid var(--line); min-width: 120px; }
.kpi .k { display: block; font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--serif); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v.small { font-family: var(--sans); font-size: 15px; font-weight: 600; }
.kpi.gain .v { color: var(--gain); }
.layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; padding: 24px; }
nav#nav { position: sticky; top: 96px; align-self: start; display: flex; flex-direction: column; }
nav#nav a { color: var(--muted); text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 600; font-size: 14.5px; counter-increment: s; }
nav#nav a:hover { color: var(--ink); background: var(--soft); }
nav#nav a[aria-current="page"] { color: var(--on-brand); background: var(--brand); }
nav#nav a:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
main#main { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px 34px; min-width: 0; }
main h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0 0 18px; letter-spacing: -0.015em; }
main h3 { font-size: 16px; margin: 26px 0 10px; }
main h3.sub { margin-top: 28px; }
.lead { color: var(--muted); max-width: 72ch; margin: 0 0 16px; }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.empty { color: var(--muted); font-style: italic; margin: 6px 0 14px; }
.grid { display: grid; gap: 12px 16px; margin-bottom: 12px; }
.g1 { grid-template-columns: 1fr; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fld small, .chk small { color: var(--muted); font-size: 12px; }
input[type=text], input[type=date], select { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 38px; }
.inwrap { position: relative; }
.inwrap.money input { padding-right: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.inwrap.money::after { content: "€"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.inwrap.pctin input { padding-right: 26px; text-align: right; }
.inwrap.pctin::after { content: "%"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chk { display: grid; grid-template-columns: 20px 1fr; gap: 2px 8px; align-items: start; padding-top: 22px; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); }
.chk small { grid-column: 2; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--paper); }
fieldset.card { margin: 0 0 14px; }
legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
.row { position: relative; margin-bottom: 10px; padding-right: 108px; }
.row .grid { margin: 0; }
.del { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 6px 10px; font: 600 13px var(--sans); cursor: pointer; }
.del:hover { color: var(--warn); border-color: var(--warn); }
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 10px; }
.listhead h3 { margin: 0; }
.btn { font: 600 14.5px var(--sans); background: var(--brand); color: var(--on-brand); border: 1px solid var(--brand); border-radius: 7px; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--brand-text); border-color: color-mix(in srgb, var(--brand-text) 45%, transparent); }
.btn.ghost.danger { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn.danger-solid { background: var(--warn); border-color: var(--warn); color: #FFFFFF; }
@keyframes glisseG { from { opacity: .3; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes glisseD { from { opacity: .3; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
main#main.glisse-g { animation: glisseG .22s ease-out; }
main#main.glisse-d { animation: glisseD .22s ease-out; }
@media (prefers-reduced-motion: reduce) { main#main.glisse-g, main#main.glisse-d { animation: none; } }
.patsum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
.patsum div { background: var(--soft); padding: 12px 16px; }
.patsum span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.patsum strong { font-family: var(--serif); font-size: 22px; font-variant-numeric: tabular-nums; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.chip { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: start; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.chip:hover { border-color: color-mix(in srgb, var(--brand) 50%, var(--line)); }
.chip.open { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.chip .ico { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 12%, var(--paper)); color: var(--brand-text); }
.chip.t-rp .ico, .chip.t-societe .ico { background: color-mix(in srgb, #B08A3E 18%, var(--paper)); color: #8A6A2B; }
.chip.t-parent .ico { background: color-mix(in srgb, #6976B3 16%, var(--paper)); color: #4B568F; }
.muted { color: var(--muted); }
.chip.t-don .ico { background: color-mix(in srgb, #B08A3E 18%, var(--paper)); color: #8A6A2B; }
.chip.t-frere .ico, .chip.t-neveu .ico { background: color-mix(in srgb, #6976B3 16%, var(--paper)); color: #4B568F; }
.chip.t-financier .ico, .chip.t-av .ico { background: color-mix(in srgb, #2C7A4B 14%, var(--paper)); color: #2C7A4B; }
.chip .ico svg { width: 23px; height: 23px; }
.chip .body { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.chip .nm { font-weight: 700; font-size: 14.5px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.chip .val { font-family: var(--serif); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.chip .val small { font-family: var(--sans); font-size: 11.5px; color: var(--muted); font-weight: 600; }
.chip .meta { font-size: 12.5px; color: var(--muted); }
.chip .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip .tags em { font-style: normal; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--soft); color: var(--brand-text); }
main#main { position: relative; }
.bulle { position: absolute; z-index: 6; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgba(16, 32, 40, .18); padding: 14px 18px 16px; }
.bulle .fleche { position: absolute; top: -8px; width: 16px; height: 16px; background: var(--paper); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.bulle .bhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.bulle .x { background: none; border: 0; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 6px; }
.bulle .bactions { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; }
.bulle .note { margin-top: 2px; }
.bulle.sheet { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto !important; border-radius: 16px 16px 0 0; max-height: 82vh; overflow-y: auto; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.bulle.sheet .fleche { display: none; }
@media (max-width: 600px) { .patsum { grid-template-columns: 1fr; } .chips { grid-template-columns: 1fr; } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.arbre-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--brand) 3%, var(--paper)); margin-bottom: 8px; }
.arbre { position: relative; min-width: max-content; padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 46px; }
.arbre .rang { display: flex; justify-content: center; align-items: center; gap: 14px; min-height: 10px; position: relative; z-index: 1; }
.arbre .rang:empty { display: none; }
.arbre .grp { display: flex; gap: 12px; }
.arbre .sep { width: 70px; }
.arbre .union-place { width: 46px; }
.arbre svg.liens { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
.arbre svg.liens path { fill: none; stroke: color-mix(in srgb, var(--ink) 35%, transparent); stroke-width: 1.5; }
.noeud { display: flex; align-items: center; gap: 9px; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 6px 14px 6px 6px; cursor: pointer; text-align: left; white-space: nowrap; }
.noeud:hover { border-color: color-mix(in srgb, var(--brand) 55%, var(--line)); }
.noeud.open { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.noeud .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 12%, var(--paper)); color: var(--brand-text); flex: none; }
.noeud .ico svg { width: 19px; height: 19px; }
.noeud .nt { display: flex; flex-direction: column; line-height: 1.2; }
.noeud .nt strong { font-size: 14px; } .noeud .nt small { font-size: 12px; color: var(--muted); }
.noeud.n-client { background: var(--brand); color: var(--on-brand); border-color: var(--brand); padding: 9px 18px 9px 9px; }
.noeud.n-client .ico { background: color-mix(in srgb, #FFFFFF 18%, transparent); color: #FFFFFF; }
.noeud.n-client .nt small { color: color-mix(in srgb, #FFFFFF 75%, transparent); }
.noeud.n-parent .ico, .noeud.n-frere .ico, .noeud.n-neveu .ico { background: color-mix(in srgb, #6976B3 16%, var(--paper)); color: #4B568F; }
.noeud.decede { opacity: .6; border-style: dashed; }
.poignees { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.poignee { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--brand) 45%, var(--line)); background: var(--paper); color: var(--brand-text); font: 700 12px/1 var(--sans); display: grid; place-items: center; cursor: pointer; pointer-events: auto; padding: 0; }
.poignee:hover { background: var(--brand); color: var(--on-brand); }
.bulle.menu { padding: 10px; width: auto !important; }
.bulle.menu .choix { display: flex; gap: 8px; }
.pill { display: flex; align-items: center; gap: 8px; font: 600 14px var(--sans); color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 20px; padding: 8px 14px; cursor: pointer; }
.pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.pill:hover { border-color: var(--brand); }
.minilist { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.mini { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.mini:hover { border-color: var(--brand); }
.mini .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--brand-text); }
.mini .ico svg { width: 17px; height: 17px; }
.mini em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; }
.bactions.wrap { flex-wrap: wrap; justify-content: flex-start; }
.bactions.wrap .btn:last-child { margin-left: auto; }
.pvbox { background: var(--soft); border-radius: 8px; padding: 8px 10px; }
.mini-sel { min-height: 28px !important; padding: 2px 6px !important; width: auto !important; font-size: 13px !important; }
@media (max-width: 600px) { .bulle.menu.sheet .choix { flex-direction: column; } }
.tip { border-bottom: 1px dotted currentColor; cursor: help; }
#infobulle { position: fixed; z-index: 40; background: var(--ink); color: var(--paper); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; white-space: pre-line; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .12s; font-variant-numeric: tabular-nums; }
#infobulle.on { opacity: 1; }
.btn.big { padding: 13px 22px; font-size: 15.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.exports { display: flex; flex-wrap: wrap; gap: 12px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .n { text-align: right; white-space: nowrap; }
table.t.edit select { min-height: 34px; padding: 5px 8px; }
table.compact td { padding: 6px 0; }
table.compact tr.sec td { padding-top: 14px; font-weight: 700; color: var(--brand-text); border-bottom: 0; }
table.compact td.opt { font-size: 12.5px; color: var(--muted); padding-top: 0; }
table.compact tr.tot td { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 0; padding-top: 10px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.res h4 { margin: 0 0 4px; font-size: 15px; }
.warn { color: var(--warn); font-size: 13px; padding-left: 18px; margin: 10px 0 0; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(150px, 230px) 1fr auto; align-items: center; gap: 14px; }
.step .lbl { font-weight: 600; font-size: 14px; }
.step .val { font-family: var(--serif); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
.bar { display: block; height: 14px; width: var(--w); background: var(--brand); border-radius: 3px; }
.bar.base { background: color-mix(in srgb, var(--ink) 35%, transparent); }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
.tag.ok { color: var(--gain); background: color-mix(in srgb, var(--gain) 14%, transparent); }
.tag.ko { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.modele { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 12px; }
.modele p { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; }
.swatches { display: flex; gap: 6px; }
.swatches span { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
label.file { position: relative; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  nav#nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav#nav a { white-space: nowrap; }
  #bandeau { margin-left: 0; width: 100%; }
  .kpi { padding: 2px 12px; min-width: 0; flex: 1; }
  .kpi.who { display: none; }
  .kpi:first-of-type, .kpi.who + .kpi { border-left: 0; padding-left: 0; }
  .g4, .g5, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .top-in { padding: 10px 14px; gap: 8px; }
  main#main { padding: 18px 16px 24px; }
  .g2, .g3, .g4, .g5, .g6 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .row { padding-right: 16px; padding-bottom: 54px; }
  .del { top: auto; bottom: 12px; transform: none; }
  .kpi .v { font-size: 17px; }
  .step { grid-template-columns: 1fr auto; }
  .step .bar { grid-column: 1 / -1; grid-row: 2; }
  .chk { padding-top: 4px; }
}
.install { margin-left: 12px; font: 600 13.5px var(--sans); background: transparent; color: var(--brand-text); border: 1px solid color-mix(in srgb, var(--brand-text) 45%, transparent); border-radius: 7px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.install[hidden] { display: none; }
@media (display-mode: standalone) { .install { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="brand">Audit civil et fiscal<small>Transmission : démembrement, assurance-vie, levier société</small></h1>
  <div id="bandeau" aria-live="polite"></div>
  <button class="install" id="installer" hidden>Installer l’application</button>

    var f = order[0], s = order[1];
    // 1er décès : à la plus courte des deux espérances de vie, le prémourant ayant au moins l'âge minimum retenu
    var y1 = Math.max(Math.min(ctx.persons.c1.ev, ctx.persons.c2.ev), P.ageMinPremierDeces - ctx.persons[f].age, 0.5);
    var y2 = Math.max(ctx.persons[s].ev, y1 + 1);
    deaths[f] = addYears(T0, y1); deaths[s] = addYears(T0, y2);
  } else {
    deaths.c1 = addYears(T0, Math.max(ctx.persons.c1.ev, 0.5));
  }

  // Copie des actifs (valeurs modifiables par le plan)
  var actifs = (d.actifs || []).map(function (a) { return Object.assign({}, a, { valeur: +a.valeur || 0, passif: +a.passif || 0, cca: a.type === 'societe' ? Math.min(+a.cca || 0, +a.passif || 0) : 0 }); });
  var avs = (d.av || []).map(function (c) { return Object.assign({}, c, { valeur: +c.valeur || 0, valeurApres70: +c.valeurApres70 || 0, primesApres70: +c.primesApres70 || 0 }); });

  // Registre des donations (rappel fiscal) : antérieures
  var ledger = (d.donations || []).map(function (x) {
    return { date: parseDate(x.date), donor: x.donateur, donee: x.beneficiaireId, value: +x.montant || 0, bucket: x.type === '790G' ? '790G' : 'LD', anterieure: true };
  }).filter(function (x) { return x.date; });

  var res = { order: order, deaths: deaths, donations: [], cashGifts: [], societe: [], deces: [], warnings: [], avVersements: [] };

  // retrait de liquidités chez un client (prorata des actifs financiers)
  function retirerLiquidites(k, montant) {
    var fin = actifs.filter(function (a) { return a.type === 'financier' && partClient(a, k, ctx) > 0; });
    var dispo = fin.reduce(function (s, a) { return s + a.valeur * partClient(a, k, ctx); }, 0);
    var m = Math.min(montant, dispo);
    if (dispo <= 0) return 0;
    fin.forEach(function (a) {
      var pk = partClient(a, k, ctx); var partVal = a.valeur * pk;
      var retrait = m * partVal / dispo;
      // on retire la valeur sur la quote-part de k : ajuste valeur et part
      var autreVal = a.valeur * (1 - pk);
      var nouv = partVal - retrait;
      a.valeur = autreVal + nouv;
      if (ctx.couple) a.partC1 = a.valeur > 0 ? ((k === 'c1' ? nouv : autreVal) / a.valeur) * 100 : 50;
    });
    return m;
  }

  function rappel(donor, donee, date, bucket) {
    var lim = addYears(date, -FISC.rappelAns);
    return ledger.filter(function (x) { return x.donor === donor && x.donee === donee && x.bucket === bucket && x.date > lim && x.date <= date; })
      .reduce(function (s, x) { return s + x.value; }, 0);
  }

  /* ---- PLAN : versements assurance-vie ---- */
  if (plan.av) {
    ctx.clients.forEach(function (k) {
      var v = +((d.plan || {}).versementAV || {})[k] || 0;
      if (v > 0) {
        var m = retirerLiquidites(k, v);
        if (m > 0) {
          var apres70 = ctx.persons[k].age >= 70;
          avs.push({ id: 'new_' + k, libelle: 'Nouveau contrat (versement préconisé)', souscripteur: k, valeur: m, valeurApres70: apres70 ? m : 0, primesApres70: apres70 ? m : 0, nouveau: true });
          res.avVersements.push({ client: k, montant: m, apres70: apres70 });
          if (m < v) res.warnings.push('Versement AV de ' + ctx.persons[k].label + ' limité aux liquidités disponibles.');
        }
      }
    });
  }

  /* ---- PLAN : dons de sommes d'argent ---- */
  if (plan.cash) {
    ctx.clients.forEach(function (k) {
      var age = ctx.persons[k].age;
      var dons = [];
      var hk = heritiersDe(ctx, k);
      if (P.don790GEnfants && age < 80) hk.forEach(function (e) { if (e.age >= 18 && (e.lien === 'enfant' || e.lien === 'neveu')) dons.push({ donee: e.id, montant: FISC.abat790G, bucket: '790G', type: 'Don familial 790 G' }); });
      if (P.don790GEnfants && age < 80 && hk.length && hk[0].lien !== 'enfant') hk.forEach(function (e) { if (e.lien === 'frere') generationSuivante(ctx, e).forEach(function (n) { if (n.age >= 18) dons.push({ donee: n.id, montant: FISC.abat790G, bucket: '790G', type: 'Don familial 790 G' }); }); });
      enfantsDe(ctx, k).forEach(function (e) {
        petitsEnfantsDe(ctx, e.id).forEach(function (p) {
          if (P.don790GPetitsEnfants && age < 80 && p.age >= 18) dons.push({ donee: p.id, montant: FISC.abat790G, bucket: '790G', type: 'Don familial 790 G' });
          if (P.don790BPetitsEnfants) dons.push({ donee: p.id, montant: FISC.abatPetitEnfant, bucket: 'PE', type: 'Don manuel (abatt. 790 B)' });
        });
      });
      if (P.don790ABis && T0 <= new Date(2026, 11, 31)) hk.forEach(function (e) { if (e.lien === 'enfant' || e.lien === 'neveu') dons.push({ donee: e.id, montant: FISC.don790ABis, bucket: '790AB', type: 'Don 790 A bis (RP neuve, rénovation)' }); });
      dons.forEach(function (x) {
        if (x.bucket === '790AB') {
          var deja = ledger.filter(function (l) { return l.bucket === '790AB' && l.donee === x.donee; }).reduce(function (s, l) { return s + l.value; }, 0);
          var mt = Math.min(x.montant, FISC.plafond790ABisDonataire - deja); if (mt <= 0) return;
          var mm = retirerLiquidites(k, mt); if (mm <= 0) return;
          ledger.push({ date: T0, donor: k, donee: x.donee, value: mm, bucket: '790AB' });
          res.cashGifts.push({ date: T0, donor: k, donee: x.donee, montant: mm, type: x.type, droits: 0 });
          return;
        }
        var rp = rappel(k, x.donee, T0, x.bucket);
        var plafond = x.bucket === '790G' ? FISC.abat790G : FISC.abatPetitEnfant;
        var montant = Math.max(0, Math.min(x.montant, plafond - rp));
        if (montant <= 0) return;
        var m = retirerLiquidites(k, montant);
        if (m <= 0) return;
        ledger.push({ date: T0, donor: k, donee: x.donee, value: m, bucket: x.bucket });
        res.cashGifts.push({ date: T0, donor: k, donee: x.donee, montant: m, type: x.type, droits: 0 });
      });
    });
  }

  /* ---- PLAN : donations en nue-propriété (vagues tous les 15 ans) ---- */
  var npDonne = {}; // npDonne[assetId][client] = {date, societe}
  var dptFait = {}, vendu = {};
  res.dpt = []; res.fbo = []; res.pvApport = [];
  /* ---- PLAN : family buy out (vente à une société des enfants) ---- */
  if (plan.donations) {
    actifs.slice().forEach(function (a) {
      if (!a.planFBO || a.type === 'financier' || a.type === 'rp' || fractionGrevee(ctx, a, T0) > 0) return;
      vendu[a.id] = true;
      ctx.clients.forEach(function (k) {
        var pk = partClient(a, k, ctx); if (pk <= 0) return;
        var prix = (a.type === 'societe' ? Math.max(0, a.valeur - a.passif) : a.valeur) * pk;
        var pv = plusValue(a, prix, pk, T0);
        var dette = a.type === 'societe' ? 0 : a.passif * pk;
        var frais = prix * (a.type === 'societe' || a.type === 'pro' ? P.fboFraisTitres : P.fboFraisImmo);
        var net = Math.max(0, prix - dette - pv.impot);
        var cap = 0, r = P.fboTaux / 12, n = P.fboDuree * 12, rev = (+a.revenu || 0) * pk * P.fboPonderation;
        cap = r > 0 ? (rev / 12) * (1 - Math.pow(1 + r, -n)) / r : rev * P.fboDuree;
        var aff = a.fboAffectation || 'av';
        if (aff === 'av') {
          var apres70 = ageAt(ctx.persons[k].naissance, T0) >= 70;
          avs.push({ id: 'fbo_' + a.id + '_' + k, libelle: 'Assurance-vie (prix de ' + a.libelle + ')', souscripteur: k, valeur: net, valeurApres70: apres70 ? net : 0, primesApres70: apres70 ? net : 0, nouveau: true });
        } else {
          actifs.push({ id: 'fbo_' + a.id + '_' + k, libelle: 'Prix de vente de ' + a.libelle, type: 'financier', partC1: k === 'c1' ? 100 : 0, valeur: net, passif: 0, cca: 0 });
        }
        res.fbo.push({ actif: a.libelle, actifId: a.id, client: k, prix: prix, dette: dette, impotPV: pv.impot, pv: pv, frais: frais, net: net, affectation: aff, financable: cap, apportNecessaire: Math.max(0, prix + frais - cap) });
      });
    });
  }
  if (plan.donations) {
    actifs.forEach(function (a) {
      if (!a.planDPT || !eligibleDPT(ctx, a)) return;
      var ms = moitiesDPT(ctx, a), k = ms[0].donateur.de, pk = partClient(a, k, ctx);
      if (pk <= 0) { k = autre(k); pk = partClient(a, k, ctx); }
      if (pk <= 0) return;
      // la génération intermédiaire conserve (ou retient) l'usufruit : les petits-enfants ne reçoivent que la nue-propriété
      var ageC = ageAt(ctx.persons[k].naissance, T0), npC = 1 - usufruitPct(ageC);
      var fait = 0;
      ms.forEach(function (m) {
        var valeur = a.valeur * pk * m.part * npC;
        if (m.mode === 'dpt') {
          fait += m.part;
          res.dpt.push({ actif: a.libelle, actifId: a.id, client: k, donateur: m.donateur.label, part: m.part, valeur: valeur, valeurPP: a.valeur * pk * m.part, npPct: npC, droits: 0.025 * valeur, mode: 'dpt', beneficiaires: heritiersDe(ctx, k).map(function (e) { return e.label; }) });
        } else if (m.mode === 'directe') {
          // part du donateur prédécédé : transmise directement par le client (nue-propriété, usufruit conservé)
          fait += m.part;
          var heirs = heritiersDe(ctx, k), tot = 0;
          heirs.forEach(function (e) {
            var v = valeur * e.part, rp = rappel(k, e.id, T0, 'LD'), dr = droitsLD(v, rp, e.abatDon, e.baremeDon);
            ledger.push({ date: T0, donor: k, donee: e.id, value: v, bucket: 'LD' }); tot += dr;
            res.donations.push({ vague: 1, date: T0, donor: k, donorAge: ageC, donee: e.id, actif: a.libelle + ' (part de ' + (m.donateur.prenom || 'parent') + ', prédécédé)', actifId: a.id, valeurPP: a.valeur * pk * m.part * e.part, valeurPPBrute: a.valeur * pk * m.part * e.part, npPct: npC, valeurNP: v, exoneration: 0, regime: '', valeurTaxable: v, societe: false, existante: false, rappel: rp, abattement: e.abatDon, droits: dr });
          });
          res.dpt.push({ actif: a.libelle, actifId: a.id, client: k, donateur: m.donateur.label, part: m.part, valeur: valeur, valeurPP: a.valeur * pk * m.part, npPct: npC, droits: tot, mode: 'directe' });
        }
      });
      if (fait > 0) dptFait[a.id] = fait;
      if ((ms[0].donateur.nbEnfants || 1) <= 1 && heritiersDe(ctx, k).length <= 1) res.warnings.push(a.libelle + ' : la rétention d’un usufruit successif suppose des lots divis ; impossible avec un enfant unique ayant lui-même un enfant unique.');
    });
  }
  if (plan.donations) {
    var vagues = [1, 2, 3];
    vagues.forEach(function (w) {
      var date = addYears(T0, FISC.rappelAns * (w - 1));
      actifs.forEach(function (a) {
        if ((+a.planVague || 0) !== w) return;
        if (a.type === 'financier') return; // 774 bis : pas de donation NP de liquidités avec quasi-usufruit
        if (dptFait[a.id] || vendu[a.id] || fractionGrevee(ctx, a, date) > 0) return; // réattribué, vendu, ou usufruit encore détenu par un parent
        ctx.clients.forEach(function (k) {
          var pk = partClient(a, k, ctx); if (pk <= 0) return;
          if (date >= deaths[k]) { res.warnings.push('Vague ' + w + ' (' + a.libelle + ') : ' + ctx.persons[k].label + ' serait décédé(e) selon son espérance de vie – donation non retenue.'); return; }
          var heirs = heritiersDe(ctx, k); if (!heirs.length) return;
          var age = ageAt(ctx.persons[k].naissance, date);
          var usPct = usufruitPct(age), npPct = 1 - usPct;
          var existante = a.type === 'societe';
          var viaSoc = existante || (plan.societe && a.planSociete && (a.type === 'immo' || a.type === 'rp' || a.type === 'autre'));
          var basePP = viaSoc ? Math.max(0, (a.valeur - a.passif)) * (1 - P.decoteSociete) * pk : a.valeur * pk;
          var valNP = basePP * npPct;
          (npDonne[a.id] = npDonne[a.id] || {})[k] = { date: date, societe: viaSoc, existante: existante };
          heirs.forEach(function (e) {
            var v0 = valNP * e.part;
            var exo = exoneration(a.regime, v0, 1);
            var v = v0 - exo;
            var rp = rappel(k, e.id, date, 'LD');
            var dr = droitsLD(v, rp, e.abatDon, e.baremeDon);
            ledger.push({ date: date, donor: k, donee: e.id, value: v, bucket: 'LD' });
            res.donations.push({ vague: w, date: date, donor: k, donorAge: age, donee: e.id, actif: a.libelle, actifId: a.id, valeurPP: (viaSoc ? basePP : a.valeur * pk) * e.part, valeurPPBrute: a.valeur * pk * e.part, npPct: npPct, valeurNP: v0, exoneration: exo, regime: a.regime || '', valeurTaxable: v, societe: viaSoc, existante: existante, rappel: rp, abattement: e.abatDon, droits: dr });
          });
        });
      });
    });
    // coûts de mise en société (une seule fois par actif)
    if (plan.societe) {
      actifs.forEach(function (a) {
        if (a.type === 'societe' || !a.planSociete || !npDonne[a.id]) return;
        var anySoc = Object.keys(npDonne[a.id]).some(function (k) { return npDonne[a.id][k].societe; });
        if (!anySoc) return;
        var cout = P.fraisFixesSociete + P.fraisActeSocietePct * a.valeur + P.droitApportOnereuxPct * a.passif;
        // l'apport d'un immeuble à une société est une cession : plus-value imposable (sauf résidence principale)
        var impotApport = 0;
        Object.keys(npDonne[a.id]).forEach(function (k) {
          if (!npDonne[a.id][k].societe) return;
          var pk = partClient(a, k, ctx), pv = plusValue(a, a.valeur * pk, pk, npDonne[a.id][k].date);
          impotApport += pv.impot;
          if (pv.impot > 0 || pv.renseigne) res.pvApport.push({ actif: a.libelle, client: k, pv: pv });
        });
        cout += impotApport;
        res.societe.push({ impotPV: impotApport, actif: a.libelle, actifId: a.id, valeur: a.valeur, passif: a.passif, decote: P.decoteSociete, cout: cout, rp: a.type === 'rp' });
      });
    }
  }

  /* ---- Successions ---- */
  var extras = { c1: 0, c2: 0 };   // biens reçus en pleine propriété par le survivant
  var vivant = { c1: true, c2: ctx.clients.length === 2 };

  order.forEach(function (k, idx) {
    var date = deaths[k];
    var age = ageAt(ctx.persons[k].naissance, date);
    var spouse = ctx.clients.length === 2 && vivant[autre(k)] ? autre(k) : null;
    var D = { who: k, date: date, age: age, rang: idx + 1, lignes: [], heirs: [], av: [], avBenef: {}, droits: 0, tax990: 0 };
    // Actif successoral
    var brut = 0, abattRP = 0, passif = 0, exoTot = 0, nbHer = Math.max(1, heritiersDe(ctx, k).length);
    actifs.forEach(function (a) {
      var pk = partClient(a, k, ctx); if (pk <= 0) return;
      if (dptFait[a.id] >= 0.999) { D.lignes.push({ libelle: a.libelle, valeur: 0, note: 'Nue-propriété réattribuée aux enfants ; usufruit successif éteint au décès' }); return; }
      if (vendu[a.id]) { D.lignes.push({ libelle: a.libelle, valeur: 0, note: 'Vendu à la société des enfants (family buy out)' }); return; }
      var don = npDonne[a.id] && npDonne[a.id][k] && npDonne[a.id][k].date <= date;
      // compte courant d'associé : créance des clients sur la société, sauf s'il est remboursé et consommé avant le décès
      if (a.cca > 0 && !P.ccaRembourseAvantDeces) { brut += a.cca * pk; D.lignes.push({ libelle: 'Compte courant d’associé – ' + a.libelle, valeur: a.cca * pk }); }
      if (don) {
        D.lignes.push({ libelle: a.libelle, valeur: 0, note: 'Nue-propriété donnée : usufruit éteint sans droits (art. 1133 CGI)' });
        if (!P.dettesRembourseesAuDeces && !npDonne[a.id][k].societe) passif += a.passif * pk;
        return;
      }
      var v = a.valeur * pk;
      if (a.type === 'societe') {
        // parts de société : actif moins dettes restantes (emprunts, compte courant), décote de non-cotation
        var dettesBanque = Math.max(0, a.passif - a.cca);
        v = Math.max(0, a.valeur - (P.dettesRembourseesAuDeces ? 0 : dettesBanque) - (P.ccaRembourseAvantDeces ? 0 : a.cca)) * (1 - P.decoteSociete) * pk;
      }
      v = v * coefNP(ctx, a, date);                       // nue-propriété reçue encore grevée de l'usufruit d'un parent
      if (dptFait[a.id]) v = v * (1 - dptFait[a.id]);     // part réattribuée hors succession
      var rp = (a.type === 'rp' && P.abattementRP && spouse && ctx.marie) ? 0.2 * v : 0;
      var ex = exoneration(a.regime, v - rp, nbHer);
      brut += v; abattRP += rp; exoTot += ex;
      if (!P.dettesRembourseesAuDeces && a.type !== 'societe') passif += a.passif * pk;
      D.lignes.push({ libelle: a.libelle, valeur: v, abattRP: rp });
    });
    if (extras[k] > 0) { brut += extras[k]; D.lignes.push({ libelle: 'Biens reçus au 1er décès', valeur: extras[k] }); }
    // héritage attendu des parents du client (décédés avant lui selon leur espérance de vie)
    if (P.heritageParents) ctx.parents.forEach(function (p) {
      if (p.de !== k || p.decede || !p.deces || p.deces >= date || p.patrimoine <= 0) return;
      if (plan.donations && P.sautGeneration) return;
      var part = p.patrimoine / Math.max(1, p.nbEnfants);
      brut += part; D.lignes.push({ libelle: 'Héritage attendu de ' + p.label, valeur: part });
    });
    var forfait = P.forfaitMobilier ? 0.05 * brut : 0;
    var net = Math.max(0, brut - abattRP + forfait - passif - exoTot);
    D.actifBrut = brut; D.abattRP = abattRP; D.forfait = forfait; D.passif = passif; D.exoneration = exoTot; D.actifNet = net;

    var heirs = heritiersDe(ctx, k);
    // Option du conjoint
    var partEnfants = 1, fiscalNP = 1, usPct = 0, ageUsuf = 0;
    if (spouse && d.regime === 'universelle') {
      D.option = 'Communauté universelle avec attribution intégrale : tout revient au conjoint';
      partEnfants = 0; extras[spouse] += Math.max(0, brut - passif);
    } else if (spouse && ctx.marie && !enfantsDe(ctx, k).length) {
      partEnfants = 0; extras[spouse] += Math.max(0, brut - passif);
      D.option = 'Pas de descendant : le conjoint recueille toute la succession (parents prédécédés), en franchise de droits';
    } else if (spouse && ctx.marie) {
      if (usufruitTotalPossible(ctx, k)) {
        ageUsuf = Math.max(ageAt(ctx.persons[spouse].naissance, date), P.ageMinPremierDeces);
        usPct = usufruitPct(ageUsuf); fiscalNP = 1 - usPct;
        D.option = 'Conjoint survivant : 100 % en usufruit (valeur ' + Math.round(usPct * 100) + ' %), enfants : nue-propriété (' + Math.round(fiscalNP * 100) + ' %)';
      } else {
        partEnfants = 0.75; extras[spouse] += 0.25 * (brut - passif);
        D.option = 'Enfant(s) non commun(s) sans donation entre époux : conjoint ¼ en pleine propriété, enfants ¾';
      }
    } else if (spouse) {
      D.option = 'Partenaire de PACS : pas héritier sans testament (exonéré s\u2019il est légataire)';
    } else {
      D.option = heirs.length && heirs[0].lien !== 'enfant' ? 'Frères et sœurs héritiers' + (heirs.some(function (h) { return h.rep; }) ? ', neveux et nièces par représentation' : heirs.some(function (h) { return h.lien === 'neveu'; }) ? ' : neveux et nièces de leur propre chef' : '') : 'Enfants héritiers en pleine propriété';
    }
    D.usPct = usPct; D.ageUsufruitier = ageUsuf;

    // Assurance-vie de l'assuré k
    var benef = {}; // id -> {f990, abatAlloc, f757}
    var creance = 0, recuConjointPP = 0;
    function addB(id, f990, abat, f757) { var b = benef[id] = benef[id] || { f990: 0, abat: 0, f757: 0 }; b.f990 += f990; b.abat += abat; b.f757 += f757; }
    var contratsK = avs.filter(function (c) { return c.souscripteur === k; });
    contratsK.forEach(function (c) {
      var v990 = Math.max(0, c.valeur - c.valeurApres70), p757 = c.primesApres70;
      var demembre = plan.av && P.clauseDemembree;
      var lines = [];
      if (spouse && !demembre) {
        lines.push({ id: spouse, cap: 1, f: 1, abatF: 1, exo: true, type: 'PP' });
      } else if (spouse && demembre) {
        var aU = Math.max(ageAt(ctx.persons[spouse].naissance, date), P.ageMinPremierDeces);
        var u = usufruitPct(aU);
        lines.push({ id: spouse, cap: 1, f: u, abatF: 0, exo: true, type: 'Usufruit' });
        heirs.forEach(function (e) {
          var br = [e].concat(P.inclurePetitsEnfantsClause ? generationSuivante(ctx, e) : []);

      var collat = heirs.length && heirs[0].lien !== 'enfant';
      var G1 = collat ? 'frères et sœurs' : 'enfants', G2 = collat ? 'neveux et nièces' : 'petits-enfants';
      D.av.push({ contrat: c.libelle, valeur: c.valeur, clause: spouse ? (demembre ? 'Conjoint usufruitier / ' + G1 + (P.inclurePetitsEnfantsClause ? ' et ' + G2 : '') + ' nus-propriétaires' : 'Conjoint, à défaut les héritiers') : (plan.av && P.clauseDemembree && P.inclurePetitsEnfantsClause ? G1.charAt(0).toUpperCase() + G1.slice(1) + ' usufruitiers / ' + G2 + ' nus-propriétaires' : 'Héritiers par parts égales'), lignes: lines.map(function (l) { return { id: l.id, type: l.type, part: l.f }; }) });

    // 757 B : abattement global de 30 500 € réparti entre bénéficiaires non exonérés

      .reduce(function (s, a) { return s + (+a.valeurOrigine || 0) / (a.donateur2Id && a.donateur2Id !== a.donateurId ? 2 : 1); }, 0);

/* ---------------- Analyse complète ---------------- */
function orders(d) { return (d.situation === 'marie' || d.situation === 'pacs') && d.c2 ? ['c1', 'c2'] : ['c1']; }

// Optimisation des vagues de donation et du recours à la société (descente coordonnée)
function optimiserPlan(d) {

        if (a.type === 'rp' && ctx.P.sciResidencePrincipale && w > 0) { opts.push({ w: w, s: true }); continue; }

      }
      if (+a.revenu > 0 && a.type !== 'rp') opts.push({ w: 0, s: false, f: true });
      var cur = { w: a.planVague, s: a.planSociete, f: !!a.planFBO };

}

// Intérêt du levier société, actif par actif (le reste du plan inchangé)

function analyseComplete(d) {

/* ---------------- IFI (foyer) ---------------- */
var BAREME_IFI = [[800000, 0], [1300000, 0.005], [2570000, 0.007], [5000000, 0.01], [10000000, 0.0125], [Infinity, 0.015]];
function calculIFI(d, avecPlan) {
  var ctx = prepare(d), P = ctx.P, lignes = [], brut = 0, dettes = 0;
  (d.actifs || []).forEach(function (a) {
    var v = +a.valeur || 0, passif = +a.passif || 0, base = 0, dette = 0, note = '';

    if (avecPlan && a.planFBO && a.type !== 'rp' && a.type !== 'financier') { lignes.push({ libelle: a.libelle, base: 0, note: 'Vendu (family buy out)' }); return; }

/* ---------------- Family buy out : capacité de financement par les revenus ---------------- */

  return (d.actifs || []).filter(function (a) { return +a.revenu > 0; }).map(function (a) {
    var v = a.type === 'societe' ? Math.max(0, (+a.valeur || 0) - (+a.passif || 0)) : (+a.valeur || 0);
    var pv = plusValue(a, v, 1, ctx.T0), dette = a.type === 'societe' ? 0 : (+a.passif || 0);

}
function analyseFBO(d) {

    var m0 = moyenne(d0, PLAN_FULL).moyenne, m1 = moyenne(d1, PLAN_FULL).moyenne;

/* ---------------- Situation des abattements à date ---------------- */

        .map(function (x) { return { date: parseDate(x.date), v: +x.montant || 0 }; }).filter(function (x) { return x.date; });

      out.push({ donor: k, donee: e.id, lien: e.lien, abattement: abat, utilise: used, disponible: Math.max(0, abat - used), reconstitution: prochaine });
