<html lang="fr">

<style>
:root {
  color-scheme: light;
  --canvas: #EEF1F3; --paper: #FFFFFF; --ink: #17212B; --muted: #5C6873; --line: #D7DDE2; --field: #FFFFFF;
  --brand: #234E5C; --brand-text: var(--brand); --on-brand: #FFFFFF;
  --soft: color-mix(in srgb, var(--brand) 9%, var(--paper));
  --gain: #2C7A4B; --warn: #9A5516;
  --sans: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #0E1316; --paper: #161D21; --ink: #E3E8EB; --muted: #9AA6AE; --line: #2B353C; --field: #11171B;
    --brand-text: color-mix(in srgb, var(--brand) 55%, #FFFFFF); --soft: color-mix(in srgb, var(--brand) 22%, var(--paper));
    --gain: #6CC08F; --warn: #E0A26A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0E1316; --paper: #161D21; --ink: #E3E8EB; --muted: #9AA6AE; --line: #2B353C; --field: #11171B;
  --brand-text: color-mix(in srgb, var(--brand) 55%, #FFFFFF); --soft: color-mix(in srgb, var(--brand) 22%, var(--paper));
  --gain: #6CC08F; --warn: #E0A26A;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; margin: 0; white-space: nowrap; }
.brand small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12.5px; color: var(--muted); letter-spacing: 0; }
#bandeau { display: flex; gap: 0; margin-left: auto; flex-wrap: wrap; }
.kpi { padding: 2px 18px; border-left: 1px solid var(--line); min-width: 120px; }
.kpi .k { display: block; font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--serif); font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .v.small { font-family: var(--sans); font-size: 15px; font-weight: 600; }
.kpi.gain .v { color: var(--gain); }
.layout { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; padding: 24px; }
nav#nav { position: sticky; top: 96px; align-self: start; display: flex; flex-direction: column; }
nav#nav a { color: var(--muted); text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 600; font-size: 14.5px; counter-increment: s; }
nav#nav a:hover { color: var(--ink); background: var(--soft); }
nav#nav a[aria-current="page"] { color: var(--on-brand); background: var(--brand); }
nav#nav a:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
main#main { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px 34px; min-width: 0; }
main h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0 0 18px; letter-spacing: -0.015em; }
main h3 { font-size: 16px; margin: 26px 0 10px; }
main h3.sub { margin-top: 28px; }
.lead { color: var(--muted); max-width: 72ch; margin: 0 0 16px; }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
.empty { color: var(--muted); font-style: italic; margin: 6px 0 14px; }
.grid { display: grid; gap: 12px 16px; margin-bottom: 12px; }
.g1 { grid-template-columns: 1fr; } .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); } .g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fld small, .chk small { color: var(--muted); font-size: 12px; }
input[type=text], input[type=date], select { width: 100%; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 38px; }
.inwrap { position: relative; }
.inwrap.money input { padding-right: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.inwrap.money::after { content: "€"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.inwrap.pctin input { padding-right: 26px; text-align: right; }
.inwrap.pctin::after { content: "%"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.chk { display: grid; grid-template-columns: 20px 1fr; gap: 2px 8px; align-items: start; padding-top: 22px; cursor: pointer; }
.chk input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); }
.chk small { grid-column: 2; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--paper); }
fieldset.card { margin: 0 0 14px; }
legend { font-weight: 700; padding: 0 6px; font-size: 14px; }
.row { position: relative; margin-bottom: 10px; padding-right: 108px; }
.row .grid { margin: 0; }
.del { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 6px 10px; font: 600 13px var(--sans); cursor: pointer; }
.del:hover { color: var(--warn); border-color: var(--warn); }
.listhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 10px; }
.listhead h3 { margin: 0; }
.btn { font: 600 14.5px var(--sans); background: var(--brand); color: var(--on-brand); border: 1px solid var(--brand); border-radius: 7px; padding: 9px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--brand-text); border-color: color-mix(in srgb, var(--brand-text) 45%, transparent); }
.btn.ghost.danger { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn.big { padding: 13px 22px; font-size: 15.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.exports { display: flex; flex-wrap: wrap; gap: 12px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--soft); white-space: nowrap; }
table.t td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t .n { text-align: right; white-space: nowrap; }
table.t.edit select { min-height: 34px; padding: 5px 8px; }
table.compact td { padding: 6px 0; }
table.compact tr.sec td { padding-top: 14px; font-weight: 700; color: var(--brand-text); border-bottom: 0; }
table.compact td.opt { font-size: 12.5px; color: var(--muted); padding-top: 0; }
table.compact tr.tot td { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 0; padding-top: 10px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.res h4 { margin: 0 0 4px; font-size: 15px; }
.warn { color: var(--warn); font-size: 13px; padding-left: 18px; margin: 10px 0 0; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(150px, 230px) 1fr auto; align-items: center; gap: 14px; }
.step .lbl { font-weight: 600; font-size: 14px; }
.step .val { font-family: var(--serif); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
.bar { display: block; height: 14px; width: var(--w); background: var(--brand); border-radius: 3px; }
.bar.base { background: color-mix(in srgb, var(--ink) 35%, transparent); }
.tag { font-size: 12.5px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
.tag.ok { color: var(--gain); background: color-mix(in srgb, var(--gain) 14%, transparent); }
.tag.ko { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.modele { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 12px; }
.modele p { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; }
.swatches { display: flex; gap: 6px; }
.swatches span { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
label.file { position: relative; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; padding: 12px; gap: 12px; }
  nav#nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  nav#nav a { white-space: nowrap; }
  #bandeau { margin-left: 0; width: 100%; }
  .kpi { padding: 2px 12px; min-width: 0; flex: 1; }
  .kpi.who { display: none; }
  .kpi:first-of-type, .kpi.who + .kpi { border-left: 0; padding-left: 0; }
  .g4, .g5, .g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .top-in { padding: 10px 14px; gap: 8px; }
  main#main { padding: 18px 16px 24px; }
  .g2, .g3, .g4, .g5, .g6 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .row { padding-right: 16px; padding-bottom: 54px; }
  .del { top: auto; bottom: 12px; transform: none; }
  .kpi .v { font-size: 17px; }
  .step { grid-template-columns: 1fr auto; }
  .step .bar { grid-column: 1 / -1; grid-row: 2; }
  .chk { padding-top: 4px; }
}
.install { margin-left: 12px; font: 600 13.5px var(--sans); background: transparent; color: var(--brand-text); border: 1px solid color-mix(in srgb, var(--brand-text) 45%, transparent); border-radius: 7px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.install[hidden] { display: none; }
@media (display-mode: standalone) { .install { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1 class="brand">Audit civil et fiscal<small>Transmission : démembrement, assurance-vie, levier société</small></h1>
  <div id="bandeau" aria-live="polite"></div>
  <button class="install" id="installer" hidden>Installer l’application</button>
</div></header>
<div class="layout">
  <nav id="nav" aria-label="Étapes du dossier"></nav>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============================================================
   Moteur de calcul – Audit civil et fiscal (transmission)
   Barèmes : CGI art. 777 (ligne directe), 779 (abattements),
   669 (usufruit), 990 I et 757 B (assurance-vie), 784 (rappel).
   ============================================================ */
var FISC = {
  baremeLD: [[8072, 0.05], [12109, 0.10], [15932, 0.15], [552324, 0.20], [902838, 0.30], [1805677, 0.40], [Infinity, 0.45]],
  abatEnfant: 100000,
  abatPetitEnfant: 31865,
  abat790G: 31865,
  abatHandicap: 159325,
  abatDefaut: 1594,
  av990Abat: 152500, av990Seuil: 700000, av990T1: 0.20, av990T2: 0.3125,
  av757Abat: 30500,
  rappelAns: 15,
  // [âge maximum inclus, valeur de l'usufruit] – art. 669 CGI
  usufruit: [[20, 0.9], [30, 0.8], [40, 0.7], [50, 0.6], [60, 0.5], [70, 0.4], [80, 0.3], [90, 0.2], [Infinity, 0.1]]
};

// Espérance de vie résiduelle (années) – approximation tables INSEE (France, 2023)
var EV_ANCRES = {
  H: [[0, 79.9], [20, 60.4], [30, 50.0], [40, 40.5], [50, 31.4], [55, 27.1], [60, 23.1], [65, 19.3], [70, 15.7], [75, 12.3], [80, 9.2], [85, 6.5], [90, 4.4], [95, 3.0], [100, 2.1], [110, 1.2]],
  F: [[0, 85.7], [20, 66.0], [30, 55.6], [40, 45.8], [50, 36.3], [55, 31.7], [60, 27.3], [65, 23.2], [70, 19.1], [75, 15.2], [80, 11.4], [85, 8.1], [90, 5.4], [95, 3.6], [100, 2.4], [110, 1.3]]
};

function esperanceVie(sexe, age) {
  var t = EV_ANCRES[sexe === 'F' ? 'F' : 'H'];
  if (age <= t[0][0]) return t[0][1];
  for (var i = 1; i < t.length; i++) {
    if (age <= t[i][0]) {
      var a = t[i - 1], b = t[i];
      return a[1] + (b[1] - a[1]) * (age - a[0]) / (b[0] - a[0]);
    }
  }
  return t[t.length - 1][1];
}

function parseDate(s) { if (!s) return null; var p = String(s).split('-'); if (p.length < 3) return null; return new Date(+p[0], +p[1] - 1, +p[2]); }
function addYears(d, y) { if (Math.round(y) === y) { var n = new Date(d.getTime()); n.setFullYear(n.getFullYear() + y); return n; } return new Date(d.getTime() + y * 365.25 * 864e5); }
function ageAt(naissance, date) {
  var n = typeof naissance === 'string' ? parseDate(naissance) : naissance;
  if (!n || !date) return 0;
  var a = date.getFullYear() - n.getFullYear();
  var m = date.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && date.getDate() < n.getDate())) a--;
  return a;
}
function yearsBetween(a, b) { return (b.getTime() - a.getTime()) / (365.25 * 864e5); }
function usufruitPct(age) { for (var i = 0; i < FISC.usufruit.length; i++) if (age <= FISC.usufruit[i][0]) return FISC.usufruit[i][1]; return 0.1; }

function bareme(x) {
  if (x <= 0) return 0;
  var t = 0, prev = 0;
  for (var i = 0; i < FISC.baremeLD.length; i++) {
    var lim = FISC.baremeLD[i][0], r = FISC.baremeLD[i][1];
    if (x > prev) t += (Math.min(x, lim) - prev) * r;
    prev = lim;
    if (x <= lim) break;
  }
  return t;
}
// Droits en ligne directe avec rappel fiscal : valeur transmise, valeurs rappelées (<15 ans), abattement
function droitsLD(valeur, rappel, abat) {
  valeur = Math.max(0, valeur); rappel = Math.max(0, rappel || 0);
  return Math.max(0, bareme(Math.max(0, valeur + rappel - abat)) - bareme(Math.max(0, rappel - abat)));
}
function taxe990(taxable) {
  if (taxable <= 0) return 0;
  return Math.min(taxable, FISC.av990Seuil) * FISC.av990T1 + Math.max(0, taxable - FISC.av990Seuil) * FISC.av990T2;
}
function round(x) { return Math.round(x); }

/* ---------------- Paramètres par défaut ---------------- */
function defaultParams() {
  return {
    ageMinPremierDeces: 81,       // hypothèse : 1er décès et survivant âgés d'au moins 81 ans
    forfaitMobilier: true,        // art. 764 CGI – 5 %
    abattementRP: true,           // art. 764 bis – 20 % si occupée par le conjoint survivant
    dettesRembourseesAuDeces: true, // emprunts supposés amortis par les revenus avant le décès
    decoteSociete: 0.10,
    fraisFixesSociete: 2500,
    fraisActeSocietePct: 0.015,
    droitApportOnereuxPct: 0.05,  // prise en charge du passif = apport à titre onéreux (immeubles : 5 %)
    clauseDemembree: true,
    inclurePetitsEnfantsClause: true,
    don790GEnfants: false,
    don790GPetitsEnfants: false,
    don790BPetitsEnfants: false
  };
}

/* ---------------- Contexte ---------------- */
function prepare(d) {
  var T0 = parseDate(d.dateEtude) || new Date();
  var couple = d.situation === 'marie' || d.situation === 'pacs';
  var ctx = { d: d, T0: T0, couple: couple, marie: d.situation === 'marie', persons: {}, clients: ['c1'], P: Object.assign(defaultParams(), d.params || {}) };
  if (couple && d.c2) ctx.clients.push('c2');
  ctx.clients.forEach(function (k) {
    var c = d[k];
    var age = ageAt(c.naissance, T0);
    var ev = (c.evOverride !== undefined && c.evOverride !== null && c.evOverride !== '') ? +c.evOverride : esperanceVie(c.sexe, age);
    ctx.persons[k] = { id: k, label: labelClient(c), age: age, ev: ev, sexe: c.sexe, naissance: c.naissance };
  });
  ctx.enfants = (d.enfants || []).map(function (e) {
    return { id: e.id, label: (e.prenom || '') + (e.nom ? ' ' + e.nom : ''), prenom: e.prenom || '', naissance: e.naissance, parent: e.parent || 'commun', handicap: !!e.handicap, age: ageAt(e.naissance, T0) };
  });
  ctx.petitsEnfants = (d.petitsEnfants || []).map(function (p) {
    return { id: p.id, label: (p.prenom || '') + (p.nom ? ' ' + p.nom : ''), prenom: p.prenom || '', naissance: p.naissance, parentId: p.parentId, age: ageAt(p.naissance, T0) };
  });
  ctx.enfants.forEach(function (e) { ctx.persons[e.id] = e; });
  ctx.petitsEnfants.forEach(function (p) { ctx.persons[p.id] = p; });
  return ctx;
}
function labelClient(c) { return ((c.civ || '') + ' ' + (c.prenom || '') + ' ' + (c.nom || '')).replace(/\s+/g, ' ').trim(); }
function heritiersDe(ctx, k) { return ctx.enfants.filter(function (e) { return e.parent === 'commun' || e.parent === k; }); }
function petitsEnfantsDe(ctx, enfantId) { return ctx.petitsEnfants.filter(function (p) { return p.parentId === enfantId; }); }
function autre(k) { return k === 'c1' ? 'c2' : 'c1'; }
function partClient(a, k, ctx) {
  if (!ctx.couple) return k === 'c1' ? 1 : 0;
  var p1 = (a.partC1 === undefined || a.partC1 === null || a.partC1 === '') ? 50 : +a.partC1;
  return k === 'c1' ? p1 / 100 : 1 - p1 / 100;
}
function usufruitTotalPossible(ctx, k) {
  if (!ctx.marie) return false;
  if (ctx.d.ddv) return true;
  return ctx.enfants.every(function (e) { return e.parent === 'commun' || e.parent === autre(k); });
}

/* ---------------- Simulation d'un scénario ----------------
   scen = { order: 'c1'|'c2', plan: {donations:bool, av:bool, societe:bool, cash:bool} }
------------------------------------------------------------ */
function simulate(d, scen) {
  var ctx = prepare(d), P = ctx.P, T0 = ctx.T0;
  var plan = scen.plan || { donations: false, av: false, societe: false, cash: false };
  var order = ctx.clients.length === 2 ? [scen.order || 'c1', autre(scen.order || 'c1')] : ['c1'];

  // Dates de décès
  var deaths = {};
  if (order.length === 2) {
    var f = order[0], s = order[1];
    // 1er décès : à la plus courte des deux espérances de vie, le prémourant ayant au moins l'âge minimum retenu
    var y1 = Math.max(Math.min(ctx.persons.c1.ev, ctx.persons.c2.ev), P.ageMinPremierDeces - ctx.persons[f].age, 0.5);
    var y2 = Math.max(ctx.persons[s].ev, y1 + 1);
    deaths[f] = addYears(T0, y1); deaths[s] = addYears(T0, y2);
  } else {
    deaths.c1 = addYears(T0, Math.max(ctx.persons.c1.ev, 0.5));
  }

  // Copie des actifs (valeurs modifiables par le plan)
  var actifs = (d.actifs || []).map(function (a) { return Object.assign({}, a, { valeur: +a.valeur || 0, passif: +a.passif || 0 }); });
  var avs = (d.av || []).map(function (c) { return Object.assign({}, c, { valeur: +c.valeur || 0, valeurApres70: +c.valeurApres70 || 0, primesApres70: +c.primesApres70 || 0 }); });

  // Registre des donations (rappel fiscal) : antérieures
  var ledger = (d.donations || []).map(function (x) {
    return { date: parseDate(x.date), donor: x.donateur, donee: x.beneficiaireId, value: +x.montant || 0, bucket: x.type === '790G' ? '790G' : 'LD', anterieure: true };
  }).filter(function (x) { return x.date; });

  var res = { order: order, deaths: deaths, donations: [], cashGifts: [], societe: [], deces: [], warnings: [], avVersements: [] };

  // retrait de liquidités chez un client (prorata des actifs financiers)
  function retirerLiquidites(k, montant) {
    var fin = actifs.filter(function (a) { return a.type === 'financier' && partClient(a, k, ctx) > 0; });
    var dispo = fin.reduce(function (s, a) { return s + a.valeur * partClient(a, k, ctx); }, 0);
    var m = Math.min(montant, dispo);
    if (dispo <= 0) return 0;
    fin.forEach(function (a) {
      var pk = partClient(a, k, ctx); var partVal = a.valeur * pk;
      var retrait = m * partVal / dispo;
      // on retire la valeur sur la quote-part de k : ajuste valeur et part
      var autreVal = a.valeur * (1 - pk);
      var nouv = partVal - retrait;
      a.valeur = autreVal + nouv;
      if (ctx.couple) a.partC1 = a.valeur > 0 ? ((k === 'c1' ? nouv : autreVal) / a.valeur) * 100 : 50;
    });
    return m;
  }

  function rappel(donor, donee, date, bucket) {
    var lim = addYears(date, -FISC.rappelAns);
    return ledger.filter(function (x) { return x.donor === donor && x.donee === donee && x.bucket === bucket && x.date > lim && x.date <= date; })
      .reduce(function (s, x) { return s + x.value; }, 0);
  }
  function abatEnfant(e) { return FISC.abatEnfant + (e && e.handicap ? FISC.abatHandicap : 0); }

  /* ---- PLAN : versements assurance-vie ---- */
  if (plan.av) {
    ctx.clients.forEach(function (k) {
      var v = +((d.plan || {}).versementAV || {})[k] || 0;
      if (v > 0) {
        var m = retirerLiquidites(k, v);
        if (m > 0) {
          var apres70 = ctx.persons[k].age >= 70;
          avs.push({ id: 'new_' + k, libelle: 'Nouveau contrat (versement préconisé)', souscripteur: k, valeur: m, valeurApres70: apres70 ? m : 0, primesApres70: apres70 ? m : 0, nouveau: true });
          res.avVersements.push({ client: k, montant: m, apres70: apres70 });
          if (m < v) res.warnings.push('Versement AV de ' + ctx.persons[k].label + ' limité aux liquidités disponibles.');
        }
      }
    });
  }

  /* ---- PLAN : dons de sommes d'argent ---- */
  if (plan.cash) {
    ctx.clients.forEach(function (k) {
      var age = ctx.persons[k].age;
      var dons = [];
      if (P.don790GEnfants && age < 80) heritiersDe(ctx, k).forEach(function (e) { if (e.age >= 18) dons.push({ donee: e.id, montant: FISC.abat790G, bucket: '790G', type: 'Don familial 790 G' }); });
      heritiersDe(ctx, k).forEach(function (e) {
        petitsEnfantsDe(ctx, e.id).forEach(function (p) {
          if (P.don790GPetitsEnfants && age < 80 && p.age >= 18) dons.push({ donee: p.id, montant: FISC.abat790G, bucket: '790G', type: 'Don familial 790 G' });
          if (P.don790BPetitsEnfants) dons.push({ donee: p.id, montant: FISC.abatPetitEnfant, bucket: 'PE', type: 'Don manuel (abatt. 790 B)' });
        });
      });
      dons.forEach(function (x) {
        var rp = rappel(k, x.donee, T0, x.bucket);
        var plafond = x.bucket === '790G' ? FISC.abat790G : FISC.abatPetitEnfant;
        var montant = Math.max(0, Math.min(x.montant, plafond - rp));
        if (montant <= 0) return;
        var m = retirerLiquidites(k, montant);
        if (m <= 0) return;
        ledger.push({ date: T0, donor: k, donee: x.donee, value: m, bucket: x.bucket });
        res.cashGifts.push({ date: T0, donor: k, donee: x.donee, montant: m, type: x.type, droits: 0 });
      });
    });
  }

  /* ---- PLAN : donations en nue-propriété (vagues tous les 15 ans) ---- */
  var npDonne = {}; // npDonne[assetId][client] = {date, societe}
  if (plan.donations) {
    var vagues = [1, 2, 3];
    vagues.forEach(function (w) {
      var date = addYears(T0, FISC.rappelAns * (w - 1));
      actifs.forEach(function (a) {
        if ((+a.planVague || 0) !== w) return;
        if (a.type === 'financier') return; // 774 bis : pas de donation NP de liquidités avec quasi-usufruit
        ctx.clients.forEach(function (k) {
          var pk = partClient(a, k, ctx); if (pk <= 0) return;
          if (date >= deaths[k]) { res.warnings.push('Vague ' + w + ' (' + a.libelle + ') : ' + ctx.persons[k].label + ' serait décédé(e) selon son espérance de vie – donation non retenue.'); return; }
          var heirs = heritiersDe(ctx, k); if (!heirs.length) return;
          var age = ageAt(ctx.persons[k].naissance, date);
          var usPct = usufruitPct(age), npPct = 1 - usPct;
          var viaSoc = plan.societe && a.planSociete && (a.type === 'immo' || a.type === 'rp' || a.type === 'autre');
          var basePP = viaSoc ? Math.max(0, (a.valeur - a.passif)) * (1 - P.decoteSociete) * pk : a.valeur * pk;
          var valNP = basePP * npPct;
          (npDonne[a.id] = npDonne[a.id] || {})[k] = { date: date, societe: viaSoc };
          heirs.forEach(function (e) {
            var v = valNP / heirs.length;
            var rp = rappel(k, e.id, date, 'LD');
            var dr = droitsLD(v, rp, abatEnfant(e));
            ledger.push({ date: date, donor: k, donee: e.id, value: v, bucket: 'LD' });
            res.donations.push({ vague: w, date: date, donor: k, donorAge: age, donee: e.id, actif: a.libelle, actifId: a.id, valeurPP: (viaSoc ? basePP : a.valeur * pk) / heirs.length, valeurPPBrute: a.valeur * pk / heirs.length, npPct: npPct, valeurNP: v, societe: viaSoc, rappel: rp, abattement: abatEnfant(e), droits: dr });
          });
        });
      });
    });
    // coûts de mise en société (une seule fois par actif)
    if (plan.societe) {
      actifs.forEach(function (a) {
        if (!a.planSociete || !npDonne[a.id]) return;
        var anySoc = Object.keys(npDonne[a.id]).some(function (k) { return npDonne[a.id][k].societe; });
        if (!anySoc) return;
        var cout = P.fraisFixesSociete + P.fraisActeSocietePct * a.valeur + P.droitApportOnereuxPct * a.passif;
        res.societe.push({ actif: a.libelle, actifId: a.id, valeur: a.valeur, passif: a.passif, decote: P.decoteSociete, cout: cout });
      });
    }
  }

  /* ---- Successions ---- */
  var extras = { c1: 0, c2: 0 };   // biens reçus en pleine propriété par le survivant
  var vivant = { c1: true, c2: ctx.clients.length === 2 };

  order.forEach(function (k, idx) {
    var date = deaths[k];
    var age = ageAt(ctx.persons[k].naissance, date);
    var spouse = ctx.clients.length === 2 && vivant[autre(k)] ? autre(k) : null;
    var D = { who: k, date: date, age: age, rang: idx + 1, lignes: [], heirs: [], av: [], avBenef: {}, droits: 0, tax990: 0 };
    // Actif successoral
    var brut = 0, abattRP = 0, passif = 0;
    actifs.forEach(function (a) {
      var pk = partClient(a, k, ctx); if (pk <= 0) return;
      var don = npDonne[a.id] && npDonne[a.id][k] && npDonne[a.id][k].date <= date;
      if (don) {
        D.lignes.push({ libelle: a.libelle, valeur: 0, note: 'Nue-propriété donnée : usufruit éteint sans droits (art. 1133 CGI)' });
        if (!P.dettesRembourseesAuDeces && !npDonne[a.id][k].societe) passif += a.passif * pk;
        return;
      }
      var v = a.valeur * pk;
      var rp = (a.type === 'rp' && P.abattementRP && spouse && ctx.marie) ? 0.2 * v : 0;
      brut += v; abattRP += rp;
      if (!P.dettesRembourseesAuDeces) passif += a.passif * pk;
      D.lignes.push({ libelle: a.libelle, valeur: v, abattRP: rp });
    });
    if (extras[k] > 0) { brut += extras[k]; D.lignes.push({ libelle: 'Biens reçus au 1er décès', valeur: extras[k] }); }
    var forfait = P.forfaitMobilier ? 0.05 * brut : 0;
    var net = Math.max(0, brut - abattRP + forfait - passif);
    D.actifBrut = brut; D.abattRP = abattRP; D.forfait = forfait; D.passif = passif; D.actifNet = net;

    var heirs = heritiersDe(ctx, k);
    // Option du conjoint
    var partEnfants = 1, fiscalNP = 1, usPct = 0, ageUsuf = 0;
    if (spouse && d.regime === 'universelle') {
      D.option = 'Communauté universelle avec attribution intégrale : tout revient au conjoint';
      partEnfants = 0; extras[spouse] += Math.max(0, brut - passif);
    } else if (spouse && ctx.marie) {
      if (usufruitTotalPossible(ctx, k)) {
        ageUsuf = Math.max(ageAt(ctx.persons[spouse].naissance, date), P.ageMinPremierDeces);
        usPct = usufruitPct(ageUsuf); fiscalNP = 1 - usPct;
        D.option = 'Conjoint survivant : 100 % en usufruit (valeur ' + Math.round(usPct * 100) + ' %), enfants : nue-propriété (' + Math.round(fiscalNP * 100) + ' %)';
      } else {
        partEnfants = 0.75; extras[spouse] += 0.25 * (brut - passif);
        D.option = 'Enfant(s) non commun(s) sans donation entre époux : conjoint ¼ en pleine propriété, enfants ¾';
      }
    } else if (spouse) {
      D.option = 'Partenaire de PACS : pas héritier sans testament (exonéré s\u2019il est légataire)';
    } else {
      D.option = 'Enfants héritiers en pleine propriété';
    }
    D.usPct = usPct; D.ageUsufruitier = ageUsuf;

    // Assurance-vie de l'assuré k
    var benef = {}; // id -> {f990, abatAlloc, f757}
    var creance = 0, recuConjointPP = 0;
    function addB(id, f990, abat, f757) { var b = benef[id] = benef[id] || { f990: 0, abat: 0, f757: 0 }; b.f990 += f990; b.abat += abat; b.f757 += f757; }
    var contratsK = avs.filter(function (c) { return c.souscripteur === k; });
    contratsK.forEach(function (c) {
      var v990 = Math.max(0, c.valeur - c.valeurApres70), p757 = c.primesApres70;
      var demembre = plan.av && P.clauseDemembree;
      var lines = [];
      if (spouse && !demembre) {
        lines.push({ id: spouse, cap: 1, f: 1, abatF: 1, exo: true, type: 'PP' });
      } else if (spouse && demembre) {
        var aU = Math.max(ageAt(ctx.persons[spouse].naissance, date), P.ageMinPremierDeces);
        var u = usufruitPct(aU);
        lines.push({ id: spouse, cap: 1, f: u, abatF: 0, exo: true, type: 'Usufruit' });
        heirs.forEach(function (e) {
          var br = [e].concat(P.inclurePetitsEnfantsClause ? petitsEnfantsDe(ctx, e.id) : []);
          br.forEach(function (m) { lines.push({ id: m.id, cap: 0, f: (1 - u) / heirs.length / br.length, abatF: (1 - u), exo: false, type: 'Nue-propriété' }); });
        });
      } else {
        heirs.forEach(function (e) {
          var pes = petitsEnfantsDe(ctx, e.id);
          if (plan.av && P.clauseDemembree && P.inclurePetitsEnfantsClause && pes.length) {
            var aE = ageAt(e.naissance, date), uE = usufruitPct(aE);
            pes.forEach(function (p) {
              lines.push({ id: e.id, cap: 1 / heirs.length / pes.length, f: uE / heirs.length / pes.length, abatF: uE, exo: false, type: 'Usufruit' });
              lines.push({ id: p.id, cap: 0, f: (1 - uE) / heirs.length / pes.length, abatF: 1 - uE, exo: false, type: 'Nue-propriété' });
            });
          } else {
            lines.push({ id: e.id, cap: 1 / heirs.length, f: 1 / heirs.length, abatF: 1, exo: false, type: 'PP' });
          }
        });
      }
      lines.forEach(function (l) {
        addB(l.id, v990 * l.f, l.exo ? 0 : FISC.av990Abat * l.abatF, p757 * l.f);
        if (l.exo) benef[l.id].exo = true;
      });
      if (spouse && !demembre) recuConjointPP += c.valeur;
      D.av.push({ contrat: c.libelle, valeur: c.valeur, clause: spouse ? (demembre ? 'Conjoint usufruitier / ' + (P.inclurePetitsEnfantsClause ? 'enfants et petits-enfants' : 'enfants') + ' nus-propriétaires' : 'Conjoint, à défaut les enfants') : (plan.av && P.clauseDemembree && P.inclurePetitsEnfantsClause ? 'Enfants usufruitiers / petits-enfants nus-propriétaires' : 'Enfants par parts égales'), lignes: lines.map(function (l) { return { id: l.id, type: l.type, part: l.f }; }) });
    });
    // 990 I
    var tot990 = 0, avBenef = {};
    Object.keys(benef).forEach(function (id) {
      var b = benef[id];
      var abat = b.exo ? 0 : Math.min(FISC.av990Abat, b.abat);
      var taxable = b.exo ? 0 : Math.max(0, b.f990 - abat);
      var t = b.exo ? 0 : taxe990(taxable);
      tot990 += t;
      avBenef[id] = { fiscal990: b.f990, abat: abat, taxable: taxable, tax990: t, f757: b.f757, exo: !!b.exo };
    });
    // 757 B : abattement global de 30 500 € réparti entre bénéficiaires non exonérés
    var tot757 = Object.keys(avBenef).reduce(function (s, id) { return s + (avBenef[id].exo ? 0 : avBenef[id].f757); }, 0);
    Object.keys(avBenef).forEach(function (id) {
      var b = avBenef[id];
      b.base757 = (!b.exo && tot757 > 0) ? Math.max(0, b.f757 - FISC.av757Abat * b.f757 / tot757) : 0;
    });
    // créance de restitution (quasi-usufruit du conjoint sur les capitaux démembrés)
    if (spouse && plan.av && P.clauseDemembree) creance = contratsK.reduce(function (s, c) { return s + c.valeur; }, 0) - tot990;
    if (spouse && recuConjointPP > 0) extras[spouse] += recuConjointPP;
    D.avBenef = avBenef; D.tax990 = tot990; D.creance = creance; D.avRecuConjoint = recuConjointPP;

    // Droits de succession par héritier
    var droitsSucc = 0;
    heirs.forEach(function (e) {
      var base = partEnfants === 0 ? 0 : net * partEnfants * fiscalNP / heirs.length;
      var b757 = avBenef[e.id] ? avBenef[e.id].base757 : 0;
      var rp = rappel(k, e.id, date, 'LD');
      var abat = abatEnfant(e);
      var dr = droitsLD(base + b757, rp, abat);
      droitsSucc += dr;
      D.heirs.push({ id: e.id, label: e.label, base: base, base757: b757, rappel: rp, abattement: abat, abatDispo: Math.max(0, abat - rp), droits: dr, av990: avBenef[e.id] ? avBenef[e.id].tax990 : 0 });
    });
    // Petits-enfants : part 757 B éventuelle (abattement 1 594 €)
    ctx.petitsEnfants.forEach(function (p) {
      var b = avBenef[p.id]; if (!b) return;
      var dr = b.base757 > 0 ? droitsLD(b.base757, rappel(k, p.id, date, 'PE'), FISC.abatDefaut) : 0;
      droitsSucc += dr;
      D.heirs.push({ id: p.id, label: p.label, petitEnfant: true, base: 0, base757: b.base757, rappel: 0, abattement: FISC.abatDefaut, abatDispo: FISC.abatDefaut, droits: dr, av990: b.tax990 });
    });
    D.droitsSucc = droitsSucc;
    D.droits = droitsSucc + tot990;
    res.deces.push(D);
    vivant[k] = false;
  });

  res.droitsDonations = res.donations.reduce(function (s, x) { return s + x.droits; }, 0);
  res.coutsSociete = res.societe.reduce(function (s, x) { return s + x.cout; }, 0);
  res.droitsSuccessions = res.deces.reduce(function (s, x) { return s + x.droitsSucc; }, 0);
  res.taxesAV = res.deces.reduce(function (s, x) { return s + x.tax990; }, 0);
  res.total = res.droitsDonations + res.droitsSuccessions + res.taxesAV + res.coutsSociete;
  return res;
}

/* ---------------- Analyse complète ---------------- */
function orders(d) { return (d.situation === 'marie' || d.situation === 'pacs') && d.c2 ? ['c1', 'c2'] : ['c1']; }
var PLAN_NONE = { donations: false, av: false, societe: false, cash: false };
var PLAN_FULL = { donations: true, av: true, societe: true, cash: true };

function moyenne(d, plan) {
  var os = orders(d), s = 0, rs = [];
  os.forEach(function (o) { var r = simulate(d, { order: o, plan: plan }); rs.push(r); s += r.total; });
  return { moyenne: s / os.length, resultats: rs };
}

// Optimisation des vagues de donation et du recours à la société (descente coordonnée)
function optimiserPlan(d) {
  var dd = JSON.parse(JSON.stringify(d));
  var ctx = prepare(dd);
  var cand = dd.actifs.filter(function (a) { return a.type !== 'financier' && (+a.valeur || 0) > 0; });
  var maxVague = 1;
  ctx.clients.forEach(function (k) { var ev = ctx.persons[k].ev; if (ev > 16) maxVague = Math.max(maxVague, 2); if (ev > 31) maxVague = Math.max(maxVague, 3); });
  function cout() { return moyenne(dd, PLAN_FULL).moyenne; }
  cand.forEach(function (a) { a.planVague = 1; a.planSociete = false; });
  var best = cout();
  for (var pass = 0; pass < 3; pass++) {
    var improved = false;
    cand.forEach(function (a) {
      var opts = [];
      for (var w = 0; w <= maxVague; w++) {
        opts.push({ w: w, s: false });
        if (w > 0 && a.type !== 'rp' && (+a.passif > 0 || (ctx.P.decoteSociete > 0))) opts.push({ w: w, s: true });
      }
      var cur = { w: a.planVague, s: a.planSociete };
      opts.forEach(function (o) {
        a.planVague = o.w; a.planSociete = o.s;
        var c = cout();
        if (c < best - 1) { best = c; cur = o; improved = true; }
      });
      a.planVague = cur.w; a.planSociete = cur.s;
    });
    if (!improved) break;
  }
  return dd.actifs.map(function (a) { return { id: a.id, planVague: a.planVague || 0, planSociete: !!a.planSociete }; });
}

// Intérêt du levier société, actif par actif (le reste du plan inchangé)
function analyseLevier(d) {
  var out = [];
  (d.actifs || []).forEach(function (a) {
    if (a.type === 'financier' || !(+a.planVague > 0)) return;
    var d0 = JSON.parse(JSON.stringify(d)), d1 = JSON.parse(JSON.stringify(d));
    d0.actifs.forEach(function (x) { if (x.id === a.id) x.planSociete = false; });
    d1.actifs.forEach(function (x) { if (x.id === a.id) x.planSociete = true; });
    var m0 = moyenne(d0, PLAN_FULL), m1 = moyenne(d1, PLAN_FULL);
    var soc = (m1.resultats[0].societe.filter(function (s) { return s.actifId === a.id; })[0]) || { cout: 0 };
    var droits0 = m0.moyenne, droits1 = m1.moyenne - soc.cout;
    out.push({ actifId: a.id, actif: a.libelle, valeur: +a.valeur, passif: +a.passif || 0, droitsDirect: droits0, droitsSociete: droits1, cout: soc.cout, gainNet: droits0 - (droits1 + soc.cout), retenu: !!a.planSociete });
  });
  return out;
}

function analyseComplete(d) {
  var etapes = [
    { cle: 'aucune', label: 'Sans action', plan: PLAN_NONE },
    { cle: 'av', label: 'Clauses AV et versements', plan: { donations: false, av: true, societe: false, cash: false } },
    { cle: 'np', label: '+ Donations en nue-propriété', plan: { donations: true, av: true, societe: false, cash: true } },
    { cle: 'complet', label: '+ Levier société', plan: PLAN_FULL }
  ];
  var A = { etapes: [], ordres: orders(d) };
  etapes.forEach(function (e) {
    var m = moyenne(d, e.plan);
    A.etapes.push({ cle: e.cle, label: e.label, moyenne: m.moyenne, resultats: m.resultats });
  });
  A.sans = A.etapes[0]; A.plan = A.etapes[3];
  A.levier = analyseLevier(d);
  A.ctx = prepare(d);
  A.gain = A.sans.moyenne - A.plan.moyenne;
  return A;
}

/* ---------------- Situation des abattements à date ---------------- */
function etatAbattements(d) {
  var ctx = prepare(d), out = [];
  ctx.clients.forEach(function (k) {
    heritiersDe(ctx, k).forEach(function (e) {
      var dons = (d.donations || []).filter(function (x) { return x.donateur === k && x.beneficiaireId === e.id && x.type !== '790G'; })
        .map(function (x) { return { date: parseDate(x.date), v: +x.montant || 0 }; }).filter(function (x) { return x.date; });
      var lim = addYears(ctx.T0, -FISC.rappelAns);
      var actifs = dons.filter(function (x) { return x.date > lim; });
      var used = actifs.reduce(function (s, x) { return s + x.v; }, 0);
      var abat = FISC.abatEnfant + (e.handicap ? FISC.abatHandicap : 0);
      var prochaine = actifs.length ? addYears(new Date(Math.max.apply(null, actifs.map(function (x) { return x.date.getTime(); }))), FISC.rappelAns) : null;
      out.push({ donor: k, donee: e.id, utilise: used, disponible: Math.max(0, abat - used), reconstitution: prochaine });
    });
  });

  function sFamille(M, A) {

    S.text(Z.x, Z.y, Z.w, Z.h * 0.2, phr.map(function (t) { return { runs: [t], spcAft: 3 }; }), { sz: 1400 });

      state.actifs.forEach(function (a, i) {
        if (a.type === 'financier') return;
        html += '<tr><td>' + h(a.libelle) + '</td><td class="n">' + eur(a.valeur) + '</td><td class="n">' + (a.passif ? eur(a.passif) : '–') + '</td><td><select data-path="actifs.' + i + '.planVague" data-type="num" aria-label="Vague de donation">' + [[0, 'Conserver'], [1, 'Aujourd’hui'], [2, 'Dans 15 ans'], [3, 'Dans 30 ans']].map(function (o) { return '<option value="' + o[0] + '"' + (+a.planVague === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></td><td><input type="checkbox" data-path="actifs.' + i + '.planSociete" data-type="bool" aria-label="Transmettre via une SCI"' + (a.planSociete ? ' checked' : '') + (a.type === 'pro' ? ' disabled' : '') + '></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<h3 class="sub">Assurance-vie</h3><div class="grid g2">' + field('Clauses bénéficiaires démembrées', 'params.clauseDemembree', 'check', { hint: 'Conjoint usufruitier ; à défaut, enfants usufruitiers.' }) +
      field('Petits-enfants nus-propriétaires', 'params.inclurePetitsEnfantsClause', 'check', { hint: 'Avec les enfants (par souche) sous l’usufruit du conjoint ; seuls sous l’usufruit de leur parent ensuite.' }) + '</div>';
    html += '<div class="grid g2">';
    ['c1'].concat(couple() ? ['c2'] : []).forEach(function (k) {
      var age = state[k].naissance ? CALC.ageAt(state[k].naissance, CALC.parseDate(state.dateEtude) || new Date()) : 0;
      html += field('Versement AV préconisé – ' + nomClient(k), 'plan.versementAV.' + k, 'money', { hint: age >= 70 ? 'Plus de 70 ans : primes soumises à l’art. 757 B.' : 'Avant 70 ans : abattement de 152 500 € par bénéficiaire.' });
    });
    html += '</div><h3 class="sub">Dons de sommes d’argent</h3><div class="grid g3">' +
      field('Don familial 790 G aux enfants majeurs', 'params.don790GEnfants', 'check', { hint: '31 865 € par enfant, donateur de moins de 80 ans.' }) +
      field('Don familial 790 G aux petits-enfants majeurs', 'params.don790GPetitsEnfants', 'check') +
      field('Don aux petits-enfants (abatt. 31 865 €)', 'params.don790BPetitsEnfants', 'check') + '</div>';
    return html;
  }
  function rHypotheses() {
    return '<p class="lead">Hypothèses de l’étude. Par défaut : premier décès après 81 ans, conjoint optant pour l’usufruit total valorisé à 20 %.</p><div class="grid g3">' +
      field('Âge minimum au 1er décès', 'params.ageMinPremierDeces', 'num', { hint: 'Fixe aussi l’âge minimum de l’usufruitier (art. 669).' }) +
      field('Décote sur parts de SCI', 'params.decoteSociete', 'pct') +
      field('Frais fixes de création de SCI', 'params.fraisFixesSociete', 'money') +
      field('Frais d’acte (% de la valeur apportée)', 'params.fraisActeSocietePct', 'pct') +
      field('Droits sur passif repris par la SCI', 'params.droitApportOnereuxPct', 'pct', { hint: 'Apport à titre onéreux d’immeuble : 5 %.' }) + '</div><div class="grid g3">' +
      field('Forfait mobilier de 5 %', 'params.forfaitMobilier', 'check') +
      field('Abattement de 20 % sur la résidence principale', 'params.abattementRP', 'check') +
      field('Emprunts remboursés avant les décès', 'params.dettesRembourseesAuDeces', 'check') + '</div>';
  }
  function bar(v, mx, cls) { return '<span class="bar ' + (cls || '') + '" style="--w:' + Math.max(1, Math.round(100 * v / (mx || 1))) + '%"></span>'; }
  function rAnalyse() {
    if (!analyse) return '<p class="empty">Complétez au minimum les dates de naissance des clients et un enfant pour lancer l’analyse.</p>';
    var A = analyse, html = '';
    var mx = Math.max.apply(null, A.etapes.map(function (e) { return e.moyenne; }));
    html += '<h3>Effet de chaque levier</h3><div class="steps">' + A.etapes.map(function (e, i) { return '<div class="step"><span class="lbl">' + h(e.label) + '</span>' + bar(e.moyenne, mx, i === 0 ? 'base' : '') + '<span class="val">' + eur(e.moyenne) + '</span></div>'; }).join('') + '</div><p class="note">Moyenne des deux ordres de décès possibles, droits de donation et coûts de société inclus.</p>';
    function bloc(E, titre, avecDon) {
      var s = '<h3>' + titre + '</h3><div class="cols">';
      E.resultats.forEach(function (r) {
        s += '<div class="res card"><h4>' + (r.deces.length > 1 ? 'Si ' + h(nomClient(r.deces[0].who)) + ' décède en premier' : 'Au décès') + '</h4><table class="t compact"><tbody>';
        r.deces.forEach(function (D, i) {
          s += '<tr class="sec"><td colspan="2">' + (i ? '2nd' : '1er') + ' décès en ' + D.date.getFullYear() + ' (' + D.age + ' ans)</td></tr>';
          s += '<tr><td colspan="2" class="opt">' + h(D.option) + '</td></tr>';
          s += '<tr><td>Actif taxable</td><td class="n">' + eur(D.actifNet) + '</td></tr><tr><td>Droits de succession</td><td class="n">' + eur(D.droitsSucc) + '</td></tr><tr><td>Prélèvement AV (990 I)</td><td class="n">' + eur(D.tax990) + '</td></tr>';
          if (D.creance) s += '<tr><td>Créance de restitution</td><td class="n">' + eur(D.creance) + '</td></tr>';
        });
        if (avecDon) { s += '<tr class="sec"><td colspan="2">Plan</td></tr><tr><td>Droits de donation</td><td class="n">' + eur(r.droitsDonations) + '</td></tr>'; if (r.coutsSociete) s += '<tr><td>Coûts société</td><td class="n">' + eur(r.coutsSociete) + '</td></tr>'; }
        s += '<tr class="tot"><td>Total</td><td class="n">' + eur(r.total) + '</td></tr></tbody></table>';
        if (r.warnings.length) s += '<ul class="warn">' + r.warnings.map(function (w) { return '<li>' + h(w) + '</li>'; }).join('') + '</ul>';
        s += '</div>';
      });
      return s + '</div>';
    }
    html += bloc(A.sans, 'Sans action', false);
    var r0 = A.plan.resultats[0];
    if (r0.donations.length) {
      html += '<h3>Plan de donation en nue-propriété</h3><div class="tablewrap"><table class="t"><thead><tr><th>Année</th><th>Donateur</th><th>Donataire</th><th>Bien</th><th class="n">Valeur PP</th><th class="n">NP</th><th class="n">Valeur NP</th><th class="n">Abatt. restant</th><th class="n">Droits</th></tr></thead><tbody>' +
        r0.donations.map(function (x) { return '<tr><td>' + x.date.getFullYear() + '</td><td>' + h(nomClient(x.donor)) + ' (' + x.donorAge + ' ans)</td><td>' + h(A.ctx.persons[x.donee].prenom) + '</td><td>' + h(x.actif) + (x.societe ? ' <em>(SCI)</em>' : '') + '</td><td class="n">' + eur(x.valeurPP) + '</td><td class="n">' + Math.round(x.npPct * 100) + ' %</td><td class="n">' + eur(x.valeurNP) + '</td><td class="n">' + eur(Math.max(0, x.abattement - x.rappel)) + '</td><td class="n">' + eur(x.droits) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    if (A.levier.length) {
      html += '<h3>Levier société</h3><div class="tablewrap"><table class="t"><thead><tr><th>Bien</th><th class="n">Droits sans SCI</th><th class="n">Avec SCI</th><th class="n">Coûts</th><th class="n">Gain net</th><th>Verdict</th></tr></thead><tbody>' +
        A.levier.map(function (l) { return '<tr><td>' + h(l.actif) + '</td><td class="n">' + eur(l.droitsDirect) + '</td><td class="n">' + eur(l.droitsSociete) + '</td><td class="n">' + eur(l.cout) + '</td><td class="n">' + eur(l.gainNet) + '</td><td><span class="tag ' + (l.gainNet > 0 ? 'ok' : 'ko') + '">' + (l.gainNet > 0 ? (l.retenu ? 'Retenu' : 'Intéressant') : 'Écarté') + '</span></td></tr>'; }).join('') + '</tbody></table></div><p class="note">Le levier « marche » lorsque l’économie de droits sur la valeur des parts (passif déduit, décote) dépasse les frais d’actes et les droits de 5 % sur le passif repris.</p>';
    }
    html += bloc(A.plan, 'Après la stratégie', true);
    return html;
  }
  function rExports() {
    var html = '<h3>Modèle PowerPoint</h3>';
    if (modeleInfo) {
      html += '<div class="card modele"><div><strong>' + h(modeleInfo.nom) + '</strong><p>' + modeleInfo.slides + ' diapositives, format ' + modeleInfo.format + ', polices ' + h(modeleInfo.theme.major) + ' / ' + h(modeleInfo.theme.minor) + '. ' + modeleInfo.reconnues + ' diapositives pédagogiques sur ' + modeleInfo.total + ' reconnues et réutilisées.</p><div class="swatches">' +
        ['dk2', 'accent1', 'accent2', 'accent3', 'accent4', 'lt2'].map(function (k) { var c = modeleInfo.theme.colors[k]; return c ? '<span title="' + k + '" style="background:#' + c + '"></span>' : ''; }).join('') + '</div></div><button class="btn ghost" data-act="oublier-modele">Retirer</button></div>';
    } else {
      html += '<p class="lead">Chargez votre fichier <strong>AUDIT CIVIL ET FISCAL.pptx</strong> : la présentation générée en reprend le masque, les logos, les couleurs, les polices et les diapositives pédagogiques (barèmes, démembrement, assurance-vie, clauses). Il est mémorisé dans ce navigateur.</p>';
    }
    html += '<label class="btn file">' + (modeleInfo ? 'Remplacer le modèle' : 'Charger le modèle .pptx') + '<input type="file" accept=".pptx" data-act="modele" hidden></label>';
    html += '<h3>Livrables</h3><div class="exports"><button class="btn big" data-act="pptx"' + (modele && analyse ? '' : ' disabled') + '>Générer le PowerPoint</button><button class="btn big" data-act="xlsx"' + (analyse ? '' : ' disabled') + '>Générer l’Excel</button></div>';
    if (!modele) html += '<p class="note">Le PowerPoint nécessite le modèle ci-dessus.</p>';
    html += '<h3>Dossier client</h3><div class="exports"><button class="btn ghost" data-act="json">Enregistrer le dossier (.json)</button><label class="btn ghost file">Ouvrir un dossier<input type="file" accept=".json,application/json" data-act="ouvrir" hidden></label><button class="btn ghost" data-act="exemple">Charger l’exemple</button><button class="btn ghost danger" data-act="nouveau">Nouveau dossier</button></div>';
    return html;
  }

  var SECTIONS = [
    { id: 'clients', t: 'Clients', r: rClients },
    { id: 'famille', t: 'Famille', r: rFamille },
    { id: 'donations', t: 'Donations antérieures', r: rDonations },
    { id: 'patrimoine', t: 'Patrimoine', r: rPatrimoine },
    { id: 'strategie', t: 'Stratégie', r: rStrategie },
    { id: 'hypotheses', t: 'Hypothèses', r: rHypotheses },
    { id: 'analyse', t: 'Analyse', r: rAnalyse },
    { id: 'exports', t: 'Exports', r: rExports }
  ];
  function courante() { var x = (location.hash || '').slice(1); return SECTIONS.some(function (s) { return s.id === x; }) ? x : 'clients'; }
  function rendre() {
    var cur = courante();
    $('#nav').innerHTML = SECTIONS.map(function (s) { return '<a href="#' + s.id + '"' + (s.id === cur ? ' aria-current="page"' : '') + '>' + h(s.t) + '</a>'; }).join('');
    var sec = SECTIONS.filter(function (s) { return s.id === cur; })[0];
    $('#main').innerHTML = '<h2>' + h(sec.t) + '</h2>' + sec.r();
    rendreBandeau();
    var act = $('#nav a[aria-current]'); if (act && act.scrollIntoView) { try { act.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) { } }
  }
  function rendreBandeau() {
    var b = $('#bandeau');
    if (!analyse) { b.innerHTML = '<div class="kpi"><span class="k">Analyse</span><span class="v small">En attente des données</span></div>'; return; }
    var nom = [state.c1.nom, couple() ? state.c2.nom : ''].filter(Boolean);
    b.innerHTML = '<div class="kpi who"><span class="k">Dossier</span><span class="v small">' + h(nom.length ? (nom[0] === nom[1] || nom.length === 1 ? 'Famille ' + nom[0] : nom.join(' – ')) : 'Sans nom') + '</span></div>' +
      '<div class="kpi"><span class="k">Sans action</span><span class="v">' + eur(analyse.sans.moyenne) + '</span></div>' +
      '<div class="kpi"><span class="k">Avec la stratégie</span><span class="v">' + eur(analyse.plan.moyenne) + '</span></div>' +
      '<div class="kpi gain"><span class="k">Économie</span><span class="v">' + eur(analyse.gain) + '</span></div>';
  }
  function pret() { return state.c1 && state.c1.naissance && (!couple() || state.c2.naissance) && state.enfants.length && state.enfants.every(function (e) { return e.naissance; }); }
  function calculer() {
    try { analyse = pret() ? CALC.analyseComplete(clone(state)) : null; }
    catch (e) { console.error(e); analyse = null; }
  }
  var tCalc = null;
  function planifier(rerender) {
    sauver();
    clearTimeout(tCalc);
    tCalc = setTimeout(function () { calculer(); if (rerender || courante() === 'analyse' || courante() === 'exports') rendre(); else rendreBandeau(); }, 250);
  }

  /* ---------- Événements ---------- */
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.path) {
      set(el.dataset.path, lire(el));
      var structural = /^(situation|regime|c1\.naissance|c2\.naissance|c1\.sexe|c2\.sexe|c1\.civ|c2\.civ|dateEtude|actifs\.\d+\.type|enfants\.\d+\.prenom)$/.test(el.dataset.path);
      planifier(structural || courante() === 'strategie');
      if (el.dataset.type === 'num' && el.closest('.money')) el.value = Number(get(el.dataset.path) || 0).toLocaleString('fr-FR');
      return;
    }
    if (el.dataset && el.dataset.act === 'modele' && el.files[0]) chargerModele(el.files[0]);
    if (el.dataset && el.dataset.act === 'ouvrir' && el.files[0]) {
      el.files[0].text().then(function (t) { try { state = normaliser(JSON.parse(t)); planifier(true); toast('Dossier ouvert.'); } catch (e) { toast('Ce fichier n’est pas un dossier valide.'); } });
    }
  });
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.path && el.type !== 'checkbox' && el.tagName === 'INPUT' && el.type !== 'date') { set(el.dataset.path, lire(el)); planifier(false); }
  });
  document.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT') return;
    var a = b.dataset.act, i = +b.dataset.i;
    if (a === 'add-enfant') state.enfants.push({ id: uid('e'), prenom: '', nom: state.c1.nom || '', naissance: '', parent: 'commun', handicap: false });
    if (a === 'del-enfant') { var id = state.enfants[i].id; state.enfants.splice(i, 1); state.petitsEnfants = state.petitsEnfants.filter(function (p) { return p.parentId !== id; }); state.donations = state.donations.filter(function (x) { return x.beneficiaireId !== id; }); }
    if (a === 'add-pe') state.petitsEnfants.push({ id: uid('p'), prenom: '', nom: '', naissance: '', parentId: state.enfants[0].id });
    if (a === 'del-pe') { var pid = state.petitsEnfants[i].id; state.petitsEnfants.splice(i, 1); state.donations = state.donations.filter(function (x) { return x.beneficiaireId !== pid; }); }
    if (a === 'add-don') state.donations.push({ id: uid('d'), date: '', donateur: 'c1', beneficiaireId: (state.enfants[0] || state.petitsEnfants[0]).id, montant: 0, type: 'PP' });
    if (a === 'del-don') state.donations.splice(i, 1);
    if (a === 'add-actif') state.actifs.push({ id: uid('a'), libelle: 'Nouveau bien', type: 'immo', partC1: 50, valeur: 0, passif: 0, planVague: 0, planSociete: false });
    if (a === 'del-actif') state.actifs.splice(i, 1);
    if (a === 'add-av') state.av.push({ id: uid('v'), libelle: 'Contrat', souscripteur: 'c1', valeur: 0, valeurApres70: 0, primesApres70: 0 });
    if (a === 'del-av') state.av.splice(i, 1);
    if (a === 'optimiser') {
      if (!pret()) { toast('Complétez d’abord clients, enfants et dates de naissance.'); return; }
      b.disabled = true; b.textContent = 'Optimisation…';
      setTimeout(function () {
        try { var opt = CALC.optimiserPlan(clone(state)); opt.forEach(function (o) { var x = state.actifs.filter(function (y) { return y.id === o.id; })[0]; if (x) { x.planVague = o.planVague; x.planSociete = o.planSociete; } }); toast('Plan optimisé : vagues et recours à la SCI mis à jour.'); }
        catch (e) { console.error(e); toast('L’optimisation n’a pas abouti : vérifiez les données saisies.'); }
        planifier(true);
      }, 30);
      return;
    }
    if (a === 'pptx') return genererPPTX(b);
    if (a === 'xlsx') return genererXLSX(b);
    if (a === 'json') return enregistrer(nomFichier('Dossier') + '.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    if (a === 'exemple') { state = clone(EXEMPLE); state.dateEtude = today(); toast('Exemple chargé.'); }
    if (a === 'nouveau') { if (!confirm('Effacer le dossier en cours ?')) return; state = clone(VIDE); state.dateEtude = today(); location.hash = '#clients'; }
    if (a === 'oublier-modele') { modele = null; modeleInfo = null; await idbDel('modele'); appliquerTheme(null); toast('Modèle retiré.'); }
    planifier(true);
  });
  window.addEventListener('hashchange', function () { rendre(); window.scrollTo(0, 0); });

  function nomFichier(prefix) {
    var n = [state.c1.nom, couple() && state.c2.nom !== state.c1.nom ? state.c2.nom : ''].filter(Boolean).join(' - ') || 'Client';
    return prefix + ' - ' + n.toUpperCase() + ' - ' + (state.dateEtude || today());
  }
  async function genererPPTX(b) {
    if (!modele || !analyse) return;
    var lbl = b.textContent; b.disabled = true; b.textContent = 'Génération…';
    try {
      var blob = await PPTX.generer(modele.buf.slice(0), CALC.analyseComplete(clone(state)));
      await enregistrer(((couple() ? 'M. et Mme ' : '') + (state.c1.nom || 'CLIENT').toUpperCase() + ' - AUDIT CIVIL ET FISCAL.pptx'), blob);
    } catch (e) { console.error(e); toast('Le PowerPoint n’a pas pu être généré : ' + (e.message || 'modèle illisible') + '.'); }
    b.disabled = false; b.textContent = lbl;
  }
  async function genererXLSX(b) {
    var lbl = b.textContent; b.disabled = true; b.textContent = 'Génération…';
    try {
      var buf = await XLSXOUT.generer(CALC.analyseComplete(clone(state)), modeleInfo ? modeleInfo.theme : null);
      await enregistrer(nomFichier('Audit civil et fiscal') + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) { console.error(e); toast('L’Excel n’a pas pu être généré.'); }
    b.disabled = false; b.textContent = lbl;
  }
  async function chargerModele(file, silencieux) {
    try {
      var buf = file.buf || await file.arrayBuffer();
      var info = await PPTX.infosModele(buf.slice(0));
      modele = { buf: buf, nom: file.name || file.nom };
      modeleInfo = Object.assign({ nom: modele.nom }, info);
      appliquerTheme(info.theme);
      if (!silencieux) { await idbSet('modele', { buf: buf, nom: modele.nom }); toast('Modèle chargé : ' + modele.nom); }
      rendre();
    } catch (e) { console.error(e); if (!silencieux) toast('Ce fichier n’est pas un PowerPoint (.pptx) lisible.'); }
  }
  function appliquerTheme(theme) {
    var r = document.documentElement;
    if (theme && theme.colors && theme.colors.accent1) { r.style.setProperty('--brand', '#' + theme.colors.accent1); }
    else r.style.removeProperty('--brand');
  }
  function normaliser(d) {
    var base = clone(VIDE);
    d = Object.assign(base, d);
    ['c1', 'c2'].forEach(function (k) { d[k] = Object.assign(clone(VIDE[k]), d[k] || {}); });
    d.plan = Object.assign({ versementAV: { c1: 0, c2: 0 } }, d.plan || {});
    d.plan.versementAV = Object.assign({ c1: 0, c2: 0 }, d.plan.versementAV || {});
    d.params = d.params || {};
    var defs = CALC.defaultParams();
    Object.keys(defs).forEach(function (k) { if (d.params[k] === undefined || d.params[k] === null) d.params[k] = defs[k]; });
    return d;
  }

  /* ---------- Démarrage ---------- */
  state = normaliser(charger());
  if (!state.dateEtude) state.dateEtude = today();
  calculer(); rendre();
  idbGet('modele').then(function (m) { if (m && m.buf) chargerModele({ buf: m.buf, nom: m.nom }, true); });
})();

</script>
<script>
(function () {
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
  var btn = document.getElementById('installer'), evt = null;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); evt = e; btn.hidden = false; });
  if (ios) btn.hidden = false;
  btn.addEventListener('click', async function () {
    if (evt) { evt.prompt(); try { await evt.userChoice; } catch (e) { } evt = null; btn.hidden = true; return; }
    if (ios) { var t = document.getElementById('toast'); t.textContent = 'Sur iPhone ou iPad : touchez Partager, puis « Sur l’écran d’accueil ».'; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 6000); }
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; });
})();
</script>
</body>
</html>
