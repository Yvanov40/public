<!doctype html>
<!-- =====================================================================================
     Investissement immobilier — comparateur de montages
     Un projet (le bien, les loyers, le prêt, les associés, la revente) et plusieurs façons de le
     détenir, calculées côte à côte : location nue en direct (micro-foncier ou réel), LMNP
     (micro-BIC ou réel), SCI à l'IR, SCI à l'IS.
     Fichiers : index.html (cette page : l'affichage), moteur.js (le calcul), vendor/ (bibliothèques
     des exports Excel et PowerPoint, chargées seulement quand on exporte).
     Les simulations se rattachent aux clients du Suivi des dossiers (bouton « Simulations »).
     ===================================================================================== -->
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- verrou : début (identifiant et mot de passe ; module commun, voir verrou.source.js à la racine du dépôt) -->
<script>
// =====================================================================================
//  Verrou — un compte (identifiant + mot de passe) pour ouvrir le Suivi depuis n'importe quel appareil
//  (module commun, recopié tel quel au tout début de suivi/, audit/, pvi/, succession/ et immo/,
//   entre les repères « verrou : début » et « verrou : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  Le site est public, mais il ne contient aucune donnée : le fichier de suivi est dans un dépôt
//  GitHub privé, qu'on ne lit qu'avec une clé d'accès GitHub. Le compte sert à retrouver cette clé :
//   • le fichier « suivi/comptes/<empreinte de l'identifiant>.json », publié avec le site, contient
//     les réglages GitHub (dont la clé) CHIFFRÉS avec le mot de passe (AES-GCM 256 bits, clé tirée
//     du mot de passe et de l'identifiant par PBKDF2, 600 000 tours). Sans le mot de passe, il est illisible ;
//   • à la connexion, l'appli télécharge ce fichier, le déchiffre, et se branche sur GitHub ;
//   • le Suivi demande toujours la connexion ; les simulateurs, dès qu'un compte a servi sur l'appareil ;
//   • après X minutes sans utilisation (ou « Se déconnecter »), tout ce que le navigateur garde
//     (dossiers, simulations, clé GitHub) est chiffré avec la même clé, puis effacé en clair.
//  Mot de passe oublié : il ne peut pas être retrouvé ; on recrée le compte à partir de la clé GitHub.
//  Rangement : localStorage « verrou-config » (compte, sel, contrôle, délai), « verrou-session » (fin de session) ;
//  IndexedDB « verrou » : le coffre chiffré, et la clé de la session ouverte (non exportable).
// =====================================================================================
(function () {
  "use strict";
  var CFG = "verrou-config", SES = "verrou-session", ESSAIS = "verrou-essais", GH = "suivi-gp-github";
  // les données protégées (les préférences d'affichage restent en clair)
  var PROTEGEES = /^(suivi-gp-(donnees|github$|fichier)|audit-(dossiers|transmission)|pvi-(dossiers|etat|scenarios)|succession-dossiers|succ-dossier|immo-(dossiers|etat))/;
  var TOURS = 600000;
  var lire = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  var cfg = lire(CFG);
  var maintenant = function () { return Date.now(); };
  var finSession = function () { return +localStorage.getItem(SES) || 0; };
  var delai = function () { return Math.max(1, +(cfg && cfg.delai) || 15) * 60000; };
  // où est publié le site (ex. yvanov40.github.io/public/…) : pour écrire le fichier du compte
  var SITE = (function () {
    var p = location.pathname.split("/").filter(Boolean);
    return { proprietaire: location.hostname.split(".")[0], depot: location.hostname.endsWith("github.io") ? p[0] : null };
  })();
  var DOSSIER_COMPTES = "../suivi/comptes/";

  // ---------------------------------------------------------------- petite base IndexedDB
  function base() {
    return new Promise(function (ok, ko) {
      var r = indexedDB.open("verrou", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); };
    });
  }
  function idb(mode, fn) {
    return base().then(function (db) { return new Promise(function (ok, ko) {
      var t = db.transaction("kv", mode), s = t.objectStore("kv"), r = fn(s);
      t.oncomplete = function () { ok(r && r.result); db.close(); }; t.onerror = function () { ko(t.error); db.close(); };
    }); });
  }
  var idbLire = function (k) { return idb("readonly", function (s) { return s.get(k); }); };
  var idbEcrire = function (k, v) { return idb("readwrite", function (s) { s.put(v, k); }); };
  var idbEffacer = function (k) { return idb("readwrite", function (s) { s.delete(k); }); };

  // ---------------------------------------------------------------- chiffrement
  var b64 = function (buf) { var s = "", o = new Uint8Array(buf); for (var i = 0; i < o.length; i++) s += String.fromCharCode(o[i]); return btoa(s); };
  var deb64 = function (t) { var s = atob(t), o = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; };
  var normal = function (id) { return String(id || "").trim().toLowerCase(); };
  // nom du fichier du compte : empreinte de l'identifiant (l'identifiant lui-même n'apparaît nulle part)
  function empreinte(id) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode("suivi-gp:" + normal(id))).then(function (h) {
      return Array.from(new Uint8Array(h)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("").slice(0, 32);
    });
  }
  function deriver(id, mdp, sel, tours) {
    var enc = new TextEncoder();
    var selComplet = new Uint8Array([].concat(Array.from(deb64(sel)), Array.from(enc.encode(normal(id)))));
    return crypto.subtle.importKey("raw", enc.encode(mdp), "PBKDF2", false, ["deriveKey"]).then(function (k) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: selComplet, iterations: tours, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function chiffrer(cle, texte) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cle, new TextEncoder().encode(texte)).then(function (ct) { return { iv: b64(iv), ct: ct }; });
  }
  function dechiffrer(cle, boite) {
    var ct = typeof boite.ct === "string" ? deb64(boite.ct) : boite.ct;
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: deb64(boite.iv) }, cle, ct).then(function (b) { return new TextDecoder().decode(b); });
  }

  // ---------------------------------------------------------------- le fichier du compte (publié avec le site)
  // { v: 1, sel, tours, iv, ct }  — ct = réglages GitHub chiffrés
  function lireCompteDistant(hash) {
    return fetch(DOSSIER_COMPTES + hash + ".json", { cache: "no-store" }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("reseau");
      return r.json();
    });
  }
  // écrire le fichier du compte dans le dépôt du site, avec la clé GitHub si elle y a accès
  function publierCompte(hash, contenu, gh) {
    if (!SITE.depot || !gh || !gh.cle) return Promise.reject(new Error("droits"));
    var url = "https://api.github.com/repos/" + SITE.proprietaire + "/" + SITE.depot + "/contents/suivi/comptes/" + hash + ".json";
    var ent = { "Authorization": "Bearer " + gh.cle, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    return fetch(url, { headers: ent, cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
      .then(function (exist) {
        var corps = { message: "Compte du Suivi : mise à jour", content: btoa(JSON.stringify(contenu, null, 1)) };
        if (exist && exist.sha) corps.sha = exist.sha;
        return fetch(url, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ent), body: JSON.stringify(corps) });
      }).then(function (r) { if (!r.ok) throw new Error(r.status === 403 || r.status === 404 ? "droits" : "code " + r.status); });
  }
  function supprimerCompteDistant(hash, gh) {
    if (!SITE.depot || !gh || !gh.cle) return Promise.reject(new Error("droits"));
    var url = "https://api.github.com/repos/" + SITE.proprietaire + "/" + SITE.depot + "/contents/suivi/comptes/" + hash + ".json";
    var ent = { "Authorization": "Bearer " + gh.cle, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    return fetch(url, { headers: ent, cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (exist) {
      if (!exist) return;
      return fetch(url, { method: "DELETE", headers: Object.assign({ "Content-Type": "application/json" }, ent), body: JSON.stringify({ message: "Compte du Suivi : suppression", sha: exist.sha }) })
        .then(function (r) { if (!r.ok) throw new Error("droits"); });
    });
  }
  // fabrique le fichier du compte : les réglages GitHub chiffrés avec le mot de passe
  function fabriquerCompte(id, mdp, gh) {
    var sel = b64(crypto.getRandomValues(new Uint8Array(16)));
    return deriver(id, mdp, sel, TOURS).then(function (cle) {
      return chiffrer(cle, JSON.stringify(gh)).then(function (b) { return { cle: cle, contenu: { v: 1, sel: sel, tours: TOURS, iv: b.iv, ct: b64(b.ct) } }; });
    });
  }

  // ---------------------------------------------------------------- sceller / ouvrir les données de l'appareil
  function clesProtegees() { var l = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (PROTEGEES.test(k)) l.push(k); } return l; }
  function sceller(cle) {
    localStorage.setItem(SES, "0");
    var cles = clesProtegees();
    if (!cles.length) return idbEffacer("cle");
    var contenu = {}; cles.forEach(function (k) { contenu[k] = localStorage.getItem(k); });
    return idbLire("coffre").then(function (ancien) {
      return ancien ? dechiffrer(cle, ancien).then(function (t) { var a = JSON.parse(t); for (var k in a) if (!(k in contenu)) contenu[k] = a[k]; }, function () {}) : null;
    }).then(function () { return chiffrer(cle, JSON.stringify(contenu)); })
      .then(function (boite) { return idbEcrire("coffre", boite); })
      .then(function () { cles.forEach(function (k) { localStorage.removeItem(k); }); return idbEffacer("cle"); });
  }
  function ouvrirSession(cle) {
    return idbLire("coffre").then(function (boite) {
      if (!boite) return;
      return dechiffrer(cle, boite).then(function (t) {
        var contenu = JSON.parse(t);
        for (var k in contenu) localStorage.setItem(k, contenu[k]);
      }, function () { /* coffre d'un autre compte ou d'un ancien mot de passe : illisible, on repart de GitHub */ })
        .then(function () { return idbEffacer("coffre"); });
    }).then(function () { return idbEcrire("cle", cle); })
      .then(function () { localStorage.setItem(SES, String(maintenant() + delai())); localStorage.removeItem(ESSAIS); });
  }
  function effacerAppareil() {
    return Promise.all([idbEffacer("coffre"), idbEffacer("cle")]).catch(function () {}).then(function () {
      clesProtegees().forEach(function (k) { localStorage.removeItem(k); });
      [CFG, SES, ESSAIS].forEach(function (k) { localStorage.removeItem(k); });
    });
  }

  // ---------------------------------------------------------------- se connecter
  //  1. si ce compte a déjà servi ici : vérification sur l'appareil (marche hors connexion) ;
  //  2. sinon (ou si le mot de passe a changé ailleurs) : on télécharge le fichier du compte.
  function connecter(id, mdp) {
    return empreinte(id).then(function (hash) {
      var local = cfg && cfg.compte === hash && cfg.sel ? deriver(id, mdp, cfg.sel, cfg.tours).then(function (cle) {
        return dechiffrer(cle, cfg.controle).then(function (t) { return { cle: cle, gh: JSON.parse(t) }; });
      }) : Promise.reject(new Error("pas ici"));
      return local.catch(function () {
        return lireCompteDistant(hash).then(function (compte) {
          if (!compte) throw new Error("inconnu");
          return deriver(id, mdp, compte.sel, compte.tours || TOURS).then(function (cle) {
            return dechiffrer(cle, compte).then(function (t) {
              var autre = cfg && (cfg.compte !== hash || cfg.sel !== compte.sel);
              cfg = { actif: true, compte: hash, sel: compte.sel, tours: compte.tours || TOURS, controle: { iv: compte.iv, ct: compte.ct }, delai: (cfg && cfg.delai) || 15 };
              localStorage.setItem(CFG, JSON.stringify(cfg));
              // un autre compte (ou un ancien mot de passe) avait servi ici : on ne garde rien de lui
              var menage = autre ? Promise.all([idbEffacer("coffre"), idbEffacer("cle")]).then(function () { clesProtegees().forEach(function (k) { localStorage.removeItem(k); }); }) : Promise.resolve();
              return menage.then(function () { return { cle: cle, gh: JSON.parse(t) }; });
            });
          });
        });
      });
    }).then(function (r) {
      return ouvrirSession(r.cle).then(function () {
        // réglages GitHub : ceux du compte (on garde la date d'expiration notée par le Suivi si c'est la même clé)
        var ici = lire(GH);
        localStorage.setItem(GH, JSON.stringify(Object.assign({}, r.gh, ici && ici.cle === r.gh.cle && ici.expiration ? { expiration: ici.expiration } : {})));
        localStorage.removeItem("suivi-gp-github-pause");
      });
    });
  }

  // ---------------------------------------------------------------- styles
  var CSS = [
    ".vr-fond{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:20px;background:#0c2d39;font:15px/1.45 'IBM Plex Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2a30;overflow:auto}",
    ".vr-fond.voile{background:rgba(10,20,25,.5)}",
    ".vr-carte{background:#fbfaf7;width:min(420px,100%);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:26px 24px 22px;display:grid;gap:12px;max-height:92vh;overflow:auto}",
    ".vr-carte h1,.vr-carte h2{margin:0;font:600 24px/1.2 'EB Garamond',Georgia,serif;color:#0c2d39}.vr-carte h2{font-size:21px}",
    ".vr-logo{width:52px;height:52px;border-radius:14px;background:#0c2d39;display:grid;place-items:center;color:#e3c27f;font-size:26px}",
    ".vr-carte p{margin:0;font-size:13px;color:#7c7466}",
    ".vr-carte label{display:grid;gap:4px;font-size:12.5px;color:#7c7466}",
    ".vr-carte input,.vr-carte select{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #d9d2c4;border-radius:11px;background:#fff;color:#1c2a30;width:100%;box-sizing:border-box}",
    ".vr-carte input:focus{outline:2px solid #e3c27f;border-color:#a77d2f}",
    ".vr-bt{font:inherit;font-size:15px;border:1px solid #d9d2c4;background:#fff;color:#0c2d39;border-radius:11px;padding:11px 14px;cursor:pointer;text-align:center;text-decoration:none}",
    ".vr-bt.plein{background:#0c2d39;border-color:#0c2d39;color:#fff;font-weight:600}.vr-bt.rouge{color:#b4473b}",
    ".vr-bt:disabled{opacity:.5;cursor:wait}",
    ".vr-lien{border:0;background:none;color:#7c7466;font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;justify-self:start;padding:0}",
    ".vr-erreur{color:#b4473b!important;font-weight:600}.vr-ok{color:#2f7d5b!important;font-weight:600}",
    ".vr-sep{border-top:1px solid #e2dacb;margin:4px 0}",
    ".vr-encart{background:#f3e9d4;border-radius:10px;padding:10px 12px;display:grid;gap:8px}",
    "@media (prefers-color-scheme:dark){.vr-carte{background:#16262d;color:#e8e3d9}.vr-carte h1,.vr-carte h2{color:#9cc3d1}.vr-carte input,.vr-carte select,.vr-bt{background:#0f1b20;border-color:#27404a;color:#e8e3d9}.vr-bt.plein{background:#3d6f80;border-color:#3d6f80}.vr-encart{background:#3a3020}}"
  ].join("\n");
  function poserStyle() { if (document.getElementById("vr-style")) return; var s = document.createElement("style"); s.id = "vr-style"; s.textContent = CSS; (document.head || document.documentElement).appendChild(s); }
  function el(tag, attrs, enfants) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k.slice(0, 2) === "on") e[k] = attrs[k]; else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]); }
    [].concat(enfants || []).forEach(function (c) { if (c != null && c !== false) e.append(c); });
    return e;
  }
  var NOMS = { suivi: "Suivi des dossiers", audit: "Audit civil et fiscal", pvi: "Plus-value immobilière", succession: "Simulateur de succession", immo: "Investissement immobilier" };
  var dossierApp = (location.pathname.match(/\/([a-z]+)\/(?:index\.html)?$/) || [])[1];
  var estSuivi = dossierApp === "suivi";

  // ---------------------------------------------------------------- l'écran de connexion
  function ecranConnexion() {
    var titre = NOMS[dossierApp] || "Mes applis";
    document.documentElement.innerHTML = "<head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title></title></head><body style='margin:0'></body>";
    document.title = titre + " · connexion";
    poserStyle();
    var champId = el("input", { type: "text", autocomplete: "username", autocapitalize: "none", spellcheck: "false" });
    var champMdp = el("input", { type: "password", autocomplete: "current-password" });
    var msg = el("p", { "aria-live": "polite" });
    var bt = el("button", { type: "submit", class: "vr-bt plein" }, "Se connecter");
    var form = el("form", { class: "vr-carte" }, [
      el("div", { class: "vr-logo", "aria-hidden": "true" }, "🔒"),
      el("h1", null, titre),
      el("p", null, "Connectez-vous pour accéder à vos dossiers."),
      el("label", null, ["Identifiant", champId]),
      el("label", null, ["Mot de passe", champMdp]),
      msg, bt,
      el("button", { type: "button", class: "vr-lien", onclick: aide }, "Mot de passe oublié ou première connexion ?")
    ]);
    form.onsubmit = function (e) {
      e.preventDefault();
      var attente = (lire(ESSAIS) || {}).jusqua || 0;
      if (attente > maintenant()) { msg.className = "vr-erreur"; msg.textContent = "Trop d'essais : réessayez dans " + Math.ceil((attente - maintenant()) / 1000) + " s."; return; }
      if (!champId.value.trim() || !champMdp.value) { msg.className = "vr-erreur"; msg.textContent = "Saisissez votre identifiant et votre mot de passe."; return; }
      bt.disabled = true; msg.className = ""; msg.textContent = "Vérification…";
      connecter(champId.value, champMdp.value).then(function () { msg.textContent = "Ouverture…"; location.reload(); }, function (er) {
        bt.disabled = false; msg.className = "vr-erreur";
        if (er && er.message === "reseau" || er instanceof TypeError) { msg.textContent = "Connexion impossible : vérifiez Internet (la première connexion sur un appareil a besoin du réseau)."; return; }
        var e2 = lire(ESSAIS) || { n: 0 }; e2.n = (e2.n || 0) + 1;
        if (e2.n >= 5) e2.jusqua = maintenant() + 30000 * Math.pow(2, e2.n - 5);
        localStorage.setItem(ESSAIS, JSON.stringify(e2));
        msg.textContent = "Identifiant ou mot de passe incorrect."; champMdp.select();
      });
    };
    document.body.append(el("div", { class: "vr-fond" }, form));
    setTimeout(function () { champId.focus(); }, 50);
    // première connexion ou mot de passe oublié : on passe par la clé GitHub
    function aide() {
      form.replaceChildren(
        el("h2", null, "Première connexion, mot de passe oublié"),
        el("p", null, "Le compte se crée (ou se recrée) à partir de votre clé d'accès GitHub, celle qui ouvre votre dépôt privé : sans elle, impossible de voir le fichier."),
        el("p", null, "Ouvrez le Suivi avec la clé GitHub, puis menu ⋯ › Identifiant et mot de passe : choisissez votre identifiant et votre (nouveau) mot de passe."),
        el("button", { type: "button", class: "vr-bt plein", onclick: function () {
          // ouverture sans compte : l'appli démarre vide, sans données ni clé ; il faudra coller la clé GitHub
          // (un compte avait servi ici : ses données chiffrées sont illisibles sans le mot de passe, on les retire)
          (actif ? effacerAppareil() : Promise.resolve()).then(function () {
            localStorage.setItem(SES, String(maintenant() + 30 * 60000));
            localStorage.setItem("verrou-sans-compte", "1");
            location.href = "../suivi/";
          });
        } }, "Ouvrir le Suivi avec ma clé GitHub"),
        actif ? el("p", null, "Les données chiffrées gardées sur cet appareil seront effacées (elles reviennent de GitHub).") : null,
        el("button", { type: "button", class: "vr-bt", onclick: function () { location.reload(); } }, "Retour"));
    }
  }

  // ---------------------------------------------------------------- démarrage
  var actif = !!(cfg && cfg.actif && cfg.sel && cfg.controle);
  var sansCompte = localStorage.getItem("verrou-sans-compte") === "1";
  // le Suivi demande toujours la connexion ; les simulateurs, dès qu'un compte a servi ici
  var exige = estSuivi || actif;
  if (exige && maintenant() >= finSession()) {
    try { window.stop(); } catch (e) {}
    localStorage.removeItem("verrou-sans-compte");
    idbLire("cle").then(function (cle) { return cle ? sceller(cle) : null; }).catch(function () {})
      .then(ecranConnexion).catch(function () {});
    window.Verrou = { actif: actif, verrouille: true };
    return;
  }

  // ---------------------------------------------------------------- session ouverte : on suit l'activité
  var dernier = 0;
  function activite() {
    var t = maintenant();
    if (t - dernier < 15000) return;
    dernier = t;
    if (t < finSession()) localStorage.setItem(SES, String(t + delai()));
  }
  function verrouiller() {
    return idbLire("cle").then(function (cle) { return cle ? sceller(cle) : (localStorage.setItem(SES, "0"), null); })
      .catch(function () { localStorage.setItem(SES, "0"); })
      .then(function () { location.reload(); });
  }
  if (exige) {
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) { addEventListener(ev, activite, { passive: true, capture: true }); });
    setInterval(function () { if (maintenant() >= finSession()) verrouiller(); }, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden && maintenant() >= finSession()) verrouiller(); });
    addEventListener("storage", function (e) { if (e.key === SES && maintenant() >= finSession()) location.reload(); });
  }

  // ---------------------------------------------------------------- réglages du compte (menu ⋯ du Suivi)
  var DELAIS = [[5, "5 minutes"], [15, "15 minutes"], [60, "1 heure"], [240, "4 heures"]];
  function selectDelai(v) { return el("select", null, DELAIS.map(function (d) { return el("option", { value: d[0], selected: +v === d[0] ? "selected" : null }, d[1]); })); }
  // après publication impossible (clé GitHub sans accès au dépôt du site) : on donne le fichier à déposer
  function encartDepot(hash, contenu) {
    var blob = new Blob([JSON.stringify(contenu, null, 1)], { type: "application/json" });

  function reglages() {

    var erreur = function (t) { msg.className = "vr-erreur"; msg.textContent = t; };
    var ok = function (t) { msg.className = "vr-ok"; msg.textContent = t; };
    var gh = lire(GH);
    if (!actif) {
      if (!gh || !gh.cle) {
        carte.append(el("h2", null, "Identifiant et mot de passe"),
          el("p", null, "Branchez d'abord le Suivi sur GitHub (menu ⋯ › GitHub) avec votre clé d'accès : le compte sert justement à retrouver cette clé depuis n'importe quel appareil."), fermer);
        return;
      }
      var id = el("input", { type: "text", autocomplete: "username", autocapitalize: "none", spellcheck: "false" });

      var d = selectDelai(15);
      var bt = el("button", { type: "button", class: "vr-bt plein" }, "Créer le compte");
      bt.onclick = function () {
        if (normal(id.value).length < 3) return erreur("Identifiant : 3 caractères au moins.");

        bt.disabled = true; msg.className = ""; msg.textContent = "Création…";
        var hash;
        empreinte(id.value).then(function (h) { hash = h; return lireCompteDistant(h).catch(function () { return null; }); })
          .then(function (existe) {
            if (existe && !confirm("Ce compte existe déjà : le remplacer par ce nouveau mot de passe ?")) throw new Error("annule");
            return fabriquerCompte(id.value, m1.value, gh);
          }).then(function (f) {
            cfg = { actif: true, compte: hash, sel: f.contenu.sel, tours: f.contenu.tours, controle: { iv: f.contenu.iv, ct: f.contenu.ct }, delai: +d.value };
            localStorage.setItem(CFG, JSON.stringify(cfg)); localStorage.removeItem("verrou-sans-compte");
            actif = true;
            return idbEcrire("cle", f.cle).then(function () {
              localStorage.setItem(SES, String(maintenant() + delai()));
              return publierCompte(hash, f.contenu, gh).then(function () {
                carte.replaceChildren(el("h2", null, "Compte créé"), el("p", { class: "vr-ok" }, "Votre compte est publié. D'ici une minute, vous pourrez vous connecter depuis n'importe quel appareil avec cet identifiant et ce mot de passe."),
                  el("p", null, "Notez-les en lieu sûr : le mot de passe ne peut pas être retrouvé."), fermer);
              }, function () {

      carte.append(el("h2", null, "Identifiant et mot de passe"),
        el("p", null, "Avec un compte, il suffit d'un identifiant et d'un mot de passe pour ouvrir le Suivi sur n'importe quel appareil : plus besoin de recoller la clé GitHub."),

        el("label", null, ["Identifiant", id]), el("label", null, ["Mot de passe", m1]), el("label", null, ["Confirmez le mot de passe", m2]),

    var idA = el("input", { type: "text", autocomplete: "username", autocapitalize: "none" }), mA = el("input", { type: "password", autocomplete: "current-password" });
    var n1 = el("input", { type: "password", autocomplete: "new-password" }), n2 = el("input", { type: "password", autocomplete: "new-password" });

          localStorage.setItem(CFG, JSON.stringify(cfg));

        return supprimerCompteDistant(hash, lire(GH)).catch(function () { alert("Le fichier du compte n'a pas pu être retiré du site : supprimez « suivi/comptes/" + hash + ".json » sur GitHub."); })
          .then(function () { return Promise.all([idbEffacer("cle"), idbEffacer("coffre")]); })

      }, function () { erreur("Saisissez d'abord votre identifiant et votre mot de passe actuels."); });
    };

      el("p", null, "Vous êtes connecté. Le Suivi demandera l'identifiant et le mot de passe à la prochaine ouverture, ou après le délai ci-dessous sans utilisation."),

      el("div", { class: "vr-sep" }),
      el("p", null, "Pour changer le mot de passe ou supprimer le compte :"),

  function majCompte(gh) {

    return idbLire("cle").then(function (cle) {
      if (!cle) return false;

        return publierCompte(cfg.compte, contenu, gh).then(function () { return true; }, function () { return "deposer"; });
      });
    }).catch(function () { return false; });
  }

.revente .t { grid-column: 1 / -1; font: 600 16px var(--titre); color: var(--bleu); }
.revente span { color: var(--discret); }
.revente b { text-align: right; }
.revente .total { border-top: 1px solid var(--bordure); padding-top: 6px; }
.alertes { display: grid; gap: 6px; }
.alerte { border-left: 3px solid var(--or); background: var(--or-doux); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px; }
.alerte b { color: var(--bleu); }
.limites { font-size: 12px; color: var(--discret); }

/* ---------- réglages ---------- */
.voile { position: fixed; inset: 0; background: rgba(10,20,25,.45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; }
.fen { background: var(--fond); width: min(640px, 100%); max-height: 90vh; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.fen header { display: flex; align-items: center; gap: 10px; background: #0c2d39; color: #fff; padding: 12px 16px; }
.fen header h3 { color: #fff; font-size: 19px; flex: 1; }
.fen header button { border: 0; background: none; color: #fff; font-size: 24px; cursor: pointer; line-height: 1; }
.fen .corps { padding: 14px 16px 18px; overflow-y: auto; display: grid; gap: 14px; }
.fen h4 { margin: 4px 0 -4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--discret); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #0c2d39; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- téléphone : un onglet Saisie / Résultats ---------- */
@media (max-width: 980px) {
  main { grid-template-columns: minmax(0, 1fr); padding: 10px 12px calc(30px + env(safe-area-inset-bottom, 0px)); }
  .seg.bascule { display: flex; position: sticky; top: 58px; z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,.06); }
  body:not(.voir-resultats) .resultats, body.voir-resultats .saisie { display: none; }
  .graphes { grid-template-columns: 1fr; }
  .chiffres { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .haut-in { padding: 8px 12px; gap: 10px; }
  .marque small, .meilleur, .bt-h span { display: none; }
  .actions { margin-left: auto; }
  .bt-h { padding: 8px 9px; }
  .grille { grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  /* téléphone : le nom sur une ligne, capital / résultats / TMI sur la suivante */
  .associe { grid-template-columns: 1fr 1fr 1fr 38px; padding-bottom: 8px; border-bottom: 1px dashed var(--bordure); }
  .associe > .champ:first-child { grid-column: 1 / 4; grid-row: 1; }
  .associe > button.x { grid-column: 4; grid-row: 1; }
  .menu-export { right: 10px; top: 54px; }
  .tableau th, .tableau td { padding: 7px 8px; }
  /* le comparatif défile de côté ; la colonne des libellés reste en place */
  .tableau td small { display: none; }
  .tableau th:first-child, .tableau td:first-child { position: sticky; left: 0; z-index: 1; background: var(--carte); min-width: 128px; box-shadow: 1px 0 0 var(--bordure); }
  .tableau tr.fort td:first-child { background: var(--section); }
}

/* ---------- impression (PDF) : seulement le rapport ---------- */
#impression { display: none; }
@media print {
  @page { size: A4; margin: 14mm 12mm; }
  body { background: #fff; color: #111; font-size: 11px; }
  header.haut, main, .bascule, #toast, .voile, .menu-export, .ls-voile { display: none !important; }
  #impression { display: block; }
  #impression h1 { font-size: 24px; color: #0c2d39; margin-bottom: 2px; }
  #impression h2 { font-size: 16px; color: #0c2d39; margin: 16px 0 6px; break-after: avoid; }
  #impression .sous { color: #555; margin: 0 0 12px; }
  #impression .tableau th, #impression .tableau td { padding: 4px 6px; border-color: #ccc; }
  #impression .tableau thead th { color: #333; }
  #impression .page { break-before: page; }
  #impression .hyp { columns: 2; column-gap: 24px; font-size: 10.5px; }
  #impression .hyp div { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; padding: 2px 0; break-inside: avoid; }
  #impression .graphe text { fill: #444; }
  #impression .alerte { background: #f6f0e3; }
}

<!-- lien-suivi : début (module commun, voir lien-suivi.source.js à la racine du dépôt) -->
<script>
window.LIEN_SUIVI = {
  cle: "immo-dossiers-v1",
  cles: ["immo-etat"],
  nomAuto: function (d) {                         // nom proposé : le prix du bien
    var x = d["immo-etat"]; return x && x.prix ? "bien de " + Math.round(x.prix).toLocaleString("fr-FR") + " €" : "";
  },
  vierge: null,                                   // nouvelle simulation : les valeurs par défaut de l'appli
  bouton: function () {
    var b = document.createElement("button"); b.className = "bt-h"; b.type = "button";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="ls-nom">Simulations</span>';
    var a = document.querySelector("header.haut .actions"); if (!a) return null; a.prepend(b); return b;
  }
};
// =====================================================================================
//  Lien avec le Suivi des dossiers — module commun, recopié tel quel dans pvi/ et succession/
//  (chaque appli reste autonome : ce bloc est collé dans sa page, entre les repères
//   « lien-suivi : début » et « lien-suivi : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  Ce qu'il fait :
//   • plusieurs simulations enregistrées dans l'appli (au lieu d'une seule) ;
//   • chacune peut être rattachée à un client du Suivi ;
//   • le Suivi lit ces simulations (même site, même mémoire du navigateur), les enregistre
//     dans suivi_gp.json (donc GitHub et vos autres appareils), et les montre dans la fiche du client ;
//   • le Suivi peut ouvrir une simulation précise : adresse « …/pvi/?ouvrir=IDENTIFIANT ».
//  Comment : l'appli garde son travail en cours dans ses propres clés (ex. « pvi-etat ») ;
//  ce module recopie ces clés dans la simulation ouverte, toutes les secondes et demie.
//  Rangement : localStorage[cle] = { courant: id, liste: { id: { nom, maj, data, client, nomFixe } }, effaces: { id: date } }
//  (même forme que les dossiers de l'Audit, « audit-dossiers-v1 »)
// =====================================================================================
(function () {
  var C = window.LIEN_SUIVI;            // réglages propres à l'appli, posés juste avant ce bloc
  if (!C) return;
  var CLE = C.cle;
  var maintenant = function () { return new Date().toISOString(); };
  var uid = function () { return "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  function lire() {
    try { var s = JSON.parse(localStorage.getItem(CLE)); if (s && s.liste) { s.effaces = s.effaces || {}; return s; } } catch (e) {}
    return { courant: null, liste: {}, effaces: {} };
  }
  function ecrire(s) { try { localStorage.setItem(CLE, JSON.stringify(s)); } catch (e) {} }
  // le travail en cours de l'appli, tel qu'elle le range elle-même
  function natif() {
    var o = {};
    C.cles.forEach(function (k) { var v = null; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) {} o[k] = v; });
    return o;
  }
  function poserNatif(data) {
    C.cles.forEach(function (k) {
      var v = data ? data[k] : null;
      try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    });
  }
  function nomPar(rec) {
    if (rec.nomFixe) return rec.nom;
    var auto = rec.data ? C.nomAuto(rec.data) : "";
    if (auto && rec.client && auto.toLowerCase() === rec.client.toLowerCase()) auto = "";
    return rec.client ? rec.client + (auto ? " · " + auto : "") : (auto || (rec.nom !== "Nouvelle simulation" && rec.nom) || "Simulation");
  }

  // ---- 1. au démarrage, AVANT l'appli : on pose la simulation demandée (ou la dernière ouverte) ----
  var s = lire();
  var demande = null;
  try { demande = new URLSearchParams(location.search).get("ouvrir"); } catch (e) {}
  if (demande && s.liste[demande]) s.courant = demande;
  if (!s.courant || !s.liste[s.courant]) {
    // première fois : le travail en cours devient la première simulation
    var n = natif(), plein = C.cles.some(function (k) { return n[k] != null; });
    var id0 = uid();
    s.liste[id0] = { nom: "Simulation", maj: maintenant(), data: plein ? n : null };
    s.liste[id0].nom = nomPar(s.liste[id0]);
    s.courant = id0;
  }
  var courant = s.courant;
  var rec = s.liste[courant];
  if (rec.data == null && C.vierge) rec.data = C.vierge(rec);
  rec.nom = nomPar(rec);
  poserNatif(rec.data);
  ecrire(s);
  if (demande) try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  var vu = JSON.stringify(natif());

  // ---- 2. en continu : ce que l'appli a changé part dans la simulation ouverte ----
  var parti = false;   // on change de simulation : la page va se recharger, plus rien à recopier
  function capter() {
    if (parti) return;
    var n = natif(), j = JSON.stringify(n);
    if (j === vu) return;
    vu = j;
    var s = lire(), r = s.liste[courant];
    if (!r) { if (s.effaces[courant]) return; r = { nom: "Simulation" }; }   // retirée ailleurs pendant qu'on travaillait : on la garde
    r.data = n; r.maj = maintenant(); r.nom = nomPar(r);
    s.liste[courant] = r; s.courant = courant;
    ecrire(s); majBouton();
  }
  setInterval(capter, 1500);
  addEventListener("pagehide", capter);
  document.addEventListener("visibilitychange", function () { if (document.hidden) capter(); });
  // le Suivi (ou une autre fenêtre) a écrit : client changé, ou version plus récente reçue de GitHub
  addEventListener("storage", function (e) {
    if (e.key !== CLE) return;
    var r = lire().liste[courant];
    if (r && r.data && JSON.stringify(r.data) !== vu && JSON.stringify(r.data) !== JSON.stringify(natif())) {
      capter();   // d'abord ce qu'on a en cours…
      var r2 = lire().liste[courant];
      if (r2 && JSON.stringify(r2.data) !== vu) { parti = true; poserNatif(r2.data); location.reload(); return; }   // …puis la version reçue
    }
    majBouton(); if (voile && voile.parentNode) dessiner();
  });

  // ---- 3. clients connus du Suivi (lus dans sa mémoire, sur ce navigateur) ----
  function clientsSuivi() {
    var noms = {};
    try {
      var d = JSON.parse(localStorage.getItem("suivi-gp-donnees")) || {};
      // d'abord les noms des dossiers (écrits comme dans le Suivi), puis les clients sans dossier
      (d.dossiers || []).forEach(function (x) { if (x && x.client) { var k = String(x.client).trim(); if (!noms[k.toLowerCase()]) noms[k.toLowerCase()] = k; } });
      Object.keys(d.clients || {}).forEach(function (k) { if (!noms[k.trim().toLowerCase()]) noms[k.trim().toLowerCase()] = k.trim(); });
    } catch (e) {}
    return Object.keys(noms).map(function (k) { return noms[k]; }).sort(function (a, b) { return a.localeCompare(b, "fr"); });
  }

  // ---- 4. le bouton « Simulations » et sa fenêtre ----
  var bouton = null, voile = null;
  var h = function (tag, attrs, enfants) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k === "onclick" || k === "oninput" || k === "onchange") e[k] = attrs[k]; else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]); }
    [].concat(enfants || []).forEach(function (c) { if (c != null && c !== false) e.append(c); });
    return e;
  };
  function majBouton() {
    if (!bouton) return;
    var r = lire().liste[courant] || {};
    bouton.querySelector(".ls-nom").textContent = r.client ? "👤 " + r.client : "Simulations";
    bouton.title = (r.nom || "Simulation") + (r.client ? " — rattachée à " + r.client : " — pas rattachée à un client");
  }
  function ouvrir(id, nouvelle) {
    capter();
    var s = lire();
    if (nouvelle) {
      id = uid();
      s.liste[id] = { nom: "Nouvelle simulation", maj: maintenant(), data: null, client: nouvelle.client || "" };
    }
    s.courant = id; ecrire(s);
    var r = s.liste[id];
    if (r.data == null && C.vierge) r.data = C.vierge(r);
    if (r.data != null) ecrire(s);
    parti = true;
    poserNatif(r.data);
    location.reload();
  }
  function dessiner() {
    var s = lire(), r = s.liste[courant] || {};
    var clients = clientsSuivi();
    var dl = h("datalist", { id: "ls-clients" }, clients.map(function (n) { return h("option", { value: n }); }));
    var champNom = h("input", { type: "text", value: r.nom || "", placeholder: "Nom de la simulation" });
    champNom.onchange = function () { var s = lire(), x = s.liste[courant]; if (!x) return; x.nom = champNom.value.trim() || nomPar(Object.assign({}, x, { nomFixe: false })); x.nomFixe = !!champNom.value.trim(); x.maj = maintenant(); ecrire(s); majBouton(); };
    var champClient = h("input", { type: "text", value: r.client || "", list: "ls-clients", placeholder: clients.length ? "Choisir un client du Suivi…" : "Nom du client" });
    var lier = function (nom) {
      var s = lire(), x = s.liste[courant]; if (!x) return;
      var connu = clients.find(function (c) { return c.toLowerCase() === nom.toLowerCase(); });
      x.client = connu || nom; x.maj = maintenant(); x.nom = nomPar(x); ecrire(s); majBouton(); dessiner();
    };
    var autres = Object.keys(s.liste).filter(function (id) { return id !== courant; })
      .sort(function (a, b) { return String(s.liste[b].maj || "").localeCompare(String(s.liste[a].maj || "")); });
    var date = function (x) { return x.maj ? new Date(x.maj).toLocaleDateString("fr-FR") : ""; };
    var fen = h("div", { class: "ls-fen", role: "dialog", "aria-modal": "true", "aria-label": "Simulations" }, [
      h("div", { class: "ls-tete" }, [h("b", null, "Simulations"), h("button", { type: "button", class: "ls-x", "aria-label": "Fermer", onclick: fermer }, "×")]),
      h("div", { class: "ls-corps" }, [
        h("p", { class: "ls-titre" }, "Simulation ouverte"),
        h("label", { class: "ls-champ" }, [h("span", null, "Nom"), champNom]),
        h("label", { class: "ls-champ" }, [h("span", null, "Client du Suivi"), champClient, dl]),
        h("div", { class: "ls-ligne-bt" }, [
          h("button", { type: "button", class: "ls-bt ls-plein", onclick: function () { var v = champClient.value.trim(); if (v) lier(v); } }, r.client ? "Changer de client" : "Rattacher"),
          r.client ? h("button", { type: "button", class: "ls-bt", onclick: function () { lier(""); } }, "Détacher") : null]),
        h("p", { class: "ls-aide" }, clients.length
          ? "La simulation apparaîtra dans la fiche du client, dans le Suivi, et sera enregistrée avec votre fichier de suivi."
          : "Ouvrez le Suivi une fois sur ce navigateur pour retrouver ici la liste de vos clients."),
        h("button", { type: "button", class: "ls-bt ls-large", onclick: function () { ouvrir(null, { client: "" }); } }, "＋ Nouvelle simulation"),
        r.client ? h("button", { type: "button", class: "ls-bt ls-large", onclick: function () { ouvrir(null, { client: r.client }); } }, "＋ Nouvelle simulation pour " + r.client) : null,
        autres.length ? h("p", { class: "ls-titre" }, "Autres simulations") : null,
        h("div", { class: "ls-liste" }, autres.map(function (id) {
          var x = s.liste[id];
          return h("div", { class: "ls-item" }, [
            h("button", { type: "button", class: "ls-ouvrir", onclick: function () { ouvrir(id); } }, [h("b", null, x.nom || "Simulation"), h("small", null, (x.client ? "👤 " + x.client + " · " : "") + date(x))]),
            h("button", { type: "button", class: "ls-suppr", title: "Supprimer", "aria-label": "Supprimer", onclick: function () {
              if (!confirm("Supprimer « " + (x.nom || "Simulation") + " » ?\nElle sera aussi retirée de votre fichier de suivi (et de vos autres appareils).")) return;
              var s = lire(); delete s.liste[id]; s.effaces[id] = maintenant(); ecrire(s); dessiner();
            } }, "🗑")]);
        }))])]);
    voile.replaceChildren(fen);
  }
  function fermer() { if (voile) voile.remove(); }
  function panneau() {
    capter();
    voile = voile || h("div", { class: "ls-voile", onclick: function (e) { if (e.target === voile) fermer(); } });
    document.body.append(voile);
    dessiner();
  }
  addEventListener("keydown", function (e) { if (e.key === "Escape" && voile && voile.parentNode) fermer(); });
  function installer() {
    var st = document.createElement("style");
    st.textContent = [
      ".ls-voile{position:fixed;inset:0;z-index:9999;background:rgba(10,20,25,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;font-size:14px;line-height:1.4}",
      ".ls-fen{background:#fbfaf7;color:#1c2a30;width:min(480px,100%);max-height:86vh;display:flex;flex-direction:column;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden;font-family:inherit}",
      ".ls-tete{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0c2d39;color:#fff}.ls-tete b{font-size:17px}",
      ".ls-x{border:0;background:none;color:#fff;font-size:24px;line-height:1;cursor:pointer;padding:0 4px}",
      ".ls-corps{padding:12px 16px 16px;overflow-y:auto;display:grid;gap:8px}",
      ".ls-titre{margin:6px 0 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#7c7466;font-weight:600}",
      ".ls-champ{display:grid;gap:3px}.ls-champ span{font-size:12px;color:#7c7466}",
      ".ls-champ input{font:inherit;font-size:15px;padding:9px 11px;border:1px solid #d9d2c4;border-radius:10px;background:#fff;color:inherit;width:100%;box-sizing:border-box}",
      ".ls-ligne-bt{display:flex;gap:8px;flex-wrap:wrap}",
      ".ls-bt{font:inherit;font-size:14px;border:1px solid #d9d2c4;background:#fff;color:#0c2d39;border-radius:10px;padding:8px 12px;cursor:pointer}",
      ".ls-plein{background:#0c2d39;border-color:#0c2d39;color:#fff}.ls-large{width:100%;text-align:left}",
      ".ls-aide{margin:0;font-size:12px;color:#7c7466}",
      ".ls-liste{display:grid;gap:6px}.ls-item{display:flex;gap:6px}",
      ".ls-ouvrir{flex:1;min-width:0;text-align:left;display:grid;gap:1px;font:inherit;border:1px solid #e2dacb;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:inherit}",
      ".ls-ouvrir b{font-weight:600;color:#0c2d39;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ls-ouvrir small{font-size:12px;color:#7c7466}",
      ".ls-suppr{width:40px;border:1px solid #e2dacb;background:#fff;border-radius:10px;cursor:pointer}",
      ".ls-bouton .ls-nom{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}",
      "@media (prefers-color-scheme: dark){.ls-fen{background:#16262d;color:#e8e3d9}.ls-champ input,.ls-bt,.ls-ouvrir,.ls-suppr{background:#0f1b20;border-color:#27404a;color:#e8e3d9}.ls-ouvrir b,.ls-bt{color:#e8e3d9}.ls-plein{background:#3d6f80;border-color:#3d6f80}}",
      "@media (max-width:700px){.ls-voile{align-items:flex-end;padding:0}.ls-fen{border-radius:18px 18px 0 0;max-height:88vh}.ls-bouton .ls-nom{display:none!important}}"
    ].join("\n");
    document.head.append(st);
    bouton = C.bouton();          // l'appli fabrique le bouton à son image
    if (!bouton) return;
    bouton.classList.add("ls-bouton");
    bouton.onclick = panneau;
    majBouton();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
  window.lienSuivi = { ouvrirPanneau: panneau, courant: function () { return courant; } };
})();
</script>

<script>
"use strict";
// =====================================================================================
//  1. OUTILS

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// lit un nombre saisi « à la française » : espaces de milliers, virgule ; « 250k », « 1,2M » acceptés
function lireNombre(v) {
  let t = String(v ?? "").trim().toLowerCase().replace(/[\s  €%]/g, "").replace(",", ".");
  let mult = 1;
  if (/k$/.test(t)) { mult = 1e3; t = t.slice(0, -1); } else if (/m$/.test(t)) { mult = 1e6; t = t.slice(0, -1); }
  const x = parseFloat(t);
  return isFinite(x) ? x * mult : 0;
}
const eur = (n) => isFinite(n) ? Math.round(n).toLocaleString("fr-FR") + " €" : "–";
const eurS = (n) => isFinite(n) ? (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString("fr-FR") + " €" : "–";
const pct = (x, d = 1) => x == null || !isFinite(x) ? "–" : (x * 100).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " %";
const stock = { lire(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, ecrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2400); }
const COULEURS = { nuMicro: "var(--c3)", nuReel: "var(--c1)", lmnpMicro: "var(--c5)", lmnpReel: "var(--c2)", sciIR: "var(--c4)", sciIS: "var(--c6)", sciIRInegal: "var(--c7)", sciIRHolding: "var(--c8)", cessionUsufruit: "var(--c9)", coacquisition: "var(--c10)" };
const COUL_HEX = { nuMicro: "4F7F8F", nuReel: "0C2D39", lmnpMicro: "6F8F4E", lmnpReel: "A77D2F", sciIR: "C86B4A", sciIS: "8A6BB5", sciIRInegal: "2F8A78", sciIRHolding: "9B5A2F", cessionUsufruit: "4F63B0", coacquisition: "B0577A" };

// =====================================================================================
//  2. LE PROJET : valeurs par défaut et description des champs
// =====================================================================================
const DEFAUT = {

  loyerNu: 850, loyerMeuble: 980, vacance: 0.5, copro: 1200, taxeFonciere: 1100, pno: 150, gestion: 0, cfe: 250,

  // montages patrimoniaux

  usufruitDuree: 10, usufruitTaux: 4, usufruitManuel: false, usufruitPct: 35, fraisUsufruit: 7, usufruitRembourser: true, autresFonciers: false,
  comptaLMNP: 450, comptaSCI: 600, comptaIS: 1500, constitution: 1500, distribuer: false,
  horizon: 15, revalPrix: 1.5, fraisCession: 0,
  montages: ["nuMicro", "nuReel", "lmnpMicro", "lmnpReel", "sciIR", "sciIS"]
};
let h = Object.assign({}, DEFAUT, stock.lire("immo-etat", {}));
let R = Object.assign({}, Moteur.REGLAGES_DEFAUT, stock.lire("immo-reglages", {}));
let res = {}, detail = h.detail || "nuReel";

// un champ numérique : [clé, libellé, unité, aide]
const F = (cle, lib, unite, aide, cls) => ({ cle, lib, unite, aide, cls });
const SECTIONS = [
  { id: "bien", titre: "Le bien", resume: () => eur(h.prix) + (h.travaux ? " + " + eur(h.travaux) + " de travaux" : ""), champs: [
    { seg: "neuf", lib: "Type", options: [[false, "Ancien"], [true, "Neuf (VEFA)"]] },
    F("prix", "Prix d'achat (net vendeur)", "€"),
    { cle: "frais", lib: "Frais d'acquisition", unite: "€", auto: "fraisAuto", aide: "Calcul auto : 8 % dans l'ancien, 2,5 % dans le neuf." },
    F("travaux", "Travaux à l'achat", "€"),
    { seg: "natureTravaux", lib: "Nature des travaux", options: [["entretien", "Entretien, réparation, amélioration"], ["amelioration", "Construction, agrandissement"]], plein: true,
      aide: "Les premiers se déduisent des loyers (nu) ou en charges (meublé, IS) ; les seconds s'amortissent (meublé, IS) ou s'ajoutent au prix de revient." },
    F("mobilier", "Mobilier (meublé seulement)", "€"),
    F("terrain", "Part du terrain (non amortissable)", "%", "Souvent 15 à 20 % ; davantage en centre-ville.")
  ] },
  { id: "loyers", titre: "Loyers et charges", resume: () => eur(h.loyerNu) + " nu · " + eur(h.loyerMeuble) + " meublé /mois", champs: [
    F("loyerNu", "Loyer nu, hors charges", "€/mois"),
    F("loyerMeuble", "Loyer meublé, hors charges", "€/mois"),
    F("vacance", "Vacance locative", "mois/an"),
    F("gestion", "Frais de gestion", "% loyers"),
    F("copro", "Charges de copro. non récupérables", "€/an"),
    F("taxeFonciere", "Taxe foncière", "€/an"),
    F("pno", "Assurance propriétaire non occupant", "€/an"),
    F("cfe", "CFE (meublé)", "€/an"),
    F("revalLoyer", "Hausse des loyers", "%/an"),
    F("revalCharges", "Hausse des charges", "%/an")
  ] },
  { id: "pret", titre: "Financement", resume: () => eur(h.apport) + " d'apport · " + String(h.taux).replace(".", ",") + " % sur " + h.duree + " ans", champs: [
    F("apport", "Apport", "€"),
    F("taux", "Taux du prêt", "%"),
    F("duree", "Durée", "ans"),
    F("assurance", "Assurance emprunteur", "%/an", "En % du capital emprunté, par an.")
  ] },
  { id: "foyer", titre: "Fiscalité des investisseurs", resume: () => "TMI " + h.tmi + " %" + ((h.associes || []).length ? " · " + h.associes.length + " associé" + (h.associes.length > 1 ? "s" : "") : ""), champs: [
    { select: "tmi", lib: "Tranche marginale d'imposition (en direct)", options: [0, 11, 30, 41, 45].map((x) => [x, x + " %"]), plein: true },
    { associes: true },
    F("comptaLMNP", "Comptable LMNP (réel)", "€/an"),
    F("comptaSCI", "Frais annuels SCI à l'IR", "€/an"),
    F("comptaIS", "Comptable SCI à l'IS", "€/an"),
    F("constitution", "Création de la SCI", "€"),
    { caseCle: "distribuer", lib: "SCI à l'IS : distribuer chaque année le bénéfice (sinon : mis en réserve, et remboursement du compte courant)", plein: true }
  ] },
  { id: "patrimonial", titre: "Montages patrimoniaux", resume: () => "usufruit " + h.usufruitDuree + " ans · IS " + h.isSociete + " %", champs: [
    { select: "isSociete", lib: "Votre société à l'IS (holding) : taux marginal d'IS", options: [[15, "15 % (bénéfices jusqu'à 42 500 €)"], [25, "25 %"]], plein: true },
    { titre: "SCI à l'IR financée par votre holding" },
    F("holdingMontant", "Montant prêté par la holding", "€", "Le reste est emprunté à la banque."),
    F("holdingTaux", "Taux du prêt de la holding", "%"),
    F("holdingDuree", "Durée du prêt de la holding", "ans"),
    { titre: "Usufruit temporaire (cession ou coacquisition)" },
    F("usufruitDuree", "Durée de l'usufruit", "ans"),
    F("usufruitTaux", "Taux d'actualisation", "%", "Valeur économique : loyers nets de la période, actualisés."),
    { caseCle: "usufruitManuel", lib: "Fixer moi-même la valeur de l'usufruit", plein: true },
    F("usufruitPct", "Valeur de l'usufruit", "% du prix"),
    F("fraisUsufruit", "Frais d'achat de l'usufruit (société)", "% du prix", "Droits de mutation et frais de l'acte de cession."),
    { valeurUsufruit: true },
    { caseCle: "usufruitRembourser", lib: "Cession d'usufruit : le prix (après impôt) rembourse le prêt par anticipation", plein: true },
    { caseCle: "autresFonciers", lib: "J'ai d'autres revenus fonciers (les intérêts de la nue-propriété s'y déduisent)", plein: true }
  ] },
  { id: "revente", titre: "Revente", resume: () => "dans " + h.horizon + " ans", champs: [
    F("horizon", "Durée de détention", "ans"),
    F("revalPrix", "Valorisation du bien", "%/an"),
    F("fraisCession", "Frais de vente (diagnostics, agence…)", "% prix")
  ] }
];

// =====================================================================================
//  3. LA SAISIE
// =====================================================================================
const formatSaisie = (v) => v === "" || v == null ? "" : (Math.abs(v) >= 1000 ? Math.round(v * 100) / 100 : v).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
function champHTML(c) {
  if (c.seg) return `<div class="champ ${c.plein ? "plein" : ""}"><span class="lib">${esc(c.lib)}</span><div class="seg">${c.options.map(([v, l]) => `<button type="button" data-seg="${c.seg}" data-val='${JSON.stringify(v)}' class="${h[c.seg] === v ? "on" : ""}">${esc(l)}</button>`).join("")}</div>${c.aide ? `<p class="aide">${esc(c.aide)}</p>` : ""}</div>`;
  if (c.select) return `<div class="champ ${c.plein ? "plein" : ""}"><label for="s-${c.select}">${esc(c.lib)}</label><select id="s-${c.select}" data-select="${c.select}">${c.options.map(([v, l]) => `<option value="${v}" ${+h[c.select] === +v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
  if (c.caseCle) return `<label class="case plein"><input type="checkbox" data-case="${c.caseCle}" ${h[c.caseCle] ? "checked" : ""}> ${esc(c.lib)}</label>`;
  if (c.titre) return `<p class="sous-titre plein">${esc(c.titre)}</p>`;
  if (c.valeurUsufruit) return `<p class="aide plein" id="valeurUsufruit"></p>`;
  if (c.associes) return `<div class="champ plein"><span class="lib">Associés de la SCI : part du capital, part des résultats (clause des statuts, montage « SCI IR inégale ») et TMI</span><div class="associes" id="associes"></div><button type="button" class="mini" id="ajoutAssocie" style="justify-self:start">＋ Associé</button></div>`;
  const auto = c.auto && h[c.auto];
  const valeur = auto ? Math.round(h.prix * (h.neuf ? 0.025 : 0.08)) : h[c.cle];
  return `<div class="champ ${c.plein ? "plein" : ""}"><label for="c-${c.cle}">${esc(c.lib)}</label>
    <div class="saisie-u"><input id="c-${c.cle}" data-cle="${c.cle}" inputmode="decimal" autocomplete="off" value="${esc(formatSaisie(valeur))}" ${auto ? "readonly" : ""}><i>${esc(c.unite)}</i></div>
    ${c.auto ? `<label class="case" style="font-size:12px"><input type="checkbox" data-case="${c.auto}" ${auto ? "checked" : ""}> calcul automatique</label>` : ""}
    ${c.aide && !c.auto ? `<p class="aide">${esc(c.aide)}</p>` : c.aide ? `<p class="aide">${esc(c.aide)}</p>` : ""}</div>`;
}
function dessinerSaisie() {
  const ouverts = h.ouverts || ["bien", "loyers", "pret"];
  $("saisie").innerHTML = SECTIONS.map((s, i) => `<details class="carte" data-section="${s.id}" ${ouverts.includes(s.id) ? "open" : ""}>
      <summary><span class="num">${i + 1}</span><h2>${esc(s.titre)}</h2><span class="resume" data-resume="${s.id}">${esc(s.resume())}</span></summary>
      <div class="corps"><div class="grille">${s.champs.map(champHTML).join("")}</div></div></details>`).join("")
    + `<p class="aide" style="padding:0 4px">Astuce : tapez « 250k » ou « 1,2M » dans les montants.</p>`;
  dessinerAssocies();
}
function dessinerAssocies() {
  const z = $("associes"); if (!z) return;
  const tmis = [0, 11, 30, 41, 45];
  z.innerHTML = (h.associes || []).map((a, i) => `<div class="associe" data-i="${i}">
      <div class="champ"><span class="lib">Nom</span><input type="text" data-asso="nom" value="${esc(a.nom)}"></div>
      <div class="champ"><span class="lib">Capital</span><div class="saisie-u"><input data-asso="parts" inputmode="decimal" value="${esc(formatSaisie(a.parts))}"><i>%</i></div></div>
      <div class="champ"><span class="lib" title="Part des résultats prévue par les statuts (montage « SCI IR inégale »)">Résultats</span><div class="saisie-u"><input data-asso="resultat" inputmode="decimal" value="${esc(formatSaisie(a.resultat ?? a.parts))}"><i>%</i></div></div>
      <div class="champ"><span class="lib">TMI</span><select data-asso="tmi">${tmis.map((t) => `<option value="${t}" ${+a.tmi === t ? "selected" : ""}>${t} %</option>`).join("")}</select></div>
      <button type="button" class="mini x" data-suppr-asso="${i}" aria-label="Retirer" ${h.associes.length < 2 ? "disabled" : ""}>✕</button></div>`).join("");
  const total = (h.associes || []).reduce((s, a) => s + (+a.parts || 0), 0);
  if (Math.round(total) !== 100) z.insertAdjacentHTML("beforeend", `<p class="aide" style="color:var(--rouge)">Total des parts : ${total.toLocaleString("fr-FR")} % (les calculs les ramènent à 100 %).</p>`);
}
function majResumes() {
  for (const s of SECTIONS) { const e = document.querySelector(`[data-resume="${s.id}"]`); if (e) e.textContent = s.resume(); }
  const z = $("valeurUsufruit");
  if (z) {
    const B = Moteur.base(h, R, false), D = Math.max(1, Math.min(Math.round(h.usufruitDuree || 1), B.N));
    const v = h.usufruitManuel ? B.prix * (h.usufruitPct || 0) / 100 : Moteur.valeurUsufruit(B, h, D, R);
    z.innerHTML = `Valeur de l'usufruit sur ${D} ans : <b>${eur(v)}</b>, soit ${pct(v / (B.prix || 1), 1)} du prix${h.usufruitManuel ? " (fixée)" : " (valeur économique)"}. À titre de repère, le barème fiscal de l'usufruit temporaire est de 23 % par période de 10 ans.`;
  }
}
let attente;
function changer() {
  stock.ecrire("immo-etat", h);
  majResumes();
  clearTimeout(attente); attente = setTimeout(calculer, 120);
}
$("saisie").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.cle) { h[t.dataset.cle] = lireNombre(t.value); if (t.dataset.cle === "prix" && h.fraisAuto) { const f = $("c-frais"); if (f) f.value = formatSaisie(Math.round(h.prix * (h.neuf ? 0.025 : 0.08))); } changer(); }
  else if (t.dataset.asso) { const i = +t.closest(".associe").dataset.i; const a = h.associes[i]; a[t.dataset.asso] = t.dataset.asso === "nom" ? t.value : lireNombre(t.value); changer(); }
});
$("saisie").addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.cle) t.value = formatSaisie(h[t.dataset.cle]);
  if (t.dataset.select) { h[t.dataset.select] = +t.value; changer(); }
  if (t.dataset.asso === "tmi") { h.associes[+t.closest(".associe").dataset.i].tmi = +t.value; changer(); }
  if (t.dataset.asso === "parts") dessinerAssocies();
  if (t.dataset.case) { h[t.dataset.case] = t.checked; if (t.dataset.case === "fraisAuto") { if (!t.checked) h.frais = Math.round(h.prix * (h.neuf ? 0.025 : 0.08)); dessinerSaisie(); } changer(); }
});
$("saisie").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.seg) { h[b.dataset.seg] = JSON.parse(b.dataset.val); dessinerSaisie(); changer(); }
  if (b.id === "ajoutAssocie") { h.associes.push({ nom: "Associé " + (h.associes.length + 1), parts: 0, tmi: h.tmi }); dessinerAssocies(); changer(); }
  if (b.dataset.supprAsso != null) { h.associes.splice(+b.dataset.supprAsso, 1); dessinerAssocies(); changer(); }
});
$("saisie").addEventListener("toggle", (e) => {
  if (!e.target.matches("details")) return;
  h.ouverts = [...document.querySelectorAll("#saisie details[open]")].map((d) => d.dataset.section);
  stock.ecrire("immo-etat", h);
}, true);

// =====================================================================================
//  4. LES RÉSULTATS
// =====================================================================================
const MONTAGES = Moteur.MONTAGES;
const nomM = (id) => MONTAGES.find((m) => m.id === id).nom;
const courtM = (id) => MONTAGES.find((m) => m.id === id).court;
// lignes du comparatif : [libellé, valeur, format, sens (+1 : plus c'est mieux), aide, fort]
const LIGNES = [
  ["Coût total de l'opération", (r) => r.coutTotal, eur, 0, "prix, frais, travaux (et mobilier en meublé)"],
  ["Montant emprunté", (r) => r.emprunt, eur, 0],
  ["Mensualité (prêt + assurance)", (r) => r.mensualite, eur, 0],
  ["Effort d'épargne moyen", (r) => r.effortMensuel, (x) => (x > 0 ? eur(x) : "aucun (" + eur(-x) + " de gain)") + " /mois", -1, "ce que vous ajoutez chaque mois, après impôts, sur toute la durée"],
  ["Impôts pendant la détention", (r) => r.impotsDetention, eur, -1, "impôt sur le revenu, prélèvements sociaux, IS, flat tax"],
  ["Impôts à la revente", (r) => r.impotRevente, eur, -1, "plus-value, ou IS et liquidation"],
  ["Net en poche à la revente", (r) => r.netRevente, eur, +1, "après remboursement du prêt et impôts"],
  ["Mise de fonds de votre société", (r) => r.miseSociete, eur, 0, "prêt de la holding, ou prix de l'usufruit", false, true],
  ["Gain de votre société", (r) => r.gainSociete, eurS, +1, "après IS, avant la flat tax d'une sortie", false, true],
  ["Enrichissement net", (r) => r.enrichissement, eurS, +1, "net à la revente − apport − efforts d'épargne (+ gain de la société)", true],
  ["Rendement de l'apport (TRI)", (r) => r.tri, (x) => pct(x, 2), +1, "taux de rendement interne de vos versements", true]
];
function calculer() {
  res = Moteur.calculerTout(h, R);
  dessinerResultats();
}
function meilleurId() {
  const ids = Object.keys(res); if (!ids.length) return null;
  return ids.reduce((a, b) => res[b].enrichissement > res[a].enrichissement ? b : a);
}
function dessinerResultats() {
  const ids = MONTAGES.map((m) => m.id).filter((id) => res[id]);
  const best = meilleurId();
  $("meilleur").innerHTML = best ? `<span>Meilleur enrichissement</span><b>${esc(courtM(best))} · ${eurS(res[best].enrichissement)}</b>` : "";
  if (!ids.includes(detail)) detail = ids[0];
  const puce = (m) => `<button type="button" class="puce ${h.montages.includes(m.id) ? "on" : ""}" data-montage="${m.id}" style="--c:${COULEURS[m.id]}" aria-pressed="${h.montages.includes(m.id)}"><i></i>${esc(m.court)}</button>`;
  const puces = `<p class="puces-titre">Classiques</p><div class="choix-montages">${MONTAGES.filter((m) => !m.patrimonial).map(puce).join("")}</div>
    <p class="puces-titre">Patrimoniaux</p><div class="choix-montages">${MONTAGES.filter((m) => m.patrimonial).map(puce).join("")}</div>`;
  $("resultats").innerHTML = `
    <div class="carte"><h2>Montages comparés</h2><div class="corps">${puces}</div></div>
    ${ids.length ? `
    <div class="carte"><h2>Comparatif sur ${h.horizon} ans</h2><div class="corps defile">${tableauComparatif(ids, best)}</div></div>
    <div class="graphes">
      <div class="carte graphe"><h2>Enrichissement net</h2><div class="corps">${grapheBarres(ids)}</div></div>
      <div class="carte graphe"><h2>Trésorerie cumulée</h2><div class="corps">${grapheCourbes(ids)}<p class="aide">Apport, puis efforts ou gains de chaque année, après impôts (avant la revente) ; pour le foyer, sans la société.</p></div></div>
    </div>
    <div class="carte"><h2>Détail par montage</h2><div class="corps">
      <div class="onglets">${ids.map((id) => `<button type="button" data-detail="${id}" class="${id === detail ? "on" : ""}">${esc(courtM(id))}</button>`).join("")}</div>
      ${detailMontage(detail)}
    </div></div>
    <div class="carte"><h2>Points de vigilance</h2><div class="corps"><div class="alertes">${vigilance(ids).map((a) => `<div class="alerte"><b>${esc(a[0])}</b> · ${esc(a[1])}</div>`).join("")}</div></div></div>
    <p class="limites">${LIMITES}</p>` : `<p class="aide">Choisissez au moins un montage.</p>`}`;
}
const LIMITES = "Simulation indicative, à affiner avec un conseil. L'impôt sur le revenu est calculé à la tranche marginale saisie (sans recalcul du barème, du quotient familial ni des plafonnements). Achat au 1er janvier de l'année 1, revente le 31 décembre de la dernière année, prêt soldé à la revente sans indemnité. Taux et barèmes : menu Réglages.";
function tableauComparatif(ids, best) {
  const tete = `<thead><tr><th></th>${ids.map((id) => `<th style="--c:${COULEURS[id]}"><b><i></i>${esc(courtM(id))}</b>${id === best ? "★ le meilleur" : ""}</th>`).join("")}</tr></thead>`;
  const avecSociete = ids.some((id) => res[id].extra.societe);
  const corps = LIGNES.filter((x) => !x[6] || avecSociete).map(([lib, f, fmt, sens, aide, fort]) => {
    const vals = ids.map((id) => f(res[id]));
    const valides = vals.filter((v) => v != null && isFinite(v));
    const cible = sens > 0 ? Math.max(...valides) : sens < 0 ? Math.min(...valides) : null;

// graphique en barres : enrichissement net par montage
function grapheBarres(ids) {

  const zero = neg ? g + (L - g - 70) * (Math.abs(Math.min(0, ...vals)) / (max + Math.abs(Math.min(0, ...vals)))) : g;
  const ech = (L - zero - 70) / max;
  return `<svg viewBox="0 0 ${L} ${H}" role="img" aria-label="Enrichissement net par montage">

      return `<text x="0" y="${y + 14}">${esc(courtM(id))}</text><rect x="${v >= 0 ? zero : zero - w}" y="${y}" width="${Math.max(1, w)}" height="20" rx="4" fill="${COULEURS[id]}"/>
        <text class="val" x="${v >= 0 ? zero + w + 6 : zero + 6}" y="${y + 14}">${esc(eurS(v))}</text>`; }).join("")}</svg>`;

// graphique en courbes : trésorerie cumulée de chaque montage, année par année
function grapheCourbes(ids) {
  const L = 520, H = 240, gx = 62, gy = 14, bas = H - 26;
  const N = h.horizon;
  const series = ids.map((id) => [-res[id].apport, ...res[id].tresorerieCumulee]);
  const tout = series.flat(); const min = Math.min(0, ...tout), max = Math.max(0, ...tout);
  const X = (a) => gx + (L - gx - 10) * a / N, Y = (v) => gy + (bas - gy) * (max - v) / ((max - min) || 1);
  const pas = Math.pow(10, Math.floor(Math.log10(((max - min) || 1) / 4))), unite = [1, 2, 5, 10].map((k) => k * pas).find((u) => (max - min) / u <= 5) || pas * 10;
  const graduations = []; for (let v = Math.ceil(min / unite) * unite; v <= max; v += unite) graduations.push(v);
  const ansG = []; const pasA = N <= 10 ? 1 : N <= 20 ? 2 : 5; for (let a = 0; a <= N; a += pasA) ansG.push(a);
  return `<svg viewBox="0 0 ${L} ${H}" role="img" aria-label="Trésorerie cumulée">
    ${graduations.map((v) => `<line x1="${gx}" x2="${L - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bordure)" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${gx - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v / 1000).toLocaleString("fr-FR")} k€</text>`).join("")}
    ${ansG.map((a) => `<text x="${X(a)}" y="${H - 8}" text-anchor="middle">${a === 0 ? "achat" : "an " + a}</text>`).join("")}
    ${series.map((s, i) => `<polyline fill="none" stroke="${COULEURS[ids[i]]}" stroke-width="2.4" stroke-linejoin="round" points="${s.map((v, a) => X(a) + "," + Y(v)).join(" ")}"/>`).join("")}

  tete.eachCell((c) => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF0C2D39" } }; });
  const avecSociete = ids.some((id) => res[id].extra.societe);
  for (const [lib, f, , , , , soc] of LIGNES) {
    if (soc && !avecSociete) continue;
    const row = ws.addRow([lib, ...ids.map((id) => { const v = f(res[id]); return v == null ? null : (lib.includes("TRI") ? v : Math.round(v)); })]);
    row.eachCell((c, i) => { if (i > 1) c.numFmt = lib.includes("TRI") ? "0.00 %" : fmtE; });
  }
  ws.addRow([]);
  ws.addRow(["Points de vigilance"]).font = { bold: true };
  vigilance(ids).forEach(([a, b]) => ws.addRow([a, b]));
  ws.addRow([]); ws.addRow([LIMITES]).font = { italic: true, size: 9 };
  ws.getColumn(1).width = 42; for (let i = 2; i <= ids.length + 1; i++) ws.getColumn(i).width = 16;
  for (const id of ids) {
    const r = res[id], f = wb.addWorksheet(courtM(id).slice(0, 31));
    f.addRow([nomM(id)]).font = { bold: true, size: 13, color: { argb: "FF0C2D39" } };
    f.addRow([]);
    const cols = ["Année", "Loyers", "Charges", "Intérêts et assurance", "Amortissements", "Résultat", "Imposable", "Impôts", "Cash-flow après impôts", "Capital restant dû"];
    const t = f.addRow(cols); t.font = { bold: true, color: { argb: "FFFFFFFF" } }; t.eachCell((c) => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + COUL_HEX[id] } }; });
    r.lignes.forEach((l) => { const row = f.addRow([l.a, l.loyers, l.charges, l.interets, l.amort, l.resultat, l.imposable, l.impot, l.cashflow, l.crd].map((v, i) => i ? Math.round(v) : v)); row.eachCell((c, i) => { if (i > 1) c.numFmt = fmtE; }); });
    const tot = f.addRow(["Total", ...["loyers", "charges", "interets", "amort", "resultat", "imposable", "impot", "cashflow"].map((k) => Math.round(r.lignes.reduce((s, l) => s + l[k], 0))), null]);
    tot.font = { bold: true }; tot.eachCell((c, i) => { if (i > 1) c.numFmt = fmtE; });
    f.addRow([]);
    f.addRow(["Revente"]).font = { bold: true };
    f.addRow(["Prix de revente estimé", Math.round(r.prixRevente)]).getCell(2).numFmt = fmtE;
    f.addRow(["Impôts à la revente", Math.round(r.impotRevente)]).getCell(2).numFmt = fmtE;
    f.addRow(["Capital restant dû remboursé", Math.round(r.crdFin)]).getCell(2).numFmt = fmtE;
    f.addRow(["Net en poche", Math.round(r.netRevente)]).getCell(2).numFmt = fmtE;
    f.addRow(["Enrichissement net", Math.round(r.enrichissement)]).getCell(2).numFmt = fmtE;
    const tr = f.addRow(["TRI", r.tri]); tr.getCell(2).numFmt = "0.00 %";
    if (r.extra.societe) {
      const S = r.extra.societe;
      f.addRow([]); f.addRow(["Votre société (" + S.nom + ")"]).font = { bold: true };
      f.addRow(["Mise de fonds", Math.round(S.montant)]).getCell(2).numFmt = fmtE;
      const ts = f.addRow(["Année", "Recettes", "IS", "Trésorerie"]); ts.font = { bold: true };
      S.lignes.forEach((l) => { const row = f.addRow([l.a, Math.round(l.recettes), Math.round(l.is), Math.round(l.cash)]); row.eachCell((c, i) => { if (i > 1) c.numFmt = fmtE; }); });
      f.addRow(["Gain de la société (après IS)", Math.round(S.gain)]).getCell(2).numFmt = fmtE;
      f.addRow(["Enrichissement du foyer", Math.round(r.enrichissementFoyer)]).getCell(2).numFmt = fmtE;
    }
    f.columns.forEach((c, i) => { c.width = i ? 16 : 26; });
  }
  const buf = await wb.xlsx.writeBuffer();
  telecharger(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), nomFichier("xlsx"));
  toast("Fichier Excel prêt.");
}

  [hyp.slice(0, moitie), hyp.slice(moitie)].forEach((bloc, i) => s.addTable(bloc.map(([a, b]) => [{ text: a, options: { color: GRIS } }, { text: b, options: { bold: true, color: BLEU } }]),
    { x: 0.5 + i * 6.3, y: 1.3, w: 6, colW: [2.6, 3.4], fontFace: POL, fontSize: 11, border: { type: "solid", pt: 0.5, color: "E2DACB" }, rowH: 0.36 }));
  // 3. comparatif
  s = p.addSlide(); titre(s, "Comparatif des montages", best ? "Meilleur enrichissement : " + courtM(best) : "");
  const lignesT = [[{ text: "", options: { fill: { color: BLEU } } }, ...ids.map((id) => ({ text: courtM(id), options: { bold: true, color: "FFFFFF", fill: { color: COUL_HEX[id] }, align: "center" } }))]];
  const avecSoc = ids.some((id) => res[id].extra.societe);

    const vals = ids.map((id) => f(res[id])), ok = vals.filter((v) => v != null && isFinite(v));

    lignesT.push([{ text: lib, options: { bold: !!fort, color: BLEU } }, ...vals.map((v) => ({ text: fmt(v), options: { align: "right", bold: !!fort || (sens && v === cible), color: sens && v === cible ? "2F7D5B" : "1C2A30" } }))]);
  }
  s.addTable(lignesT, { x: 0.5, y: 1.45, w: 12.3, colW: [3.3, ...ids.map(() => 9 / ids.length)], fontFace: POL, fontSize: ids.length > 6 ? 8.5 : 11, border: { type: "solid", pt: 0.5, color: "E2DACB" }, rowH: 0.42 });
  // 4. graphiques
  s = p.addSlide(); titre(s, "Enrichissement net et trésorerie");
  s.addChart(p.ChartType.bar, [{ name: "Enrichissement net", labels: ids.map(courtM), values: ids.map((id) => Math.round(res[id].enrichissement)) }],
    { x: 0.4, y: 1.2, w: 5.6, h: 5.6, barDir: "bar", catAxisLabelPos: "low", chartColors: ids.map((id) => COUL_HEX[id]), showValue: true, dataLabelFormatCode: '# ##0 "€"', valAxisLabelFormatCode: '# ##0', catAxisLabelFontSize: 11, valAxisLabelFontSize: 9, dataLabelFontSize: 10, showLegend: false });
  const labels = ["achat", ...res[ids[0]].lignes.map((l) => "an " + l.a)];
  s.addChart(p.ChartType.line, ids.map((id) => ({ name: courtM(id), labels, values: [-res[id].apport, ...res[id].tresorerieCumulee].map(Math.round) })),
    { x: 6.2, y: 1.2, w: 6.8, h: 5.6, chartColors: ids.map((id) => COUL_HEX[id]), lineSize: 2, lineDataSymbol: "none", showLegend: true, legendPos: "b", valAxisLabelFormatCode: '# ##0', catAxisLabelFontSize: 9, valAxisLabelFontSize: 9,
      showTitle: true, title: "Trésorerie cumulée (avant revente)", titleFontSize: 12 });
  // 5. une diapositive par montage
  for (const id of ids) {
    const r = res[id]; s = p.addSlide(); titre(s, nomM(id));
    const k = [["Effort moyen", (r.effortMensuel > 0 ? eur(r.effortMensuel) : eur(0)) + " /mois"], ["Impôts pendant la détention", eur(r.impotsDetention)], ["Impôts à la revente", eur(r.impotRevente)], ["Enrichissement net", eurS(r.enrichissement)], ["TRI", pct(r.tri, 2)]];
    k.forEach(([a, b], i) => { s.addShape(p.ShapeType.roundRect, { x: 0.5 + i * 2.48, y: 1.2, w: 2.3, h: 1.1, fill: { color: "EFE9DE" }, rectRadius: 0.08, line: { color: "EFE9DE" } });
      s.addText([{ text: a + "\n", options: { fontSize: 10, color: GRIS } }, { text: b, options: { fontSize: 17, bold: true, color: BLEU, fontFace: "Georgia" } }], { x: 0.6 + i * 2.48, y: 1.25, w: 2.1, h: 1, fontFace: POL, valign: "middle" }); });
    const choix = r.lignes.filter((l) => l.a === 1 || l.a === 5 || l.a === 10 || l.a === 15 || l.a === 20 || l.a === r.lignes.length).slice(0, 6);
    const tab = [["Année", "Loyers", "Charges", "Intérêts", "Résultat", "Impôts", "Cash-flow"].map((t) => ({ text: t, options: { bold: true, color: "FFFFFF", fill: { color: COUL_HEX[id] }, align: "center" } })),

    s.addTable(tab, { x: 0.5, y: 2.6, w: 7.6, fontFace: POL, fontSize: 10.5, border: { type: "solid", pt: 0.5, color: "E2DACB" }, rowH: 0.36 });
    const pv = r.pv;
    const rev = id === "sciIS"
      ? [["Prix de revente", eur(r.prixRevente)], ["IS sur la plus-value", eur(pv.is)], ["Compte courant rendu", eur(pv.rendCCA)], ["Boni de liquidation", eur(pv.boni)], ["Flat tax et droit de partage", eur(pv.pfu + pv.droitPartage)], ["Net en poche", eur(r.netRevente)]]
      : [["Prix de revente", eur(r.prixRevente)], ["Plus-value brute", eur(Math.max(0, pv.brute))], ["Impôt et prélèvements", eur(pv.total)], ["Capital restant dû", eur(r.crdFin)], ["Net en poche", eur(r.netRevente)]];
    s.addText("Revente dans " + h.horizon + " ans", { x: 8.5, y: 2.55, w: 4.4, h: 0.4, fontFace: "Georgia", fontSize: 15, bold: true, color: BLEU });
    s.addTable(rev.map(([a, b], i) => [{ text: a, options: { color: GRIS, bold: i === rev.length - 1 } }, { text: b, options: { align: "right", bold: i === rev.length - 1, color: BLEU } }]),
      { x: 8.5, y: 3.0, w: 4.4, colW: [2.6, 1.8], fontFace: POL, fontSize: 11, border: { type: "solid", pt: 0.5, color: "E2DACB" }, rowH: 0.36 });
  }
  // 6. vigilance
  s = p.addSlide(); titre(s, "Points de vigilance");
  s.addText(vigilance(ids).map(([a, b]) => ({ text: a + " : " + b, options: { bullet: true, breakLine: true } })), { x: 0.6, y: 1.2, w: 12.1, h: 5.4, fontFace: POL, fontSize: 13, color: "1C2A30", valign: "top", paraSpaceAfter: 6 });
  s.addText(LIMITES, { x: 0.6, y: 6.7, w: 12.1, h: 0.6, fontFace: POL, fontSize: 9, color: GRIS, italic: true });
  await p.writeFile({ fileName: nomFichier("pptx") });
  toast("Présentation prête.");
}
