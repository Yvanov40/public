<!doctype html>
<!-- =====================================================================================
     Investissement immobilier — comparateur de montages
     Un projet (le bien, les loyers, le prêt, les associés, la revente) et plusieurs façons de le
     détenir, calculées côte à côte : location nue en direct (micro-foncier ou réel), LMNP
     (micro-BIC ou réel), SCI à l'IR, SCI à l'IS.
     Fichiers : index.html (cette page : l'affichage), moteur.js (le calcul), vendor/ (bibliothèques
     des exports Excel et PowerPoint, chargées seulement quand on exporte).
     Les simulations se rattachent aux clients du Suivi des dossiers (bouton « Simulations »).
     ===================================================================================== -->
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- habillage : début (apparence commune des applis ; module commun, voir habillage.source.js à la racine du dépôt) -->
<script>
window.HABILLAGE = {
  vars: { principaleTexte: ["--bleu"], accentTexte: ["--or"], fond: ["--fond"], carte: ["--carte"], bordure: ["--bordure"], section: ["--section"], texte: ["--texte"], discret: ["--discret"], sans: ["--ui"], serif: ["--titre"] },
  theme: { attr: "data-theme", sombre: "dark", clair: "light" },
  cartes: ".carte,.chiffre,.puce,.mini,.onglets button",
  css: "header.haut,.fen header{background:var(--hb-barre)!important}",
  bouton: function () {
    var b = document.createElement("button"); b.type = "button"; b.className = "bt-h";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.7-1 1.2-1.9-.6-1.1.2-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5.5-4-9.8-9-9.8z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="10.5" cy="7" r="1.1"/><circle cx="15.2" cy="7.6" r="1.1"/></svg><span>Apparence</span>';
    var r = document.getElementById("bRegl"); if (!r) return null; r.before(b); return b;
  }
};
// =====================================================================================
//  Habillage commun — la même apparence et le même panneau « Apparence » dans toutes les applis
//  (module commun, recopié tel quel au début de audit/, pvi/, succession/, immo/ et revision/,
//   entre les repères « habillage : début » et « habillage : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  • Par défaut, chaque appli reprend l'apparence du Suivi des dossiers (couleurs, fond, polices,
//    thème clair ou sombre, taille d'affichage, coins, relief), lue dans la mémoire du navigateur.
//  • On peut aussi régler une apparence propre aux applis (commune à toutes) : panneau « Apparence ».
//  • Chaque appli garde ses propres noms de couleurs : window.HABILLAGE (posé juste avant ce bloc)
//    dit quelle variable CSS de l'appli reçoit quelle couleur commune, et comment s'écrit son thème.
//  Rangement : localStorage « applis-apparence » = { suivre, principale, accent, fond, texte, titres, theme, taille, coins, relief }
// =====================================================================================
(function () {
  "use strict";
  var C = window.HABILLAGE;
  if (!C) return;
  var CLE = "applis-apparence";
  var POLICES = {
    plex: ['"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "IBM+Plex+Sans:wght@400;500;600", "IBM Plex Sans"],
    inter: ['"Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "Inter:wght@400;500;600", "Inter"],
    nunito: ['"Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "Nunito:wght@400;600;700", "Nunito"],
    systeme: ['system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "", "Celle de l'appareil"],
    lora: ['"Lora", Georgia, "Times New Roman", serif', "Lora:wght@400;500;600", "Lora"],
    garamond: ['"EB Garamond", Garamond, Georgia, "Times New Roman", serif', "EB+Garamond:wght@500;600", "EB Garamond"],
    playfair: ['"Playfair Display", Georgia, "Times New Roman", serif', "Playfair+Display:wght@500;600", "Playfair Display"],
    georgia: ['Georgia, "Times New Roman", serif', "", "Georgia"]
  };
  var FONDS = {   // en clair : fond de page, cartes, bordures, sections
    creme: { fond: "#f7f4ee", carte: "#fffdf9", bordure: "#e2dacb", section: "#efe9de" },
    blanc: { fond: "#f4f5f7", carte: "#ffffff", bordure: "#e1e4e8", section: "#e8ebef" },
    gris:  { fond: "#ecebe8", carte: "#f8f7f5", bordure: "#d6d3cc", section: "#dedbd4" }
  };
  var SOMBRE = { fond: "#0f1b20", carte: "#16262d", bordure: "#27404a", section: "#1b2e36", texte: "#e8e3d9", discret: "#9aa7a9", champ: "#0f1b20" };
  var PALETTES = [
    ["Bleu nuit et or", "#0c2d39", "#a77d2f"], ["Sapin et cuivre", "#17392b", "#b0672c"], ["Bordeaux et or", "#4a1626", "#b08a3c"],
    ["Ardoise et corail", "#27323d", "#d9634c"], ["Bleu roi et acier", "#1d3f8a", "#6f7b8c"], ["Prune et rose", "#3b2143", "#c2577d"],
    ["Noir et orange", "#1b1b1f", "#e07b1a"], ["Canard et sable", "#0f4c5c", "#c49a52"]
  ];
  var DEFAUT = { principale: "#0c2d39", accent: "#a77d2f", fond: "creme", texte: "plex", titres: "garamond", theme: "auto", taille: 100, coins: "arrondis", relief: "normal" };
  var rvb = function (h) { var n = parseInt(String(h).replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  var melange = function (a, b, part) { var x = rvb(a), y = rvb(b); return "#" + x.map(function (v, i) { return Math.round(v * (1 - part) + y[i] * part).toString(16).padStart(2, "0"); }).join(""); };
  var lireJSON = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

  // ---------------------------------------------------------------- les réglages : ceux du Suivi, ou ceux des applis
  function duSuivi() {
    var a = lireJSON("suivi-gp-apparence") || {}, p = a.page || {}, th = "auto";
    try { th = localStorage.getItem("suivi-gp-theme") || "auto"; } catch (e) {}
    return { principale: a.principale || DEFAUT.principale, accent: a.accent || DEFAUT.accent, fond: a.fond || DEFAUT.fond, texte: a.texte || DEFAUT.texte, titres: a.titres || DEFAUT.titres,
      theme: th, taille: +p.taille || 100, coins: p.coins || "arrondis", relief: p.relief || "normal" };
  }
  function reglages() {
    var p = lireJSON(CLE) || {};
    if (p.suivre !== false) { var s = duSuivi(); s.suivre = true; return s; }
    var r = {}; for (var k in DEFAUT) r[k] = p[k] != null ? p[k] : DEFAUT[k];
    r.suivre = false; return r;
  }
  function garder(changes) {
    var p = lireJSON(CLE) || {};
    if (changes.suivre === false && p.suivre !== false) { var s = duSuivi(); for (var k in s) if (p[k] == null) p[k] = s[k]; }   // on part de l'apparence du Suivi
    for (var c in changes) p[c] = changes[c];
    try { localStorage.setItem(CLE, JSON.stringify(p)); } catch (e) {}
    appliquer();
  }
  var tel = window.matchMedia("(max-width: 900px)"), systemeSombre = window.matchMedia("(prefers-color-scheme: dark)");
  // comme dans le Suivi : « auto » = clair sur téléphone, le réglage du système sur ordinateur
  var sombre = function (r) { return r.theme === "sombre" || (r.theme === "auto" && !tel.matches && systemeSombre.matches); };

  // ---------------------------------------------------------------- appliquer
  function appliquer() {
    var r = reglages(), nuit = sombre(r) && !C.sansSombre, f = FONDS[r.fond] || FONDS.creme;   // sansSombre : appli prévue pour le clair seulement
    // les couleurs communes, en clair ou en sombre
    var c = nuit ? {
      principale: r.principale, principaleTexte: melange(r.principale, "#ffffff", 0.6), accent: melange(r.accent, "#ffffff", 0.25), accentTexte: melange(r.accent, "#ffffff", 0.3),
      barre: melange(r.principale, "#000000", 0.55), fond: SOMBRE.fond, carte: SOMBRE.carte, champ: SOMBRE.champ, bordure: SOMBRE.bordure, section: SOMBRE.section, texte: SOMBRE.texte, discret: SOMBRE.discret
    } : {
      principale: r.principale, principaleTexte: r.principale, accent: r.accent, accentTexte: r.accent,
      barre: r.principale, fond: f.fond, carte: f.carte, champ: "#ffffff", bordure: f.bordure, section: f.section, texte: "#1c2a30", discret: "#6f6b63"
    };
    c.sans = (POLICES[r.texte] || POLICES.plex)[0];
    c.serif = (POLICES[r.titres] || POLICES.garamond)[0];
    // le thème, tel que l'appli l'écrit (data-theme="dark", "sombre"…)
    if (C.theme) {
      var el = document.documentElement;
      if (nuit) el.setAttribute(C.theme.attr, C.theme.sombre);
      else if (C.theme.clair) el.setAttribute(C.theme.attr, C.theme.clair); else el.removeAttribute(C.theme.attr);
    }
    // polices (chargées à la demande)
    [r.texte, r.titres].forEach(function (k) {
      var p = POLICES[k]; if (!p || !p[1] || document.getElementById("hb-police-" + k)) return;
      var l = document.createElement("link"); l.id = "hb-police-" + k; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + p[1] + "&display=swap";
      document.head.appendChild(l);
    });
    // les variables de l'appli reçoivent les couleurs communes (!important : elles l'emportent sur ses propres réglages)
    var css = ":root{--hb-barre:" + c.barre + ";--hb-principale:" + c.principale + ";--hb-accent:" + c.accent + ";--hb-accent-texte:" + c.accentTexte + ";--hb-sans:" + c.sans + ";--hb-serif:" + c.serif + ";color-scheme:" + (nuit ? "dark" : "light");
    for (var cle in C.vars) C.vars[cle].forEach(function (v) { if (c[cle] != null) css += ";" + v + ":" + c[cle] + " !important"; });
    css += "}";
    if (+r.taille && +r.taille !== 100) css += "html{zoom:" + (r.taille / 100) + "}";
    var cartes = C.cartes || ".carte,.card";
    if (r.coins === "droits") css += "html *:not(i):not(.point):not(input[type=radio]):not(.hb-rond){border-radius:3px!important}";
    if (r.coins === "ronds") css += ":is(" + cartes + ",button,input,select,textarea){border-radius:18px!important}";
    if (r.relief === "plat") css += "html *:not(.hb-garder-ombre){box-shadow:none!important}";
    if (r.relief === "ombres") css += ":is(" + cartes + "){box-shadow:" + (nuit ? "0 4px 14px rgba(0,0,0,.35)" : "0 1px 2px rgba(12,45,57,.08),0 4px 14px rgba(12,45,57,.10)") + "!important}";
    css += (typeof C.css === "function" ? C.css(c, nuit) : C.css || "");
    css += PANNEAU_CSS;
    var st = document.getElementById("habillage");
    if (!st) { st = document.createElement("style"); st.id = "habillage"; (document.head || document.documentElement).appendChild(st); }
    st.textContent = css;
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute("content", c.barre);
    etat = { reglages: r, couleurs: c, sombre: nuit, police: (POLICES[r.texte] || POLICES.plex)[2], policeTitres: (POLICES[r.titres] || POLICES.garamond)[2] };
    if (typeof C.apres === "function") try { C.apres(etat); } catch (e) {}
  }
  var etat = null;

  // ---------------------------------------------------------------- le panneau « Apparence » (le même partout)
  var PANNEAU_CSS = [
    ".hb-voile{position:fixed;inset:0;z-index:2147482000;background:rgba(10,20,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px 14px}",
    ".hb-fen{background:var(--hb-fond,#f7f4ee);color:var(--hb-texte,#1c2a30);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);font:14px/1.45 var(--hb-sans)}",
    ".hb-tete{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--hb-barre);color:#fff}.hb-tete b{flex:1;font:600 19px var(--hb-serif)}",
    ".hb-x{border:0;background:none;color:#fff;font-size:24px;line-height:1;cursor:pointer}",
    ".hb-corps{padding:14px 16px 18px;overflow-y:auto;display:grid;gap:12px}",
    ".hb-titre{margin:4px 0 -4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--hb-discret,#7c7466);font-weight:600}",
    ".hb-choix{display:flex;flex-wrap:wrap;gap:6px}",
    ".hb-bt{font:inherit;font-size:13.5px;border:1px solid var(--hb-bordure,#e2dacb);background:var(--hb-carte,#fff);color:inherit;border-radius:999px;padding:7px 13px;cursor:pointer}",
    ".hb-bt.on{border-color:var(--hb-principale);background:var(--hb-principale);color:#fff;font-weight:600}",
    ".hb-pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}",
    ".hb-pal button{border:1px solid var(--hb-bordure,#e2dacb);background:var(--hb-carte,#fff);color:inherit;border-radius:10px;padding:7px;cursor:pointer;font:inherit;font-size:11.5px;display:grid;gap:5px;text-align:left}",
    ".hb-pal button.on{outline:2px solid var(--hb-accent);outline-offset:-2px}",
    ".hb-pal i{display:flex;height:16px;border-radius:5px;overflow:hidden}.hb-pal i span{flex:2}.hb-pal i span+span{flex:1}",
    ".hb-coul{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hb-coul label{display:flex;align-items:center;gap:8px;font-size:13px}",
    ".hb-coul input{width:44px;height:32px;border:1px solid var(--hb-bordure,#e2dacb);border-radius:8px;padding:2px;background:none;cursor:pointer}",
    ".hb-suivre{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--hb-section,#efe9de);cursor:pointer}",
    ".hb-suivre input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--hb-principale);flex:none}",
    ".hb-suivre small{display:block;color:var(--hb-discret,#7c7466);font-size:12px}",
    ".hb-aide{margin:0;font-size:12px;color:var(--hb-discret,#7c7466)}",
    ".hb-lien{border:0;background:none;color:var(--hb-discret,#7c7466);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;justify-self:start;padding:0}",
    "@media (max-width:700px){.hb-voile{align-items:flex-end;padding:0}.hb-fen{border-radius:18px 18px 0 0;max-height:90vh}.hb-pal{grid-template-columns:repeat(2,minmax(0,1fr))}}"
  ].join("");
  function h(tag, attrs, enfants) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k.slice(0, 2) === "on") e[k] = attrs[k]; else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]); }
    [].concat(enfants || []).forEach(function (x) { if (x != null && x !== false) e.append(x); });
    return e;
  }
  var voile = null;
  function panneau() {
    var c = etat.couleurs;
    voile = voile || h("div", { class: "hb-voile", onclick: function (e) { if (e.target === voile) voile.remove(); } });
    voile.style.setProperty("--hb-fond", c.fond); voile.style.setProperty("--hb-carte", c.carte); voile.style.setProperty("--hb-texte", c.texte);
    voile.style.setProperty("--hb-bordure", c.bordure); voile.style.setProperty("--hb-section", c.section); voile.style.setProperty("--hb-discret", c.discret);
    document.body.append(voile);
    dessiner();
  }
  function dessiner() {
    var r = reglages(), lib = !r.suivre;
    var choix = function (titre, cle, options) {
      return [h("p", { class: "hb-titre" }, titre), h("div", { class: "hb-choix" }, options.map(function (o) {
        return h("button", { type: "button", class: "hb-bt" + (String(r[cle]) === String(o[0]) ? " on" : ""), disabled: lib ? null : "disabled", onclick: function () { garder(ob(cle, o[0])); dessiner(); } }, o[1]);
      }))];
    };
    var ob = function (k, v) { var o = {}; o[k] = v; return o; };
    var polices = function (titre, cle, liste) { return choix(titre, cle, liste.map(function (k) { return [k, POLICES[k][2]]; })); };
    var corps = [
      h("label", { class: "hb-suivre" }, [h("input", { type: "checkbox", checked: r.suivre ? "checked" : null, onchange: function (e) { garder({ suivre: e.target.checked }); dessiner(); } }),
        h("span", null, ["Comme le Suivi des dossiers", h("small", null, r.suivre ? "Couleurs, fond, polices, thème, taille et coins viennent du Suivi (menu ⋯ › Apparence). Décochez pour régler ici une apparence propre aux applis." : "Apparence propre aux applis (Audit, Succession, Plus-value, Investissement, Révision) : elle vaut pour toutes.")])])
    ];
    if (lib) {
      corps.push(h("p", { class: "hb-titre" }, "Palettes"), h("div", { class: "hb-pal" }, PALETTES.map(function (p) {
        return h("button", { type: "button", class: r.principale.toLowerCase() === p[1] && r.accent.toLowerCase() === p[2] ? "on" : "", onclick: function () { garder({ principale: p[1], accent: p[2] }); dessiner(); } },
          [h("i", null, [h("span", { style: "background:" + p[1] }), h("span", { style: "background:" + p[2] })]), p[0]]);
      })));
      corps.push(h("div", { class: "hb-coul" }, [
        h("label", null, [h("input", { type: "color", value: r.principale, oninput: function (e) { garder({ principale: e.target.value }); } }), "Couleur principale"]),
        h("label", null, [h("input", { type: "color", value: r.accent, oninput: function (e) { garder({ accent: e.target.value }); } }), "Couleur d'accent"])]));
    }
    corps = corps.concat(
      choix("Thème", "theme", [["auto", "Automatique"], ["clair", "Clair"], ["sombre", "Sombre"]]),
      choix("Fond", "fond", [["creme", "Crème"], ["blanc", "Blanc"], ["gris", "Gris"]]),
      polices("Police du texte", "texte", ["plex", "inter", "nunito", "systeme"]),
      polices("Police des titres", "titres", ["garamond", "lora", "playfair", "georgia", "plex"]),
      choix("Taille de l'affichage", "taille", [[90, "Petite"], [100, "Normale"], [110, "Grande"], [125, "Très grande"]]),
      choix("Coins", "coins", [["arrondis", "Arrondis"], ["ronds", "Très arrondis"], ["droits", "Droits"]]),
      choix("Relief", "relief", [["plat", "Plat"], ["normal", "Normal"], ["ombres", "Ombres portées"]]));
    if (C.sansSombre) corps.push(h("p", { class: "hb-aide" }, "Cette appli reste en clair, même avec le thème sombre."));
    if (C.note) corps.push(h("p", { class: "hb-aide" }, C.note));
    if (lib) corps.push(h("button", { type: "button", class: "hb-lien", onclick: function () { try { localStorage.removeItem(CLE); } catch (e) {} garder({ suivre: true }); dessiner(); } }, "↺ Revenir à l'apparence du Suivi"));
    voile.replaceChildren(h("div", { class: "hb-fen", role: "dialog", "aria-modal": "true", "aria-label": "Apparence" }, [
      h("div", { class: "hb-tete" }, [h("b", null, "Apparence"), h("button", { type: "button", class: "hb-x", "aria-label": "Fermer", onclick: function () { voile.remove(); } }, "×")]),
      h("div", { class: "hb-corps" }, corps)]));
  }

  // ---------------------------------------------------------------- démarrage
  appliquer();
  tel.addEventListener("change", appliquer);
  systemeSombre.addEventListener("change", appliquer);
  // changement fait dans une autre fenêtre (le Suivi, ou une autre appli)
  addEventListener("storage", function (e) { if (e.key === CLE || e.key === "suivi-gp-apparence" || e.key === "suivi-gp-theme") { appliquer(); if (voile && voile.parentNode) dessiner(); } });
  // si l'appli réécrit son thème elle-même, on remet le nôtre
  if (C.theme) new MutationObserver(function () {
    var att = document.documentElement.getAttribute(C.theme.attr), voulu = etat && etat.sombre ? C.theme.sombre : (C.theme.clair || null);
    if (att !== voulu) { if (voulu == null) document.documentElement.removeAttribute(C.theme.attr); else document.documentElement.setAttribute(C.theme.attr, voulu); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: [C.theme.attr] });
  function installer() {
    var b = C.bouton && C.bouton();
    if (b) { b.title = "Apparence"; b.onclick = function (e) { e.preventDefault(); e.stopPropagation(); panneau(); }; }
    appliquer();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
  addEventListener("keydown", function (e) { if (e.key === "Escape" && voile && voile.parentNode) voile.remove(); });
  window.Habillage = { etat: function () { return etat; }, ouvrir: function () { panneau(); }, appliquer: appliquer };
})();
</script>
<!-- habillage : fin -->



<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investissement immobilier</title>
<meta name="description" content="Comparateur de montages d'investissement immobilier : nu, LMNP, SCI à l'IR, SCI à l'IS.">
<meta name="theme-color" content="#0c2d39">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- couleurs et polices (clair, puis sombre) ---------- */
:root {
  --bleu: #0c2d39; --or: #a77d2f; --or-doux: #f3e9d4; --bleu-doux: #e3ebee;
  --fond: #f7f4ee; --carte: #fffdf9; --section: #efe9de; --bordure: #e2dacb; --texte: #1c2a30; --discret: #7c7466;
  --vert: #2f7d5b; --rouge: #b4473b;
  --ui: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --titre: "EB Garamond", Georgia, serif;
  --c1: #0c2d39; --c2: #a77d2f; --c3: #4f7f8f; --c4: #c86b4a; --c5: #6f8f4e; --c6: #8a6bb5; --c7: #2f8a78; --c8: #9b5a2f; --c9: #4f63b0; --c10: #b0577a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bleu: #9cc3d1; --or: #d4ad62; --or-doux: #3a3020; --bleu-doux: #1d3540;
    --fond: #0f1b20; --carte: #16262d; --section: #1b2e36; --bordure: #27404a; --texte: #e8e3d9; --discret: #9aa7a9;
    --vert: #6cc39b; --rouge: #e48a7f; --c1: #9cc3d1; --c2: #d4ad62; --c3: #7fb3c4; --c4: #e39b7f; --c5: #9fc27e; --c6: #b89be0; --c7: #6cc3b0; --c8: #d39a6b; --c9: #93a4e6; --c10: #e094b3;
  }
}
:root[data-theme="dark"] {
  --bleu: #9cc3d1; --or: #d4ad62; --or-doux: #3a3020; --bleu-doux: #1d3540;
  --fond: #0f1b20; --carte: #16262d; --section: #1b2e36; --bordure: #27404a; --texte: #e8e3d9; --discret: #9aa7a9;
  --vert: #6cc39b; --rouge: #e48a7f; --c1: #9cc3d1; --c2: #d4ad62; --c3: #7fb3c4; --c4: #e39b7f; --c5: #9fc27e; --c6: #b89be0; --c7: #6cc3b0; --c8: #d39a6b; --c9: #93a4e6; --c10: #e094b3;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font: 14.5px/1.45 var(--ui); }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--titre); font-weight: 600; color: var(--bleu); margin: 0; }

/* ---------- en-tête ---------- */
header.haut { position: sticky; top: 0; z-index: 20; background: #0c2d39; color: #fff; }
.haut-in { display: flex; align-items: center; gap: 16px; padding: 10px 18px; max-width: 1600px; margin: 0 auto; }
.marque { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.marque img { width: 38px; height: 38px; border-radius: 10px; flex: none; }
.marque div { min-width: 0; }
.marque b { display: block; font: 600 20px/1.1 var(--titre); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marque small { display: block; font-size: 12px; color: rgba(255,255,255,.65); }
.meilleur { margin-left: auto; text-align: right; line-height: 1.2; }
.meilleur span { display: block; font-size: 11.5px; color: rgba(255,255,255,.6); }
.meilleur b { font: 600 18px var(--titre); color: #e3c27f; }
.actions { display: flex; gap: 8px; }
.bt-h { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #fff; border-radius: 10px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.bt-h:hover { background: rgba(255,255,255,.14); }
.bt-h svg { width: 18px; height: 18px; flex: none; }
.menu-export { position: absolute; right: 18px; top: 58px; background: var(--carte); color: var(--texte); border: 1px solid var(--bordure); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.18); padding: 6px; display: grid; min-width: 220px; z-index: 30; }
.menu-export button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.menu-export button:hover { background: var(--section); }
.menu-export small { display: block; color: var(--discret); font-size: 11.5px; }

/* ---------- mise en page : saisie à gauche, résultats à droite ---------- */
main { max-width: 1600px; margin: 0 auto; padding: 16px 18px 40px; display: grid; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); gap: 18px; align-items: start; }
.seg.bascule { display: none; }
.saisie { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.resultats { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
.carte { background: var(--carte); border: 1px solid var(--bordure); border-radius: 14px; }
.carte > h2 { font-size: 19px; padding: 12px 16px 0; }
.carte .corps { padding: 10px 16px 16px; }
details.carte > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
details.carte > summary::-webkit-details-marker { display: none; }
details.carte > summary h2 { font-size: 18px; flex: 1; }
details.carte > summary .resume { font-size: 12px; color: var(--discret); text-align: right; }
details.carte > summary::after { content: "›"; transform: rotate(90deg); color: var(--discret); font-size: 18px; transition: transform .15s; }
details.carte:not([open]) > summary::after { transform: rotate(0); }
details.carte > .corps { padding-top: 0; }
.num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 12px; background: var(--bleu); color: var(--carte); font: 600 12.5px var(--ui); flex: none; }

/* ---------- champs ---------- */
.grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-items: start; }
.grille .plein { grid-column: 1 / -1; }
.champ { display: grid; gap: 4px; min-width: 0; }
.champ > label, .champ > .lib { font-size: 12.5px; color: var(--discret); }
.saisie-u { position: relative; }
.saisie-u input { width: 100%; padding: 9px 38px 9px 11px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--fond); font-variant-numeric: tabular-nums; }
.saisie-u input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--or) 60%, transparent); outline-offset: 0; border-color: var(--or); }
.saisie-u i { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--discret); font-size: 12.5px; pointer-events: none; }
select { width: 100%; padding: 9px 11px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--fond); }
.aide { font-size: 12px; color: var(--discret); margin: 0; }
.seg { display: flex; background: var(--section); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--discret); }
.seg button.on { background: var(--carte); color: var(--texte); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.case { display: flex; align-items: center; gap: 8px; font-size: 13.5px; cursor: pointer; }
.case input { width: 18px; height: 18px; accent-color: var(--bleu); }
.associes { display: grid; gap: 8px; }
.associe { display: grid; grid-template-columns: 1fr 76px 76px 84px 32px; gap: 6px; align-items: end; }
.sous-titre { margin: 8px 0 -2px; font: 600 15px var(--titre); color: var(--bleu); border-top: 1px solid var(--bordure); padding-top: 10px; }
.puces-titre { font-size: 12px; color: var(--discret); margin: 10px 0 6px; }
.puces-titre:first-child { margin-top: 0; }
.societe { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bleu-doux); }
.societe .t { font: 600 16px var(--titre); color: var(--bleu); display: block; margin-bottom: 6px; }
.societe .tableau td, .societe .tableau th { background: transparent; }
.associe input[type=text] { width: 100%; padding: 9px 10px; border: 1px solid var(--bordure); border-radius: 10px; background: var(--fond); }
.mini { border: 1px solid var(--bordure); background: var(--carte); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.mini.x { padding: 0; height: 38px; color: var(--rouge); }

/* ---------- résultats ---------- */
.choix-montages { display: flex; flex-wrap: wrap; gap: 6px; }
.puce { border: 1px solid var(--bordure); background: var(--carte); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.puce i { width: 10px; height: 10px; border-radius: 5px; background: var(--c); display: inline-block; }
.puce.on { border-color: var(--bleu); background: var(--bleu-doux); font-weight: 600; }
.puce:not(.on) { color: var(--discret); }
.puce:not(.on) i { opacity: .35; }
.tableau { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tableau th, .tableau td { padding: 8px 10px; border-bottom: 1px solid var(--bordure); text-align: right; white-space: nowrap; }
.tableau th:first-child, .tableau td:first-child { text-align: left; white-space: normal; }
.tableau thead th { font-size: 12px; color: var(--discret); font-weight: 600; vertical-align: bottom; }
.tableau thead th b { display: block; color: var(--texte); font-size: 13.5px; }
.tableau thead th i { display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: var(--c); margin-right: 5px; }
.tableau td.top { color: var(--vert); font-weight: 600; }
.tableau tr.fort td { font-weight: 600; background: var(--section); }
.tableau tr.fort td.top { background: color-mix(in srgb, var(--vert) 14%, var(--section)); }
.tableau td small { display: block; color: var(--discret); font-weight: 400; font-size: 11px; }
.defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.graphes { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; }
.graphe svg { width: 100%; height: auto; display: block; }
.graphe text { font: 11px var(--ui); fill: var(--discret); }
.graphe .val { fill: var(--texte); font-weight: 600; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--discret); margin-top: 6px; }
.legende span { display: inline-flex; align-items: center; gap: 5px; }
.legende i { width: 12px; height: 3px; background: var(--c); display: inline-block; border-radius: 2px; }
.onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.onglets button { border: 1px solid var(--bordure); background: var(--carte); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
.onglets button.on { background: var(--bleu); border-color: var(--bleu); color: var(--carte); font-weight: 600; }
.chiffres { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.chiffre { background: var(--section); border-radius: 10px; padding: 8px 10px; }
.chiffre span { display: block; font-size: 11.5px; color: var(--discret); }
.chiffre b { font: 600 18px var(--titre); color: var(--bleu); font-variant-numeric: lining-nums tabular-nums; }
.revente { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-variant-numeric: tabular-nums; margin-top: 12px; padding: 12px; border: 1px dashed var(--bordure); border-radius: 10px; }
.revente .t { grid-column: 1 / -1; font: 600 16px var(--titre); color: var(--bleu); }
.revente span { color: var(--discret); }
.revente b { text-align: right; }
.revente .total { border-top: 1px solid var(--bordure); padding-top: 6px; }
.alertes { display: grid; gap: 6px; }
.alerte { border-left: 3px solid var(--or); background: var(--or-doux); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: 13px; }
.alerte b { color: var(--bleu); }
.limites { font-size: 12px; color: var(--discret); }

/* ---------- réglages ---------- */
.voile { position: fixed; inset: 0; background: rgba(10,20,25,.45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; }
.fen { background: var(--fond); width: min(640px, 100%); max-height: 90vh; display: flex; flex-direction: column; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.fen header { display: flex; align-items: center; gap: 10px; background: #0c2d39; color: #fff; padding: 12px 16px; }
.fen header h3 { color: #fff; font-size: 19px; flex: 1; }
.fen header button { border: 0; background: none; color: #fff; font-size: 24px; cursor: pointer; line-height: 1; }
.fen .corps { padding: 14px 16px 18px; overflow-y: auto; display: grid; gap: 14px; }
.fen h4 { margin: 4px 0 -4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--discret); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #0c2d39; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; max-width: 90vw; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- téléphone : un onglet Saisie / Résultats ---------- */
@media (max-width: 980px) {
  main { grid-template-columns: minmax(0, 1fr); padding: 10px 12px calc(30px + env(safe-area-inset-bottom, 0px)); }
  .seg.bascule { display: flex; position: sticky; top: 58px; z-index: 15; box-shadow: 0 4px 10px rgba(0,0,0,.06); }
  body:not(.voir-resultats) .resultats, body.voir-resultats .saisie { display: none; }
  .graphes { grid-template-columns: 1fr; }
  .chiffres { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 700px) {
  .haut-in { padding: 8px 12px; gap: 10px; }
  .marque small, .meilleur, .bt-h span { display: none; }
  .actions { margin-left: auto; }
  .bt-h { padding: 8px 9px; }
  .grille { grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  /* téléphone : le nom sur une ligne, capital / résultats / TMI sur la suivante */
  .associe { grid-template-columns: 1fr 1fr 1fr 38px; padding-bottom: 8px; border-bottom: 1px dashed var(--bordure); }
  .associe > .champ:first-child { grid-column: 1 / 4; grid-row: 1; }
  .associe > button.x { grid-column: 4; grid-row: 1; }
  .menu-export { right: 10px; top: 54px; }
  .tableau th, .tableau td { padding: 7px 8px; }
  /* le comparatif défile de côté ; la colonne des libellés reste en place */
  .tableau td small { display: none; }
  .tableau th:first-child, .tableau td:first-child { position: sticky; left: 0; z-index: 1; background: var(--carte); min-width: 128px; box-shadow: 1px 0 0 var(--bordure); }
  .tableau tr.fort td:first-child { background: var(--section); }
}

/* ---------- impression (PDF) : seulement le rapport ---------- */
#impression { display: none; }
@media print {
  @page { size: A4; margin: 14mm 12mm; }
  body { background: #fff; color: #111; font-size: 11px; }
  header.haut, main, .bascule, #toast, .voile, .menu-export, .ls-voile { display: none !important; }
  #impression { display: block; }
  #impression h1 { font-size: 24px; color: #0c2d39; margin-bottom: 2px; }
  #impression h2 { font-size: 16px; color: #0c2d39; margin: 16px 0 6px; break-after: avoid; }
  #impression .sous { color: #555; margin: 0 0 12px; }
  #impression .tableau th, #impression .tableau td { padding: 4px 6px; border-color: #ccc; }
  #impression .tableau thead th { color: #333; }
  #impression .page { break-before: page; }
  #impression .hyp { columns: 2; column-gap: 24px; font-size: 10.5px; }
  #impression .hyp div { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; padding: 2px 0; break-inside: avoid; }
  #impression .graphe text { fill: #444; }
  #impression .alerte { background: #f6f0e3; }
}

<!-- lien-suivi : début (module commun, voir lien-suivi.source.js à la racine du dépôt) -->
<script>
window.LIEN_SUIVI = {
  cle: "immo-dossiers-v1",
  cles: ["immo-etat"],
  nomAuto: function (d) {                         // nom proposé : le prix du bien
    var x = d["immo-etat"]; return x && x.prix ? "bien de " + Math.round(x.prix).toLocaleString("fr-FR") + " €" : "";
  },
  vierge: null,                                   // nouvelle simulation : les valeurs par défaut de l'appli
  bouton: function () {
    var b = document.createElement("button"); b.className = "bt-h"; b.type = "button";
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="ls-nom">Simulations</span>';
    var a = document.querySelector("header.haut .actions"); if (!a) return null; a.prepend(b); return b;
  }
};
// =====================================================================================
//  Lien avec le Suivi des dossiers — module commun, recopié tel quel dans pvi/ et succession/
//  (chaque appli reste autonome : ce bloc est collé dans sa page, entre les repères
//   « lien-suivi : début » et « lien-suivi : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  Ce qu'il fait :
//   • plusieurs simulations enregistrées dans l'appli (au lieu d'une seule) ;
//   • chacune peut être rattachée à un client du Suivi ;
//   • le Suivi lit ces simulations (même site, même mémoire du navigateur), les enregistre
//     dans suivi_gp.json (donc GitHub et vos autres appareils), et les montre dans la fiche du client ;
//   • le Suivi peut ouvrir une simulation précise : adresse « …/pvi/?ouvrir=IDENTIFIANT ».
//  Comment : l'appli garde son travail en cours dans ses propres clés (ex. « pvi-etat ») ;
//  ce module recopie ces clés dans la simulation ouverte, toutes les secondes et demie.
//  Rangement : localStorage[cle] = { courant: id, liste: { id: { nom, maj, data, client, nomFixe } }, effaces: { id: date } }
//  (même forme que les dossiers de l'Audit, « audit-dossiers-v1 »)
// =====================================================================================
(function () {
  var C = window.LIEN_SUIVI;            // réglages propres à l'appli, posés juste avant ce bloc
  if (!C) return;
  var CLE = C.cle;
  var maintenant = function () { return new Date().toISOString(); };
  var uid = function () { return "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  function lire() {
    try { var s = JSON.parse(localStorage.getItem(CLE)); if (s && s.liste) { s.effaces = s.effaces || {}; return s; } } catch (e) {}
    return { courant: null, liste: {}, effaces: {} };
  }
  function ecrire(s) { try { localStorage.setItem(CLE, JSON.stringify(s)); } catch (e) {} }
  // le travail en cours de l'appli, tel qu'elle le range elle-même
  function natif() {
    var o = {};
    C.cles.forEach(function (k) { var v = null; try { v = JSON.parse(localStorage.getItem(k)); } catch (e) {} o[k] = v; });
    return o;
  }
  function poserNatif(data) {
    C.cles.forEach(function (k) {
      var v = data ? data[k] : null;
      try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
    });
  }
  function nomPar(rec) {
    if (rec.nomFixe) return rec.nom;
    var auto = rec.data ? C.nomAuto(rec.data) : "";
    if (auto && rec.client && auto.toLowerCase() === rec.client.toLowerCase()) auto = "";
    return rec.client ? rec.client + (auto ? " · " + auto : "") : (auto || (rec.nom !== "Nouvelle simulation" && rec.nom) || "Simulation");
  }

  // ---- 1. au démarrage, AVANT l'appli : on pose la simulation demandée (ou la dernière ouverte) ----
  var s = lire();
  var demande = null;
  try { demande = new URLSearchParams(location.search).get("ouvrir"); } catch (e) {}
  if (demande && s.liste[demande]) s.courant = demande;
  if (!s.courant || !s.liste[s.courant]) {
    // première fois : le travail en cours devient la première simulation
    var n = natif(), plein = C.cles.some(function (k) { return n[k] != null; });
    var id0 = uid();
    s.liste[id0] = { nom: "Simulation", maj: maintenant(), data: plein ? n : null };
    s.liste[id0].nom = nomPar(s.liste[id0]);
    s.courant = id0;
  }
  var courant = s.courant;
  var rec = s.liste[courant];
  if (rec.data == null && C.vierge) rec.data = C.vierge(rec);
  rec.nom = nomPar(rec);
  poserNatif(rec.data);
  ecrire(s);
  if (demande) try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
  var vu = JSON.stringify(natif());

  // ---- 2. en continu : ce que l'appli a changé part dans la simulation ouverte ----
  var parti = false;   // on change de simulation : la page va se recharger, plus rien à recopier
  function capter() {
    if (parti) return;

function tableauComparatif(ids, best) {

// graphique en barres : enrichissement net par montage
function grapheBarres(ids) {
  const L = 420, H = 30 * ids.length + 20, g = 150;

  const zero = neg ? g + (L - g - 70) * (Math.abs(Math.min(0, ...vals)) / (max + Math.abs(Math.min(0, ...vals)))) : g;
  const ech = (L - zero - 70) / max;
  return `<svg viewBox="0 0 ${L} ${H}" role="img" aria-label="Enrichissement net par montage">
    <line x1="${zero}" y1="4" x2="${zero}" y2="${H - 8}" stroke="var(--bordure)"/>
    ${ids.map((id, i) => { const v = vals[i], w = Math.abs(v) * ech, y = 10 + i * 30;
      return `<text x="0" y="${y + 14}">${esc(courtM(id))}</text><rect x="${v >= 0 ? zero : zero - w}" y="${y}" width="${Math.max(1, w)}" height="20" rx="4" fill="${COULEURS[id]}"/>
        <text class="val" x="${v >= 0 ? zero + w + 6 : zero + 6}" y="${y + 14}">${esc(eurS(v))}</text>`; }).join("")}</svg>`;
}
// graphique en courbes : trésorerie cumulée de chaque montage, année par année
function grapheCourbes(ids) {
  const L = 520, H = 240, gx = 62, gy = 14, bas = H - 26;

  const tout = series.flat(); const min = Math.min(0, ...tout), max = Math.max(0, ...tout);
  const X = (a) => gx + (L - gx - 10) * a / N, Y = (v) => gy + (bas - gy) * (max - v) / ((max - min) || 1);
  const pas = Math.pow(10, Math.floor(Math.log10(((max - min) || 1) / 4))), unite = [1, 2, 5, 10].map((k) => k * pas).find((u) => (max - min) / u <= 5) || pas * 10;
  const graduations = []; for (let v = Math.ceil(min / unite) * unite; v <= max; v += unite) graduations.push(v);
  const ansG = []; const pasA = N <= 10 ? 1 : N <= 20 ? 2 : 5; for (let a = 0; a <= N; a += pasA) ansG.push(a);
  return `<svg viewBox="0 0 ${L} ${H}" role="img" aria-label="Trésorerie cumulée">
    ${graduations.map((v) => `<line x1="${gx}" x2="${L - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bordure)" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${gx - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v / 1000).toLocaleString("fr-FR")} k€</text>`).join("")}
    ${ansG.map((a) => `<text x="${X(a)}" y="${H - 8}" text-anchor="middle">${a === 0 ? "achat" : "an " + a}</text>`).join("")}
    ${series.map((s, i) => `<polyline fill="none" stroke="${COULEURS[ids[i]]}" stroke-width="2.4" stroke-linejoin="round" points="${s.map((v, a) => X(a) + "," + Y(v)).join(" ")}"/>`).join("")}

  return A.filter((a, i) => A.findIndex((b) => b[0] === a[0] && b[1] === a[1]) === i);

    const pv = r.pv;
    const rev = id === "sciIS"
      ? [["Prix de revente", eur(r.prixRevente)], ["IS sur la plus-value", eur(pv.is)], ["Compte courant rendu", eur(pv.rendCCA)], ["Boni de liquidation", eur(pv.boni)], ["Flat tax et droit de partage", eur(pv.pfu + pv.droitPartage)], ["Net en poche", eur(r.netRevente)]]
      : [["Prix de revente", eur(r.prixRevente)], ["Plus-value brute", eur(Math.max(0, pv.brute))], ["Impôt et prélèvements", eur(pv.total)], ["Capital restant dû", eur(r.crdFin)], ["Net en poche", eur(r.netRevente)]];
    s.addText("Revente dans " + h.horizon + " ans", { x: 8.5, y: 2.55, w: 4.4, h: 0.4, fontFace: "Georgia", fontSize: 15, bold: true, color: BLEU });
    s.addTable(rev.map(([a, b], i) => [{ text: a, options: { color: GRIS, bold: i === rev.length - 1 } }, { text: b, options: { align: "right", bold: i === rev.length - 1, color: BLEU } }]),
      { x: 8.5, y: 3.0, w: 4.4, colW: [2.6, 1.8], fontFace: POL, fontSize: 11, border: { type: "solid", pt: 0.5, color: "E2DACB" }, rowH: 0.36 });
  }
  // 6. vigilance
  s = p.addSlide(); titre(s, "Points de vigilance");
  s.addText(vigilance(ids).map(([a, b]) => ({ text: a + " : " + b, options: { bullet: true, breakLine: true } })), { x: 0.6, y: 1.2, w: 12.1, h: 5.4, fontFace: POL, fontSize: 13, color: "1C2A30", valign: "top", paraSpaceAfter: 6 });
  s.addText(LIMITES, { x: 0.6, y: 6.7, w: 12.1, h: 0.6, fontFace: POL, fontSize: 9, color: GRIS, italic: true });
  await p.writeFile({ fileName: nomFichier("pptx") });
  toast("Présentation prête.");
}
$("bExport").addEventListener("click", (e) => {

  const m = document.createElement("div"); m.className = "menu-export";
  m.innerHTML = `<button type="button" data-x="pdf">🖨<span>PDF imprimable<small>Rapport complet, tous les montages</small></span></button>
    <button type="button" data-x="xlsx">📊<span>Excel<small>Synthèse et tableaux année par année</small></span></button>
    <button type="button" data-x="pptx">📽<span>PowerPoint<small>Diapositives pour le rendez-vous client</small></span></button>`;
  document.body.append(m);
  m.addEventListener("click", async (ev) => {
    const b = ev.target.closest("button"); if (!b) return; m.remove();
    try { if (b.dataset.x === "pdf") exporterPDF(); else if (b.dataset.x === "xlsx") await exporterExcel(); else await exporterPowerPoint(); }
    catch (er) { toast("Export impossible : " + er.message); }
  });
});
