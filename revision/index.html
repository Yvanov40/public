<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- habillage : début (apparence commune des applis ; module commun, voir habillage.source.js à la racine du dépôt) -->
<script>
window.HABILLAGE = {
  vars: { fond: ["--bg"], carte: ["--surface"], texte: ["--ink"], discret: ["--muted"], bordure: ["--line"], principaleTexte: ["--teal"], accentTexte: ["--gold"], sans: ["--sans"], serif: ["--serif"] },
  theme: { attr: "data-theme", sombre: "dark", clair: "light" },
  cartes: ".card,.panel,.session,.drop,.theme",
  // le bandeau du haut prend la couleur de la barre, sur toute la largeur
  css: "header.top{background:var(--hb-barre)!important;max-width:none!important;padding-left:max(18px,calc(50% - 322px))!important;padding-right:max(18px,calc(50% - 322px))!important;color:#fff}"
    + "header.top h1{color:#fff!important}header.top h1 small{color:rgba(255,255,255,.66)!important}header.top .iconbtn{color:#fff!important}header.top .mark rect:first-child{fill:rgba(255,255,255,.12)}body::before{background:var(--hb-barre)!important}",
  bouton: function () {
    var b = document.createElement("button"); b.type = "button"; b.className = "iconbtn"; b.setAttribute("aria-label", "Apparence");
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.7-1 1.2-1.9-.6-1.1.2-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5.5-4-9.8-9-9.8z"/><circle cx="7.5" cy="11" r="1.1"/><circle cx="10.5" cy="7" r="1.1"/><circle cx="15.2" cy="7.6" r="1.1"/></svg>';
    var r = document.getElementById("btnSettings"); if (!r) return null; r.before(b); return b;
  }
};
// =====================================================================================
//  Habillage commun — la même apparence et le même panneau « Apparence » dans toutes les applis
//  (module commun, recopié tel quel au début de audit/, pvi/, succession/, immo/ et revision/,
//   entre les repères « habillage : début » et « habillage : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  • Par défaut, chaque appli reprend l'apparence du Suivi des dossiers (couleurs, fond, polices,
//    thème clair ou sombre, taille d'affichage, coins, relief), lue dans la mémoire du navigateur.
//  • On peut aussi régler une apparence propre aux applis (commune à toutes) : panneau « Apparence ».
//  • Chaque appli garde ses propres noms de couleurs : window.HABILLAGE (posé juste avant ce bloc)
//    dit quelle variable CSS de l'appli reçoit quelle couleur commune, et comment s'écrit son thème.
//  Rangement : localStorage « applis-apparence » = { suivre, principale, accent, fond, texte, titres, theme, taille, coins, relief }
// =====================================================================================
(function () {
  "use strict";
  var C = window.HABILLAGE;
  if (!C) return;
  var CLE = "applis-apparence";
  var POLICES = {
    plex: ['"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "IBM+Plex+Sans:wght@400;500;600", "IBM Plex Sans"],
    inter: ['"Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "Inter:wght@400;500;600", "Inter"],
    nunito: ['"Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "Nunito:wght@400;600;700", "Nunito"],
    systeme: ['system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif', "", "Celle de l'appareil"],
    lora: ['"Lora", Georgia, "Times New Roman", serif', "Lora:wght@400;500;600", "Lora"],
    garamond: ['"EB Garamond", Garamond, Georgia, "Times New Roman", serif', "EB+Garamond:wght@500;600", "EB Garamond"],
    playfair: ['"Playfair Display", Georgia, "Times New Roman", serif', "Playfair+Display:wght@500;600", "Playfair Display"],
    georgia: ['Georgia, "Times New Roman", serif', "", "Georgia"]
  };
  var FONDS = {   // en clair : fond de page, cartes, bordures, sections
    creme: { fond: "#f7f4ee", carte: "#fffdf9", bordure: "#e2dacb", section: "#efe9de" },
    blanc: { fond: "#f4f5f7", carte: "#ffffff", bordure: "#e1e4e8", section: "#e8ebef" },
    gris:  { fond: "#ecebe8", carte: "#f8f7f5", bordure: "#d6d3cc", section: "#dedbd4" }
  };
  var SOMBRE = { fond: "#0f1b20", carte: "#16262d", bordure: "#27404a", section: "#1b2e36", texte: "#e8e3d9", discret: "#9aa7a9", champ: "#0f1b20" };
  var PALETTES = [
    ["Bleu nuit et or", "#0c2d39", "#a77d2f"], ["Sapin et cuivre", "#17392b", "#b0672c"], ["Bordeaux et or", "#4a1626", "#b08a3c"],
    ["Ardoise et corail", "#27323d", "#d9634c"], ["Bleu roi et acier", "#1d3f8a", "#6f7b8c"], ["Prune et rose", "#3b2143", "#c2577d"],
    ["Noir et orange", "#1b1b1f", "#e07b1a"], ["Canard et sable", "#0f4c5c", "#c49a52"]
  ];
  var DEFAUT = { principale: "#0c2d39", accent: "#a77d2f", fond: "creme", texte: "plex", titres: "garamond", theme: "auto", taille: 100, coins: "arrondis", relief: "normal" };
  var rvb = function (h) { var n = parseInt(String(h).replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  var melange = function (a, b, part) { var x = rvb(a), y = rvb(b); return "#" + x.map(function (v, i) { return Math.round(v * (1 - part) + y[i] * part).toString(16).padStart(2, "0"); }).join(""); };
  var lireJSON = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

  // ---------------------------------------------------------------- les réglages : ceux du Suivi, ou ceux des applis
  function duSuivi() {
    var a = lireJSON("suivi-gp-apparence") || {}, p = a.page || {}, th = "auto";
    try { th = localStorage.getItem("suivi-gp-theme") || "auto"; } catch (e) {}
    return { principale: a.principale || DEFAUT.principale, accent: a.accent || DEFAUT.accent, fond: a.fond || DEFAUT.fond, texte: a.texte || DEFAUT.texte, titres: a.titres || DEFAUT.titres,
      theme: th, taille: +p.taille || 100, coins: p.coins || "arrondis", relief: p.relief || "normal" };
  }
  function reglages() {
    var p = lireJSON(CLE) || {};
    if (p.suivre !== false) { var s = duSuivi(); s.suivre = true; return s; }
    var r = {}; for (var k in DEFAUT) r[k] = p[k] != null ? p[k] : DEFAUT[k];
    r.suivre = false; return r;
  }
  function garder(changes) {
    var p = lireJSON(CLE) || {};
    if (changes.suivre === false && p.suivre !== false) { var s = duSuivi(); for (var k in s) if (p[k] == null) p[k] = s[k]; }   // on part de l'apparence du Suivi
    for (var c in changes) p[c] = changes[c];
    try { localStorage.setItem(CLE, JSON.stringify(p)); } catch (e) {}
    appliquer();
  }
  var tel = window.matchMedia("(max-width: 900px)"), systemeSombre = window.matchMedia("(prefers-color-scheme: dark)");
  // comme dans le Suivi : « auto » = clair sur téléphone, le réglage du système sur ordinateur
  var sombre = function (r) { return r.theme === "sombre" || (r.theme === "auto" && !tel.matches && systemeSombre.matches); };

  // ---------------------------------------------------------------- appliquer
  function appliquer() {
    var r = reglages(), nuit = sombre(r) && !C.sansSombre, f = FONDS[r.fond] || FONDS.creme;   // sansSombre : appli prévue pour le clair seulement
    // les couleurs communes, en clair ou en sombre
    var c = nuit ? {
      principale: r.principale, principaleTexte: melange(r.principale, "#ffffff", 0.6), accent: melange(r.accent, "#ffffff", 0.25), accentTexte: melange(r.accent, "#ffffff", 0.3),
      barre: melange(r.principale, "#000000", 0.55), fond: SOMBRE.fond, carte: SOMBRE.carte, champ: SOMBRE.champ, bordure: SOMBRE.bordure, section: SOMBRE.section, texte: SOMBRE.texte, discret: SOMBRE.discret
    } : {
      principale: r.principale, principaleTexte: r.principale, accent: r.accent, accentTexte: r.accent,
      barre: r.principale, fond: f.fond, carte: f.carte, champ: "#ffffff", bordure: f.bordure, section: f.section, texte: "#1c2a30", discret: "#6f6b63"
    };
    c.sans = (POLICES[r.texte] || POLICES.plex)[0];
    c.serif = (POLICES[r.titres] || POLICES.garamond)[0];
    // le thème, tel que l'appli l'écrit (data-theme="dark", "sombre"…)
    if (C.theme) {
      var el = document.documentElement;
      if (nuit) el.setAttribute(C.theme.attr, C.theme.sombre);
      else if (C.theme.clair) el.setAttribute(C.theme.attr, C.theme.clair); else el.removeAttribute(C.theme.attr);
    }
    // polices (chargées à la demande)
    [r.texte, r.titres].forEach(function (k) {
      var p = POLICES[k]; if (!p || !p[1] || document.getElementById("hb-police-" + k)) return;
      var l = document.createElement("link"); l.id = "hb-police-" + k; l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=" + p[1] + "&display=swap";
      document.head.appendChild(l);
    });
    // les variables de l'appli reçoivent les couleurs communes (!important : elles l'emportent sur ses propres réglages)
    var css = ":root{--hb-barre:" + c.barre + ";--hb-principale:" + c.principale + ";--hb-accent:" + c.accent + ";--hb-accent-texte:" + c.accentTexte + ";--hb-sans:" + c.sans + ";--hb-serif:" + c.serif + ";color-scheme:" + (nuit ? "dark" : "light");
    for (var cle in C.vars) C.vars[cle].forEach(function (v) { if (c[cle] != null) css += ";" + v + ":" + c[cle] + " !important"; });
    css += "}";
    if (+r.taille && +r.taille !== 100) css += "html{zoom:" + (r.taille / 100) + "}";
    var cartes = C.cartes || ".carte,.card";
    if (r.coins === "droits") css += "html *:not(i):not(.point):not(input[type=radio]):not(.hb-rond){border-radius:3px!important}";
    if (r.coins === "ronds") css += ":is(" + cartes + ",button,input,select,textarea){border-radius:18px!important}";
    if (r.relief === "plat") css += "html *:not(.hb-garder-ombre){box-shadow:none!important}";
    if (r.relief === "ombres") css += ":is(" + cartes + "){box-shadow:" + (nuit ? "0 4px 14px rgba(0,0,0,.35)" : "0 1px 2px rgba(12,45,57,.08),0 4px 14px rgba(12,45,57,.10)") + "!important}";
    css += (typeof C.css === "function" ? C.css(c, nuit) : C.css || "");
    css += PANNEAU_CSS;
    var st = document.getElementById("habillage");
    if (!st) { st = document.createElement("style"); st.id = "habillage"; (document.head || document.documentElement).appendChild(st); }
    st.textContent = css;
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute("content", c.barre);
    etat = { reglages: r, couleurs: c, sombre: nuit, police: (POLICES[r.texte] || POLICES.plex)[2], policeTitres: (POLICES[r.titres] || POLICES.garamond)[2] };
    if (typeof C.apres === "function") try { C.apres(etat); } catch (e) {}
  }
  var etat = null;

  // ---------------------------------------------------------------- le panneau « Apparence » (le même partout)
  var PANNEAU_CSS = [
    ".hb-voile{position:fixed;inset:0;z-index:2147482000;background:rgba(10,20,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px 14px}",
    ".hb-fen{background:var(--hb-fond,#f7f4ee);color:var(--hb-texte,#1c2a30);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);font:14px/1.45 var(--hb-sans)}",
    ".hb-tete{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--hb-barre);color:#fff}.hb-tete b{flex:1;font:600 19px var(--hb-serif)}",
    ".hb-x{border:0;background:none;color:#fff;font-size:24px;line-height:1;cursor:pointer}",
    ".hb-onglets{display:flex;gap:4px;flex:1;min-width:0}.hb-onglets button{border:0;background:none;color:rgba(255,255,255,.66);font:600 18px var(--hb-serif);padding:3px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}.hb-onglets button.on{color:#fff;background:rgba(255,255,255,.15)}",
    ".hb-corps{padding:14px 16px 18px;overflow-y:auto;display:grid;gap:12px}",
    ".hb-titre{margin:4px 0 -4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--hb-discret,#7c7466);font-weight:600}",
    ".hb-choix{display:flex;flex-wrap:wrap;gap:6px}",
    ".hb-bt{font:inherit;font-size:13.5px;border:1px solid var(--hb-bordure,#e2dacb);background:var(--hb-carte,#fff);color:inherit;border-radius:999px;padding:7px 13px;cursor:pointer}",
    ".hb-bt.on{border-color:var(--hb-principale);background:var(--hb-principale);color:#fff;font-weight:600}",
    ".hb-pal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}",
    ".hb-pal button{border:1px solid var(--hb-bordure,#e2dacb);background:var(--hb-carte,#fff);color:inherit;border-radius:10px;padding:7px;cursor:pointer;font:inherit;font-size:11.5px;display:grid;gap:5px;text-align:left}",
    ".hb-pal button.on{outline:2px solid var(--hb-accent);outline-offset:-2px}",
    ".hb-pal i{display:flex;height:16px;border-radius:5px;overflow:hidden}.hb-pal i span{flex:2}.hb-pal i span+span{flex:1}",
    ".hb-coul{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hb-coul label{display:flex;align-items:center;gap:8px;font-size:13px}",
    ".hb-coul input{width:44px;height:32px;border:1px solid var(--hb-bordure,#e2dacb);border-radius:8px;padding:2px;background:none;cursor:pointer}",
    ".hb-suivre{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--hb-section,#efe9de);cursor:pointer}",
    ".hb-suivre input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--hb-principale);flex:none}",
    ".hb-suivre small{display:block;color:var(--hb-discret,#7c7466);font-size:12px}",
    ".hb-aide{margin:0;font-size:12px;color:var(--hb-discret,#7c7466)}",
    ".hb-lien{border:0;background:none;color:var(--hb-discret,#7c7466);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;justify-self:start;padding:0}",
    "@media (max-width:700px){.hb-voile{align-items:flex-end;padding:0}.hb-fen{border-radius:18px 18px 0 0;max-height:90vh}.hb-pal{grid-template-columns:repeat(2,minmax(0,1fr))}}"
  ].join("");
  function h(tag, attrs, enfants) {
    var e = document.createElement(tag);
    for (var k in (attrs || {})) { if (k.slice(0, 2) === "on") e[k] = attrs[k]; else if (attrs[k] != null && attrs[k] !== false) e.setAttribute(k, attrs[k]); }
    [].concat(enfants || []).forEach(function (x) { if (x != null && x !== false) e.append(x); });
    return e;
  }
  var voile = null;
  function panneau() {
    var c = etat.couleurs;
    voile = voile || h("div", { class: "hb-voile", onclick: function (e) { if (e.target === voile) voile.remove(); } });
    voile.style.setProperty("--hb-fond", c.fond); voile.style.setProperty("--hb-carte", c.carte); voile.style.setProperty("--hb-texte", c.texte);
    voile.style.setProperty("--hb-bordure", c.bordure); voile.style.setProperty("--hb-section", c.section); voile.style.setProperty("--hb-discret", c.discret);
    document.body.append(voile);
    dessiner();
  }
  function dessiner() {
    var r = reglages(), lib = !r.suivre;
    var choix = function (titre, cle, options) {
      return [h("p", { class: "hb-titre" }, titre), h("div", { class: "hb-choix" }, options.map(function (o) {
        return h("button", { type: "button", class: "hb-bt" + (String(r[cle]) === String(o[0]) ? " on" : ""), disabled: lib ? null : "disabled", onclick: function () { garder(ob(cle, o[0])); dessiner(); } }, o[1]);
      }))];
    };
    var ob = function (k, v) { var o = {}; o[k] = v; return o; };
    var polices = function (titre, cle, liste) { return choix(titre, cle, liste.map(function (k) { return [k, POLICES[k][2]]; })); };
    var corps = [
      h("label", { class: "hb-suivre" }, [h("input", { type: "checkbox", checked: r.suivre ? "checked" : null, onchange: function (e) { garder({ suivre: e.target.checked }); dessiner(); } }),
        h("span", null, ["Comme le Suivi des dossiers", h("small", null, r.suivre ? "Couleurs, fond, polices, thème, taille et coins viennent du Suivi (menu ⋯ › Apparence). Décochez pour régler ici une apparence propre aux applis." : "Apparence propre aux applis (Audit, Succession, Plus-value, Investissement, Révision) : elle vaut pour toutes.")])])
    ];
    if (lib) {
      corps.push(h("p", { class: "hb-titre" }, "Palettes"), h("div", { class: "hb-pal" }, PALETTES.map(function (p) {
        return h("button", { type: "button", class: r.principale.toLowerCase() === p[1] && r.accent.toLowerCase() === p[2] ? "on" : "", onclick: function () { garder({ principale: p[1], accent: p[2] }); dessiner(); } },
          [h("i", null, [h("span", { style: "background:" + p[1] }), h("span", { style: "background:" + p[2] })]), p[0]]);
      })));
      corps.push(h("div", { class: "hb-coul" }, [
        h("label", null, [h("input", { type: "color", value: r.principale, oninput: function (e) { garder({ principale: e.target.value }); } }), "Couleur principale"]),
        h("label", null, [h("input", { type: "color", value: r.accent, oninput: function (e) { garder({ accent: e.target.value }); } }), "Couleur d'accent"])]));
    }
    corps = corps.concat(
      choix("Thème", "theme", [["auto", "Automatique"], ["clair", "Clair"], ["sombre", "Sombre"]]),
      choix("Fond", "fond", [["creme", "Crème"], ["blanc", "Blanc"], ["gris", "Gris"]]),
      polices("Police du texte", "texte", ["plex", "inter", "nunito", "systeme"]),
      polices("Police des titres", "titres", ["garamond", "lora", "playfair", "georgia", "plex"]),
      choix("Taille de l'affichage", "taille", [[90, "Petite"], [100, "Normale"], [110, "Grande"], [125, "Très grande"]]),
      choix("Coins", "coins", [["arrondis", "Arrondis"], ["ronds", "Très arrondis"], ["droits", "Droits"]]),
      choix("Relief", "relief", [["plat", "Plat"], ["normal", "Normal"], ["ombres", "Ombres portées"]]));
    if (C.sansSombre) corps.push(h("p", { class: "hb-aide" }, "Cette appli reste en clair, même avec le thème sombre."));
    if (C.note) corps.push(h("p", { class: "hb-aide" }, C.note));
    if (lib) corps.push(h("button", { type: "button", class: "hb-lien", onclick: function () { try { localStorage.removeItem(CLE); } catch (e) {} garder({ suivre: true }); dessiner(); } }, "↺ Revenir à l'apparence du Suivi"));
    voile.replaceChildren(h("div", { class: "hb-fen", role: "dialog", "aria-modal": "true", "aria-label": "Apparence" }, [
      h("div", { class: "hb-tete" }, [
        // avec le module « disposition » : deux onglets, Apparence et Mise en page, dans la même fenêtre
        window.Disposition ? h("div", { class: "hb-onglets", role: "tablist" }, [
          h("button", { type: "button", class: "on", role: "tab", "aria-selected": "true" }, "Apparence"),
          h("button", { type: "button", role: "tab", onclick: function () { voile.remove(); try { sessionStorage.setItem("applis-onglet", "mise"); } catch (e) {} window.Disposition.ouvrir("mise"); } }, "Mise en page")]) : h("b", null, "Apparence"),
        h("button", { type: "button", class: "hb-x", "aria-label": "Fermer", onclick: function () { voile.remove(); } }, "×")]),
      h("div", { class: "hb-corps" }, corps)]));
  }

  // ---------------------------------------------------------------- démarrage
  appliquer();
  tel.addEventListener("change", appliquer);
  systemeSombre.addEventListener("change", appliquer);
  // changement fait dans une autre fenêtre (le Suivi, ou une autre appli)
  addEventListener("storage", function (e) { if (e.key === CLE || e.key === "suivi-gp-apparence" || e.key === "suivi-gp-theme") { appliquer(); if (voile && voile.parentNode) dessiner(); } });
  // si l'appli réécrit son thème elle-même, on remet le nôtre
  if (C.theme) new MutationObserver(function () {
    var att = document.documentElement.getAttribute(C.theme.attr), voulu = etat && etat.sombre ? C.theme.sombre : (C.theme.clair || null);
    if (att !== voulu) { if (voulu == null) document.documentElement.removeAttribute(C.theme.attr); else document.documentElement.setAttribute(C.theme.attr, voulu); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: [C.theme.attr] });
  function installer() {
    var b = C.bouton && C.bouton();
    if (b) { b.title = "Apparence"; b.onclick = function (e) { e.preventDefault(); e.stopPropagation(); panneau(); }; }
    appliquer();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", installer); else installer();
  addEventListener("keydown", function (e) { if (e.key === "Escape" && voile && voile.parentNode) voile.remove(); });
  window.Habillage = { etat: function () { return etat; }, ouvrir: function () { panneau(); }, appliquer: appliquer };
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Révision : des QCM, un par fiche envoyée à Claude (data/qcm/). Chaque QCM est une tuile, avec sa date. */
:root{
  color-scheme: light;
  --bg:#f7f4ee; --surface:#fffdf9; --ink:#0c2d39; --muted:#5d6b70; --line:#e2dacb; --section:#efe9de;
  --teal:#0c2d39; --gold:#a57d2f; --gold-soft:#f3e8d2;
  --ok:#2f6b45; --ok-soft:#dcebdf; --ko:#a23b2a; --ko-soft:#f5deda;
  --serif:"EB Garamond", Garamond, Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --rayon:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme: dark;
    --bg:#0f1b20; --surface:#16262d; --ink:#e8e3d9; --muted:#9aa7a9; --line:#27404a; --section:#1b2e36;
    --teal:#8fb8c4; --gold:#d4af6c; --gold-soft:rgba(212,175,108,.14);
    --ok:#86cfa0; --ok-soft:rgba(134,207,160,.14); --ko:#f29a88; --ko-soft:rgba(242,154,136,.14); }
}
:root[data-theme="dark"]{ color-scheme: dark;
  --bg:#0f1b20; --surface:#16262d; --ink:#e8e3d9; --muted:#9aa7a9; --line:#27404a; --section:#1b2e36;
  --teal:#8fb8c4; --gold:#d4af6c; --gold-soft:rgba(212,175,108,.14);
  --ok:#86cfa0; --ok-soft:rgba(134,207,160,.14); --ko:#f29a88; --ko-soft:rgba(242,154,136,.14); }
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:var(--largeur,980px);margin:0 auto;padding:16px 18px 56px}

/* barre haute */
header.top{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,calc(50% - var(--largeur,980px)/2 + 18px)) 10px}
header.top .mark{width:30px;height:30px;flex:none;border-radius:8px}
header.top h1{font:600 22px/1.15 var(--serif);margin:0;flex:1;min-width:0}
header.top h1 small{display:block;font:400 12.5px var(--sans);color:rgba(255,255,255,.7)}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:#fff;display:inline-flex;opacity:.85}
.iconbtn:hover{opacity:1;background:rgba(255,255,255,.1)}
.iconbtn svg{width:20px;height:20px}
#retour{display:none} body.dans-qcm #retour{display:inline-flex}

/* barre d'outils de l'accueil */
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.recherche{flex:1 1 220px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.recherche:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.puces{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.puces button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted)}
.puces button.on{background:var(--teal);color:#fff}
.bilan{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.bilan div{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rayon);padding:10px 14px}
.bilan b{display:block;font:600 24px var(--serif);color:var(--teal)}
.bilan span{font-size:12.5px;color:var(--muted)}

/* les tuiles */
.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(var(--tuile,260px),1fr))}
body.liste .grille{grid-template-columns:1fr;gap:8px}
.card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--rayon);padding:14px 16px 12px;
  display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .12s, box-shadow .12s, border-color .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(12,45,57,.10);border-color:var(--gold)}
body.liste .card{min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 14px}
.card .date{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--gold)}
.card h2{margin:0;font:600 19px/1.2 var(--serif);color:var(--teal)}
.card .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .pied{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
body.liste .card .pied{grid-row:1 / span 3;grid-column:2;margin:0;justify-content:flex-end}
.pastille{border-radius:999px;padding:2px 9px;font-weight:600;font-size:12px;background:var(--section);color:var(--muted)}
.pastille.nouveau{background:var(--gold-soft);color:var(--gold)}
.pastille.bon{background:var(--ok-soft);color:var(--ok)} .pastille.moyen{background:var(--gold-soft);color:var(--gold)} .pastille.faible{background:var(--ko-soft);color:var(--ko)}
.jauge{height:4px;border-radius:4px;background:var(--section);overflow:hidden;margin-top:4px}
.jauge i{display:block;height:100%;background:var(--gold)}
.vide{background:var(--surface);border:1px dashed var(--line);border-radius:var(--rayon);padding:28px 20px;text-align:center;color:var(--muted)}
.vide h2{font:600 22px var(--serif);color:var(--teal);margin:0 0 6px}

/* le QCM */
.qcm{max-width:720px;margin:0 auto}
.avance{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:4px 0 12px}
.avance .barre{flex:1;height:6px;border-radius:6px;background:var(--section);overflow:hidden}
.avance .barre i{display:block;height:100%;background:var(--gold);transition:width .25s}
.question{background:var(--surface);border:1px solid var(--line);border-radius:var(--rayon);padding:18px 18px 16px}
.question .theme{font-size:12px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.question h2{font:600 21px/1.3 var(--serif);color:var(--teal);margin:4px 0 14px}
.choix{display:grid;gap:8px}
.choix button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);
  transition:border-color .12s, background .12s}
.choix button:hover:not(:disabled){border-color:var(--gold)}
.choix button .l{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--section);color:var(--muted)}
.choix button.juste{border-color:var(--ok);background:var(--ok-soft)} .choix button.juste .l{background:var(--ok);color:#fff}
.choix button.faux{border-color:var(--ko);background:var(--ko-soft)} .choix button.faux .l{background:var(--ko);color:#fff}
.choix button:disabled{cursor:default}
.explication{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--section);font-size:14.5px}
.explication b{color:var(--teal)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn.or{background:var(--gold)}
.btn.discret{background:transparent;color:var(--teal);box-shadow:inset 0 0 0 1px var(--line)}
.fin{background:var(--surface);border:1px solid var(--line);border-radius:var(--rayon);padding:22px;text-align:center}
.fin .score{font:600 52px/1 var(--serif);color:var(--teal)}
.fin p{color:var(--muted);margin:6px 0 0}
.revue{margin-top:16px;display:grid;gap:8px}
.revue div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ko);border-radius:12px;padding:10px 14px;font-size:14px}
.revue div b{display:block;color:var(--teal);margin-bottom:2px}
.revue div .ok{color:var(--ok);font-weight:600}
.aide{font-size:13px;color:var(--muted)}
@media (max-width:560px){ .card{min-height:0} header.top h1{font-size:20px} .question h2{font-size:19px} }
</style>
<script>/* dialogue : début */
// =====================================================================================
//  Dialogues communs — à la place des fenêtres du système (confirm, alert, prompt), peu jolies,
//  surtout dans l'application pour ordinateur. (Module commun, recopié tel quel dans chaque appli,
//  dans le <head>, entre les repères « dialogue : début » et « dialogue : fin ». Modifier ici, puis recopier.)
// -------------------------------------------------------------------------------------
//  Trois fonctions, qui rendent une promesse (on écrit « await demander(…) ») :
//    demander(message, options) → true / false        (confirm)
//        options : { ok: "Supprimer", annuler: "Annuler", titre, danger: true }
//        Sans « ok » : « Supprimer », « Effacer »… est déduit du message ; sinon « OK ».
//    avertir(message, options)  → (rien)              (alert)
//    saisir(message, valeur, options) → texte ou null (prompt)
//  Entrée valide, Échap annule, un clic à côté annule. Les couleurs suivent celles de l'appli
//  (variables --bleu, --or, --carte, --texte si elles existent ; sinon or et bleu par défaut).
// =====================================================================================
(function () {
  "use strict";
  if (window.demander) return;
  var css = ""
    + ".dlg-voile{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:16px;background:rgba(8,24,31,.42);"
    + "backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity .14s ease}"
    + ".dlg-voile.on{opacity:1}"
    + ".dlg{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--carte,#fffdf8);color:var(--texte,#1d2a30);"
    + "border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.05);padding:20px 22px 16px;"
    + "font:inherit;font-size:14.5px;line-height:1.5;transform:translateY(8px) scale(.98);transition:transform .14s ease}"
    + ".dlg-voile.on .dlg{transform:none}"
    + ".dlg h3{margin:0 0 6px;font-size:17px;font-weight:650;color:var(--bleu,#0c2d39)}"
    + ".dlg p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}"
    + ".dlg input{width:100%;box-sizing:border-box;margin:8px 0 2px;padding:9px 12px;border:1px solid var(--bordure,#d9d2c3);border-radius:10px;"
    + "background:var(--fond,#fff);color:inherit;font:inherit;outline:none}"
    + ".dlg input:focus{border-color:var(--or,#a57d2f);box-shadow:0 0 0 3px rgba(165,125,47,.18)}"
    + ".dlg-boutons{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px}"
    + ".dlg-boutons button{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}"
    + ".dlg-non{background:transparent;color:var(--bleu,#0c2d39);box-shadow:inset 0 0 0 1px var(--bordure,#d9d2c3)}"
    + ".dlg-non:hover{background:rgba(12,45,57,.06)}"
    + ".dlg-oui{background:var(--bleu,#0c2d39);color:#fff}"
    + ".dlg-oui:hover{filter:brightness(1.15)}"
    + ".dlg-oui.danger{background:#a8452f}"
    + ".dlg-boutons button:focus-visible{outline:2px solid var(--or,#a57d2f);outline-offset:2px}"
    + "@media (max-width:480px){.dlg-boutons button{flex:1 1 auto}}";
  function style() {
    if (document.getElementById("dlg-style")) return;
    var s = document.createElement("style"); s.id = "dlg-style"; s.textContent = css;
    (document.head || document.documentElement).appendChild(s);
  }
  var VERBES = /^\s*(Supprimer|Effacer|Retirer|Vider|Remplacer|Écraser|Déconnecter|Réinitialiser)\b/i;
  function ouvrir(message, o, champ) {
    style();
    return new Promise(function (fin) {
      var avant = document.activeElement;
      var voile = document.createElement("div"); voile.className = "dlg-voile";
      var boite = document.createElement("div"); boite.className = "dlg"; boite.setAttribute("role", "dialog"); boite.setAttribute("aria-modal", "true");
      if (o.titre) { var h = document.createElement("h3"); h.textContent = o.titre; boite.appendChild(h); }
      var p = document.createElement("p"); p.textContent = String(message == null ? "" : message); boite.appendChild(p);
      var saisie = null;
      if (champ) { saisie = document.createElement("input"); saisie.type = "text"; saisie.value = champ.valeur == null ? "" : String(champ.valeur); saisie.setAttribute("autocomplete", "off"); boite.appendChild(saisie); }
      var zone = document.createElement("div"); zone.className = "dlg-boutons";
      var non = null;
      if (o.annuler !== false) { non = document.createElement("button"); non.type = "button"; non.className = "dlg-non"; non.textContent = o.annuler || "Annuler"; zone.appendChild(non); }
      var oui = document.createElement("button"); oui.type = "button"; oui.className = "dlg-oui" + (o.danger ? " danger" : ""); oui.textContent = o.ok || "OK"; zone.appendChild(oui);
      boite.appendChild(zone); voile.appendChild(boite); document.body.appendChild(voile);
      requestAnimationFrame(function () { voile.classList.add("on"); });
      var fini = false;
      function fermer(r) {
        if (fini) return; fini = true;
        if (saisie) champ.lu = saisie.value;
        document.removeEventListener("keydown", touche, true);
        voile.classList.remove("on");
        setTimeout(function () { voile.remove(); try { if (avant && avant.focus) avant.focus(); } catch (e) {} }, 140);
        fin(r);
      }
      function touche(e) {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); fermer(o.annuler === false ? true : false); }
        else if (e.key === "Enter" && !e.shiftKey && (document.activeElement === saisie || !zone.contains(document.activeElement) || document.activeElement === oui)) { e.preventDefault(); e.stopPropagation(); fermer(true); }
        else if (e.key === "Tab") {   // le focus reste dans la fenêtre
          var l = [saisie, non, oui].filter(Boolean), i = l.indexOf(document.activeElement);
          e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus();
        }
      }
      document.addEventListener("keydown", touche, true);
      oui.addEventListener("click", function () { fermer(true); });
      if (non) non.addEventListener("click", function () { fermer(false); });
      voile.addEventListener("mousedown", function (e) { if (e.target === voile) fermer(o.annuler === false ? true : false); });
      setTimeout(function () { if (saisie) { saisie.focus(); saisie.select(); } else oui.focus(); }, 20);
    });
  }
  window.demander = function (message, o) {
    o = o || {};
    if (!o.ok) { var m = VERBES.exec(String(message || "")); if (m) { o.ok = m[1].charAt(0).toUpperCase() + m[1].slice(1).toLowerCase(); if (o.danger == null) o.danger = /^(supprimer|effacer|vider|écraser)$/i.test(m[1]); } }
    return ouvrir(message, o);
  };
  window.avertir = function (message, o) { o = o || {}; o.annuler = false; return ouvrir(message, o).then(function () {}); };
  window.saisir = function (message, valeur, o) {
    o = o || {};
    var champ = { valeur: valeur };
    return ouvrir(message, o, champ).then(function (ok) {
      return ok ? champ.lu : null;
    });
  };
})();
/* dialogue : fin */</script>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="retour" aria-label="Retour aux QCM" title="Retour aux QCM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img class="mark" src="icons/icon-192.png" alt="">
  <h1 id="titre">Révision<small>QCM de la base documentaire</small></h1>
  <button class="iconbtn" id="btnSettings" aria-label="Affichage" title="Affichage des tuiles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>

<main class="wrap" id="vue"></main>
<script>
"use strict";
// ---- Révision : des QCM préparés par Claude, un par fiche (data/qcm/index.json + data/qcm/<id>.json) ----
//   Résultats gardés sur l'appareil : localStorage « revision-qcm ». Réglages d'affichage : « revision-affichage ».
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs, ...enfants) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of enfants.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
};
const lire = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const sans = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const dateFr = (iso) => { const d = new Date(iso + (iso.length === 10 ? "T12:00" : "")); return isNaN(d) ? "" : d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); };
const melanger = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

let liste = [];                                      // les QCM (index.json)
let resultats = lire("revision-qcm", {});            // { id: { essais: [{ le, bons, total }], erreurs: [numéros] } }
let affichage = Object.assign({ mise: "tuiles", tri: "date", taille: "normale", melanger: true }, lire("revision-affichage", {}));
const vue = $("#vue");

function appliquerAffichage() {
  document.body.classList.toggle("liste", affichage.mise === "liste");
  document.documentElement.style.setProperty("--tuile", { petite: "210px", normale: "260px", grande: "330px" }[affichage.taille] || "260px");
}
async function charger() {
  try {
    const r = await fetch("data/qcm/index.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) { liste = (await r.json()).qcm || []; ecrire("revision-qcm-liste", liste); }
    else liste = lire("revision-qcm-liste", []);
  } catch (e) { liste = lire("revision-qcm-liste", []); }
}
async function chargerQcm(id) {
  const r = await fetch("data/qcm/" + encodeURIComponent(id) + ".json", { cache: "no-cache" });
  if (!r.ok) throw new Error("QCM introuvable");
  return r.json();
}
const dernier = (id) => { const e = (resultats[id] || {}).essais || []; return e[e.length - 1]; };
const meilleur = (id) => Math.max(-1, ...((resultats[id] || {}).essais || []).map((x) => Math.round(x.bons / x.total * 100)));
const classeScore = (p) => (p >= 80 ? "bon" : p >= 50 ? "moyen" : "faible");

// ---------------- accueil : les tuiles ----------------
let filtre = "";
function accueil() {
  document.body.classList.remove("dans-qcm");
  $("#titre").innerHTML = "Révision<small>QCM de la base documentaire</small>";
  document.title = "Révision — QCM";
  if (!liste.length) {
    vue.replaceChildren(h("div", { class: "vide" }, h("h2", null, "Pas encore de QCM"),
      h("p", null, "Envoyez une fiche à Claude en lui demandant un QCM : une tuile apparaît ici, avec la date du QCM, et y reste.")));
    return;
  }
  const faits = liste.filter((q) => dernier(q.id));
  const moy = faits.length ? Math.round(faits.reduce((s, q) => { const d = dernier(q.id); return s + d.bons / d.total * 100; }, 0) / faits.length) : null;
  const recherche = h("input", { class: "recherche", type: "search", placeholder: "Chercher une fiche, un thème…", value: filtre, "aria-label": "Chercher" });
  recherche.addEventListener("input", () => { filtre = recherche.value; dessinerTuiles(); });
  const puces = (cle, options) => h("div", { class: "puces", role: "group" }, options.map(([v, lib]) => h("button", { type: "button", class: affichage[cle] === v ? "on" : "", onclick: () => { affichage[cle] = v; ecrire("revision-affichage", affichage); appliquerAffichage(); accueil(); } }, lib)));
  const grille = h("div", { class: "grille" });
  function dessinerTuiles() {
    const f = sans(filtre);
    let l = liste.filter((q) => !f || sans([q.titre, q.fichier, q.theme].join(" ")).includes(f));
    const tri = { date: (a, b) => String(b.date).localeCompare(String(a.date)) || a.titre.localeCompare(b.titre, "fr"),
      titre: (a, b) => a.titre.localeCompare(b.titre, "fr"),
      score: (a, b) => meilleur(a.id) - meilleur(b.id) || String(b.date).localeCompare(String(a.date)) }[affichage.tri];
    l = l.slice().sort(tri);
    grille.replaceChildren(...(l.length ? l.map(tuile) : [h("p", { class: "aide" }, "Aucun QCM ne correspond.")]));
  }
  vue.replaceChildren(
    h("div", { class: "bilan" },
      h("div", null, h("b", null, liste.length), h("span", null, liste.length > 1 ? "QCM" : "QCM")),
      h("div", null, h("b", null, faits.length), h("span", null, "déjà faits")),
      h("div", null, h("b", null, moy == null ? "—" : moy + " %"), h("span", null, "moyenne du dernier essai"))),
    h("div", { class: "outils" }, recherche, puces("tri", [["date", "Récents"], ["titre", "A → Z"], ["score", "À retravailler"]])),
    grille);
  dessinerTuiles();
}
function tuile(q) {
  const d = dernier(q.id), m = meilleur(q.id);
  const p = d ? Math.round(d.bons / d.total * 100) : null;
  return h("button", { type: "button", class: "card", onclick: () => ouvrir(q.id) },
    h("span", { class: "date" }, "QCM du " + dateFr(q.date)),
    h("h2", null, q.titre),
    q.fichier ? h("span", { class: "src", title: q.fichier }, "📄 " + q.fichier) : null,
    h("div", { class: "pied" },
      h("span", null, q.nb + " questions"),
      d ? h("span", { class: "pastille " + classeScore(p) }, "Dernier : " + p + " %") : h("span", { class: "pastille nouveau" }, "Nouveau"),
      d && m !== p ? h("span", { class: "pastille" }, "Meilleur : " + m + " %") : null),
    d ? h("div", { class: "jauge" }, h("i", { style: "width:" + p + "%" })) : null);
}

// ---------------- le QCM ----------------
async function ouvrir(id, seulementErreurs) {
  let qcm;
  try { qcm = await chargerQcm(id); } catch (e) { await avertir("Ce QCM n’a pas pu être chargé. Vérifiez la connexion puis réessayez."); return; }
  let numeros = qcm.questions.map((_, i) => i);
  if (seulementErreurs) numeros = ((resultats[id] || {}).erreurs || []).filter((i) => i < qcm.questions.length);
  if (affichage.melanger) numeros = melanger(numeros);
  const etat = { k: 0, bons: 0, erreurs: [] };
  location.hash = "#qcm-" + id;
  document.body.classList.add("dans-qcm");
  $("#titre").innerHTML = "";
  $("#titre").append(qcm.titre, h("small", null, "QCM du " + dateFr(qcm.date) + (seulementErreurs ? " · les erreurs" : "")));
  document.title = qcm.titre + " — QCM";
  const suivante = () => {
    if (etat.k >= numeros.length) return fin();
    const n = numeros[etat.k], q = qcm.questions[n];
    const ordre = affichage.melanger ? melanger(q.choix.map((_, i) => i)) : q.choix.map((_, i) => i);
    const zoneChoix = h("div", { class: "choix" });
    const bas = h("div");
    ordre.forEach((i, rang) => zoneChoix.append(h("button", { type: "button", "data-i": i, onclick: (ev) => repondre(i, ev.currentTarget) },
      h("span", { class: "l" }, "ABCDEF"[rang]), h("span", null, q.choix[i]))));
    function repondre(i, bouton) {
      zoneChoix.querySelectorAll("button").forEach((b) => { b.disabled = true; if (+b.dataset.i === q.reponse) b.classList.add("juste"); });
      const bon = i === q.reponse;
      if (bon) etat.bons++; else { bouton.classList.add("faux"); etat.erreurs.push(n); }
      bas.replaceChildren(
        h("div", { class: "explication" }, h("b", null, bon ? "Bonne réponse. " : "Réponse : " + q.choix[q.reponse] + ". "), q.explication || ""),
        h("div", { class: "actions" }, h("button", { type: "button", class: "btn", onclick: () => { etat.k++; suivante(); } }, etat.k + 1 < numeros.length ? "Question suivante →" : "Voir le résultat")));
      bas.querySelector(".btn").focus();
    }
    vue.replaceChildren(h("div", { class: "qcm" },
      h("div", { class: "avance" }, h("span", null, `Question ${etat.k + 1} / ${numeros.length}`), h("div", { class: "barre" }, h("i", { style: `width:${etat.k / numeros.length * 100}%` })), h("span", null, `${etat.bons} bonne${etat.bons > 1 ? "s" : ""}`)),
      h("div", { class: "question" }, q.theme ? h("div", { class: "theme" }, q.theme) : null, h("h2", null, q.question), zoneChoix, bas)));
    scrollTo(0, 0);
  };
  const fin = () => {
    const total = numeros.length;
    const r = resultats[id] || { essais: [], erreurs: [] };
    r.essais = [...(r.essais || []), { le: new Date().toISOString(), bons: etat.bons, total, erreurs: seulementErreurs || undefined }].slice(-30);
    // les erreurs à retravailler : un essai complet les remplace ; un essai « erreurs » retire celles qui sont réussies
    r.erreurs = seulementErreurs ? (r.erreurs || []).filter((x) => etat.erreurs.includes(x)) : etat.erreurs.slice().sort((a, b) => a - b);
    resultats[id] = r; ecrire("revision-qcm", resultats);
    const p = Math.round(etat.bons / total * 100);
    vue.replaceChildren(h("div", { class: "qcm" },
      h("div", { class: "fin" }, h("div", { class: "score" }, p + " %"), h("p", null, `${etat.bons} bonne${etat.bons > 1 ? "s" : ""} réponse${etat.bons > 1 ? "s" : ""} sur ${total}`),
        h("div", { class: "actions", style: "justify-content:center" },
          etat.erreurs.length ? h("button", { type: "button", class: "btn or", onclick: () => ouvrir(id, true) }, `Refaire les ${etat.erreurs.length} erreur${etat.erreurs.length > 1 ? "s" : ""}`) : null,
          h("button", { type: "button", class: "btn discret", onclick: () => ouvrir(id) }, "Refaire tout le QCM"),
          h("button", { type: "button", class: "btn", onclick: () => { location.hash = ""; } }, "Retour aux QCM"))),
      etat.erreurs.length ? h("div", { class: "revue" }, h("p", { class: "aide" }, "À revoir :"), etat.erreurs.map((n) => { const q = qcm.questions[n]; return h("div", null, h("b", null, q.question), h("span", { class: "ok" }, "→ " + q.choix[q.reponse]), q.explication ? h("div", { class: "aide" }, q.explication) : null); })) : null));
    scrollTo(0, 0);
  };
  if (!numeros.length) { await avertir("Plus aucune erreur à refaire sur ce QCM."); location.hash = ""; return; }
  suivante();
}

// ---------------- affichage (bouton en haut à droite) ----------------
$("#btnSettings").addEventListener("click", () => {
  const voile = h("div", { class: "dlg-voile on", onmousedown: (e) => { if (e.target === voile) voile.remove(); } });
  const ligne = (lib, cle, options) => h("div", { style: "margin:10px 0" }, h("div", { class: "aide", style: "margin-bottom:4px" }, lib),
    h("div", { class: "puces" }, options.map(([v, l]) => h("button", { type: "button", class: affichage[cle] === v ? "on" : "", onclick: () => { affichage[cle] = v; ecrire("revision-affichage", affichage); appliquerAffichage(); voile.remove(); if (!document.body.classList.contains("dans-qcm")) accueil(); } }, l))));
  voile.append(h("div", { class: "dlg" }, h("h3", null, "Affichage"),
    ligne("Présentation", "mise", [["tuiles", "Tuiles"], ["liste", "Liste"]]),
    ligne("Taille des tuiles", "taille", [["petite", "Petites"], ["normale", "Normales"], ["grande", "Grandes"]]),
    ligne("Ordre des questions et des réponses", "melanger", [[true, "Mélangé"], [false, "Tel quel"]]),
    h("p", { class: "aide" }, "Couleurs, polices et taille du texte : bouton Apparence, à gauche de celui-ci."),
    h("div", { class: "dlg-boutons" }, h("button", { type: "button", class: "dlg-oui", onclick: () => voile.remove() }, "Fermer"))));
  document.body.append(voile);
});
$("#retour").addEventListener("click", () => { location.hash = ""; });
addEventListener("hashchange", () => { if (!location.hash.startsWith("#qcm-")) accueil(); });

(async () => {
  appliquerAffichage();
  await charger();
  const m = /^#qcm-(.+)$/.exec(location.hash);
  if (m && liste.some((q) => q.id === decodeURIComponent(m[1]))) ouvrir(decodeURIComponent(m[1])); else accueil();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
