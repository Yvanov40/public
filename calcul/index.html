  doc.setFillColor(...rgb(mixHex(acc,'#ffffff',.82))); doc.rect(0,36,W,1.4,'F');
  doc.setTextColor(...txt); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text('Calcul en lignes',W-16,11,{align:'right'});
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  const t=doc.splitTextToSize(pdfTxt(titre),W-32-40); doc.text(t[0],16,21);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text(pdfTxt(sous),16,29);
  return 48;
}
function pdfPied(doc,W,H,M,nom){
  const n=doc.getNumberOfPages();
  for(let k=1;k<=n;k++){ doc.setPage(k); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(111,121,115);
    doc.setDrawColor(213,219,212); doc.setLineWidth(.2); doc.line(M,H-13,W-M,H-13);
    doc.text(pdfTxt(nom),M,H-8.5); doc.text(k+' / '+n,W-M,H-8.5,{align:'right'}); }
}
function nomPDF(s,suffixe){ const d=new Date(); return s.name.replace(/[\\/:*?"<>|]+/g,'-').trim()+(suffixe?' - '+suffixe:'')+' - '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.pdf'; }
async function buildTableauPDF(){
  const jsPDF=await getJsPDF();
  const s=cur(), r=computeSheet(s.lines), S=seriesDe(s,r);
  const doc=new jsPDF({unit:'mm',format:'a4'}), W=210, H=297, M=16;
  const P=state.prefs, acc=hexOk(P.accent)?P.accent:'#2557E8';
  const INK=[27,34,30], MUT=[111,121,115], ERR=[180,83,42], TEINTE=rgb(mixHex(acc,'#ffffff',.07)), CARTE=rgb(mixHex(acc,'#ffffff',.1));
  const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  doc.setProperties({title:s.name+' - prévisionnel',creator:'Calcul en lignes'});
  let y=pdfBandeau(doc,W,acc,s.name,'Prévisionnel '+S.annees[0]+' – '+S.annees[S.annees.length-1]+'  ·  '+date);
  // hypothèses en cartes
  if(S.hypo.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...rgb(acc)); doc.text('Hypothèses',M,y); y+=4;
    const par=3, g=4, cw=(W-2*M-g*(par-1))/par, ch=17;
    S.hypo.forEach((h,k)=>{ const cx=M+(k%par)*(cw+g), cy=y+Math.floor(k/par)*(ch+g);
      doc.setFillColor(...CARTE); doc.roundedRect(cx,cy,cw,ch,2.5,2.5,'F');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(doc.splitTextToSize(pdfTxt(h.label),cw-8)[0],cx+4,cy+6.2);
      doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...INK); doc.text(pdfTxt(h.valeur),cx+4,cy+13.2); });
    y+=Math.ceil(S.hypo.length/par)*(ch+g)+6;
  }
  // tableau : une ligne par année, une colonne par série (+ « Total de l'année » si demandé)
  const somCols=S.cols.filter(c=>!c.pct && (!exportOpts.inclus || exportOpts.inclus[c.nom]!==false));
  if(exportOpts.totalAn && somCols.length>=1 && S.cols.filter(c=>!c.pct).length>=2){
    const vals={}; S.annees.forEach(yr=>{ const it=somCols.filter(c=>c.vals[yr]); if(it.length) vals[yr]={x:{value:it.reduce((a,c)=>a+c.vals[yr].x.value,0),isPct:false,cur:'€'}}; });
    S.cols=[...S.cols,{nom:'Total de l’année',vals,argent:somCols.some(c=>c.argent),pct:false,total:true}];
  }
  const n=S.cols.length, yw=30, cwid=(W-2*M-yw)/n, fs=n>6?7.5:n>4?8.5:9.5;
  const colTot=S.cols.findIndex(c=>c.total);
  const cell=(c,yr)=>{ const it=c.vals[yr]; if(!it) return {t:'–',v:null}; const x=it.x;
    return {t:x.isPct?fmt(x.display)+' %':fmt(x.value,!!x.cur), v:x.isPct?null:x.value}; };
  const entete=()=>{
    doc.setFont('helvetica','bold'); doc.setFontSize(fs);
    const lignes=S.cols.map(c=>doc.splitTextToSize(pdfTxt(c.nom+(c.argent?' (€)':'')),cwid-4));
    const hh=Math.max(...lignes.map(l=>l.length))*3.8+5;
    doc.setFillColor(...rgb(acc)); doc.roundedRect(M,y,W-2*M,hh,2,2,'F');
    const blanc=lum(acc)<.45?[255,255,255]:INK; doc.setTextColor(...blanc);
    doc.text('Année',M+3,y+5.4);
    lignes.forEach((l,k)=>doc.text(l,M+yw+(k+1)*cwid-3,y+5.4,{align:'right'}));
    y+=hh+1.5;
  };
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...rgb(acc)); doc.text('Par année',M,y); y+=4;
  entete();
  // lignes resserrées si besoin pour que le tableau et son total tiennent sur la page
  const rh=Math.max(5.4,Math.min(fs>9?7.4:6.6,(H-24-y-16)/S.annees.length));
  S.annees.forEach((yr,k)=>{
    if(y+rh>H-22){ doc.addPage(); y=18; entete(); }
    if(k%2===0){ doc.setFillColor(...TEINTE); doc.rect(M,y-1,W-2*M,rh,'F'); }
    if(colTot>=0){ doc.setFillColor(...rgb(mixHex(acc,'#ffffff',k%2===0?.17:.11))); doc.rect(M+yw+colTot*cwid+1,y-1,cwid-1,rh,'F'); }
    doc.setFont('helvetica','bold'); doc.setFontSize(fs); doc.setTextColor(...INK); doc.text(String(yr),M+3,y+rh/2+1.3);
    if(S.notes[yr]){ doc.setFont('helvetica','normal'); doc.setFontSize(fs-1.5); doc.setTextColor(...MUT); doc.text(pdfTxt(S.notes[yr]),M+3+doc.getTextWidth(String(yr))+8.5,y+rh/2+1.3); doc.setFontSize(fs); }
    S.cols.forEach((c,j)=>{ const v=cell(c,yr); doc.setFont('helvetica',c.total?'bold':'normal'); doc.setTextColor(...(v.v!==null&&v.v<0?ERR:INK)); doc.text(pdfTxt(v.t),M+yw+(j+1)*cwid-3,y+rh/2+1.3,{align:'right'}); });
    y+=rh;
  });
  // totaux
  if(y+12>H-22){ doc.addPage(); y=18; }
  y+=1.5; doc.setDrawColor(...rgb(acc)); doc.setLineWidth(.6); doc.line(M,y,W-M,y); y+=1.2;
  doc.setFont('helvetica','bold'); doc.setFontSize(fs+.5); doc.setTextColor(...INK); doc.text('Total',M+3,y+5);
  S.cols.forEach((c,j)=>{ if(c.pct) return; const t=S.annees.reduce((a,yr)=>a+(c.vals[yr]&&!c.vals[yr].x.isPct?c.vals[yr].x.value:0),0);
    doc.setTextColor(...(t<0?ERR:INK)); doc.text(pdfTxt(fmt(t,c.argent)),M+yw+(j+1)*cwid-3,y+5,{align:'right'}); });
  y+=10;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT);
  doc.text(pdfTxt('Montants en euros. Calculs de la feuille « '+s.name+' », Calcul en lignes.'),M,Math.min(y+2,H-18));
  pdfPied(doc,W,H,M,s.name+' - prévisionnel');
  return {blob:doc.output('blob'),nom:nomPDF(s,'previsionnel')};
}
async function buildPDF(){
  if(exportOpts.mise==='tableau'){ const s=cur(); if(seriesDe(s,computeSheet(s.lines))) return buildTableauPDF(); }
  const jsPDF=await getJsPDF();
  const {s,r,idx}=exportLignes();
  const doc=new jsPDF({unit:'mm',format:'a4'}), W=210, H=297, M=16;
  const P=state.prefs, acc=hexOk(P.accent)?P.accent:'#2557E8', hc=hexOk(P.headc)?P.headc:acc;
  const INK=[27,34,30], MUT=[111,121,115], RULE=[213,219,212], ERR=[180,83,42];
  const numW=exportOpts.numeros?9:0, resW=48, textX=M+numW, textW=W-2*M-numW-resW-4, resX=W-M;
  const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  doc.setProperties({title:s.name,creator:'Calcul en lignes'});
  let y=pdfBandeau(doc,W,acc,s.name,date+(exportOpts.selection&&sel.size?'  ·  lignes sélectionnées':''));
  let zebre=0;
  const page=()=>{ doc.addPage(); y=18; doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(pdfTxt(s.name),M,12); y=20; };
  let prevEmpty=false;
  for(const i of idx){
    const line=s.lines[i], x=r[i], t=line.trim();
    if(!t){ if(!prevEmpty) y+=3; prevEmpty=true; continue; } prevEmpty=false;
    if(x.kind==='head'){
      if(y>H-34) page();
      y+=4; const h=doc.splitTextToSize(pdfTxt(t.replace(/^#+\s*/,'')),W-2*M-numW-10), hh=h.length*5.2+3.4;
      doc.setFillColor(...rgb(mixHex(hc,'#ffffff',.12))); doc.roundedRect(M,y-5.6,W-2*M,hh,2,2,'F');
      doc.setFillColor(...rgb(hc)); doc.rect(M,y-5.6,1.4,hh,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor(...rgb(mixHex(hc,'#1B221E',.8))); doc.text(h,textX+4,y);
      y+=hh-1; zebre=0; continue;
    }
    const gauche=exportOpts.formules?t:libelle(line,x);
    doc.setFont('helvetica',x.isTotal?'bold':'normal'); doc.setFontSize(10);
    const L=doc.splitTextToSize(pdfTxt(gauche),textW), h=Math.max(1,L.length)*4.5+2.6;
    if(y+h>H-18) page();
    if(zebre++%2===1){ doc.setFillColor(...rgb(mixHex(acc,'#ffffff',.045))); doc.rect(M,y-4.2,W-2*M,h-.4,'F'); }
    if(exportOpts.numeros){ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUT); doc.text(String(i+1),M+numW-3,y,{align:'right'}); }
    doc.setFont('helvetica',x.isTotal?'bold':'normal'); doc.setFontSize(10); doc.setTextColor(...INK); doc.text(L,textX,y);
    let res='', col=INK;
    if(x.kind==='value'){ res=show(x); if(P.neg&&x.value<0) col=ERR; }
    else if(x.kind==='error'){ res='?'; col=ERR; }
    if(res){ doc.setFont('helvetica',x.isTotal||P.resw==='gras'?'bold':'normal'); doc.setTextColor(...col); doc.text(pdfTxt(res),resX,y,{align:'right'}); }
    if(x.isTotal){ doc.setDrawColor(...INK); doc.setLineWidth(.3); doc.line(resX-resW,y-4.4,resX,y-4.4); }
    y+=h;
  }
  pdfPied(doc,W,H,M,s.name);
  return {blob:doc.output('blob'),nom:nomPDF(s,'')};
}
function blob64(b){ return new Promise((ok,ko)=>{ const f=new FileReader(); f.onload=()=>ok(String(f.result).split(',')[1]||''); f.onerror=ko; f.readAsDataURL(b); }); }
async function deliver(blob,nom){
  const C=window.Capacitor, Pl=C&&C.Plugins;
  if(Pl&&Pl.Share&&Pl.Filesystem){   // appli Android : menu « Partager » du téléphone (Gmail, Drive, WhatsApp, Enregistrer…)
    const f=await Pl.Filesystem.writeFile({path:nom,data:await blob64(blob),directory:'CACHE'});
    try{ await Pl.Share.share({title:nom,files:[f.uri],dialogTitle:'Enregistrer ou envoyer « '+nom+' »'}); }catch(e){ if(!/cancel/i.test(String(e&&e.message))) throw e; }
    return 'partage';
  }
  const file=new File([blob],nom,{type:'application/pdf'});
  if(navigator.canShare && navigator.canShare({files:[file]})){   // navigateur du téléphone
    try{ await navigator.share({files:[file],title:nom}); }catch(e){ if(e&&e.name!=='AbortError') throw e; }
    return 'partage';
  }
  if(window.claude && typeof window.claude.use==='function'){   // page dans Claude
    const dl=await window.claude.use('downloads');
    if(dl){ await dl.save({filename:nom,data:blob}); return 'telecharge'; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  return 'telecharge';
}
let exporting=false;
async function exportPDF(){
  if(exporting) return; exporting=true;
  toast('Création du PDF…');
  try{
    const {blob,nom}=await buildPDF(); closeOver();
    const how=await deliver(blob,nom);
    if(how==='telecharge') toast('PDF enregistré : '+nom);
  }catch(e){ toast('PDF impossible : '+(e&&e.message||e)); }
  exporting=false;
}
