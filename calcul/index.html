<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Calcul en lignes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- police chargée sans bloquer l’affichage : sans réseau (ou réseau qui ne répond pas), la page s’ouvre avec la police du téléphone -->
<link id="fontLink" rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* VOICE  précis, calme, outil de travail
   IDEA   un bloc-notes de calcul : chaque ligne a son résultat dans la marge
   PICTURE la feuille elle-même, et le grand résultat au-dessus du pavé
   COLOUR ambiance + une couleur d'accent au choix (réglages)
   TYPE   une famille au choix, chiffres tabulaires */
:root{
  --bg:#E7EAE5; --surface:#FBFCFA; --ink:#1B221E; --muted:#76807A; --rule:#D5DBD4;
  --key:#FFFFFF; --key-op:#D6DED5; --accent:#2557E8; --accent-ink:#FFFFFF; --warn:#B4532A; --active:#EEF2FD;
  --res:color-mix(in srgb, var(--accent) 85%, var(--ink));
  --font:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --z:1; --kh:clamp(34px,5.8vh,50px); --kf:1; --kg:6px; --kr:12px; --padh:calc(var(--kh) * 5 + var(--kg) * 4);
  box-sizing:border-box;
  padding-top:var(--bandeau-haut,env(safe-area-inset-top,0px));
  padding-bottom:var(--bandeau-bas,env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.panel{display:flex;flex-direction:column}
/* Clavier caché en faisant défiler la feuille ; il revient en touchant une ligne ou le bouton */
body.kbcache:not(.clavform) .panel{display:none}
#kbRetour{position:fixed;right:14px;bottom:calc(14px + var(--bandeau-bas,env(safe-area-inset-bottom,0px)));z-index:15;display:none;align-items:center;gap:6px;padding:11px 15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;box-shadow:0 4px 14px rgb(0 0 0 / .22)}
#kbRetour svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}
body.kbcache:not(.clavform) #kbRetour{display:flex}

/* Onglets */
.top{display:flex;align-items:center;gap:4px;padding:8px 8px 6px 10px;background:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--rule)}
.tab input{font:inherit;color:inherit;background:none;border:0;width:9em;padding:0}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none;font-size:15px;font-weight:600}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon:active{background:var(--surface)}
.menu{display:none;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.menu.open{display:flex}
.menu button{white-space:nowrap;font-size:13px;padding:7px 11px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule)}
.menu button.danger{color:var(--warn)}

/* Feuille */
.sheet{flex:1;overflow-y:auto;background:var(--surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overscroll-behavior:contain}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;min-height:calc(44px * var(--z));border-bottom:1px solid var(--rule)}
.row.on{background:var(--active)}
.ln{font-size:11px;color:var(--muted);text-align:right;padding:0 8px 0 0;user-select:none;align-self:stretch;width:30px;border-radius:0}
.row.sel{background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.row.sel .ln{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sheet.picking .ln{color:var(--accent);font-weight:600;box-shadow:inset -2px 0 0 var(--accent)}
.selbar{margin:8px 10px 0;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--surface);display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.selbar[hidden],.hint[hidden],.tiles[hidden]{display:none}
.selbar .txt{flex:1 1 100%;font-size:13px;opacity:.85}
.selbar button{padding:7px 11px;border-radius:8px;background:color-mix(in srgb, var(--surface) 16%, transparent);color:var(--surface);font-size:14px;min-height:36px}
.selbar button.go{background:var(--accent);color:var(--accent-ink);font-weight:500}
.selbar button.del{background:var(--warn);color:#fff}
.tbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.tbar button{padding:8px 12px;border-radius:9px;background:var(--key-op);font-size:14px;font-weight:500}
.tbar span{font-size:14px;font-weight:600;flex:1}
.tbar button.ferme{padding:8px 13px;font-size:15px}
.fpick{margin-top:8px;padding:8px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule)}
.fpick .tile{min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips small{flex:1 1 100%;font-size:12px;color:var(--muted)}
.chips .btn.var{box-shadow:inset 0 0 0 1.5px var(--accent)}
.tile.theme{min-height:74px;background:color-mix(in srgb, var(--accent) 7%, var(--key))}
.tile.special{box-shadow:inset 0 0 0 1.5px var(--accent)}
.form label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.form label small{display:block;color:var(--muted);font-size:12px}
.form input{width:8.5em;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:9px 10px;text-align:right}
.ex{width:100%;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:calc(17px * var(--z));padding:10px 4px;outline:none}
.ex::placeholder{color:var(--muted);opacity:.6}
.row.head .ex{font-weight:600;font-size:calc(15px * var(--z))}
.row.head{border-bottom-color:var(--ink)}
.res{max-width:min(46vw,260px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
  padding:10px 12px 10px 6px;font-size:calc(17px * var(--z));font-weight:500;color:var(--res)}
.res.var::before{content:attr(data-name) " = ";color:var(--muted);font-weight:400;font-size:calc(13px * var(--z))}
.res.tot{color:var(--ink);font-weight:600;border-left:3px double var(--ink);padding-left:10px}
.res.err{color:var(--warn);font-weight:400;font-size:13px}
.res.fn{color:var(--muted);font-weight:400;font-size:13px}
.res:empty{padding:0}
/* Séries en tableau : années en lignes, séries en colonnes */
.row.entab{display:none}
.tbl{overflow-x:auto;border-bottom:1px solid var(--rule);background:var(--surface)}
.tbl table{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule);padding:0}
.tbl th{font-weight:600;font-size:calc(12.5px * var(--z));color:var(--ink);padding:10px 10px 8px;white-space:normal;vertical-align:bottom;min-width:6em;line-height:1.2;border-bottom:1px solid var(--ink)}
.tbl th:first-child,.tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding-left:12px;min-width:4.2em}
.tbl td:first-child{font-size:calc(13px * var(--z));color:var(--muted);padding-right:8px}
.tbl td:first-child small{display:block;font-size:11px}
.tbl .cell{display:block;width:100%;text-align:right;padding:10px 10px;font:inherit;font-size:calc(15px * var(--z));font-weight:500;color:var(--res);border-radius:0}
.tbl .cell.on{background:var(--active);box-shadow:inset 0 -2px 0 var(--accent)}
.tbl .cell.neg,.tbl td.neg{color:var(--warn)}
.tbl tr.tot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0;padding:10px;font-size:calc(15px * var(--z));color:var(--ink)}
.tbl tr.tot td:first-child{font-size:calc(13px * var(--z))}
.tbl th.plus{min-width:0;padding:6px 8px;vertical-align:middle}
.tbl th.plus button{padding:7px 10px;border-radius:8px;background:var(--key-op);font-size:13px;font-weight:600;white-space:nowrap}
.tbl.pointe .cell{box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent)}
#tabBtn[aria-pressed="true"]{color:var(--accent)}

/* Écran */
.hint{margin:8px 10px 0;padding:8px 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule);font-size:14px;line-height:1.4}
.hint .sig{color:var(--muted)}
.hint .sig b{color:var(--ink);font-weight:600}
.hint .sig .now{color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:0 5px;font-weight:500}
.hint .exm{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.display{padding:8px 14px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:58px}
.display .lab{font-size:12px;color:var(--muted);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.display .big{font-size:calc(32px * var(--z));font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.app[data-layout] .display .big.err{font-size:14px;color:var(--warn);white-space:normal;text-align:right}

/* Clavier maison : pavé et lettres, on passe de l'un à l'autre avec ABC et 123 */
.kbd{position:relative;overflow:hidden;touch-action:none;padding:2px 0 8px;user-select:none;-webkit-user-select:none}
.kbd.hide{display:none}
.track{display:flex;width:200%;transform:translateX(0);transition:transform .26s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.track>*{width:50%;flex:none}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--kg);padding:0 10px;align-content:start}
.abc{display:flex;flex-direction:column;gap:var(--kg);padding:0 6px;height:var(--padh)}
.abc .r{display:flex;gap:calc(var(--kg) * .67);flex:1;min-height:0}
.k.down{filter:brightness(.9)}
.trail{position:absolute;inset:0;pointer-events:none;z-index:5}
.sugg{display:flex;gap:6px;padding:0 10px var(--kg);overflow-x:auto;scrollbar-width:none}
.sugg[hidden]{display:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:1 1 0;min-width:0;height:calc(var(--kh) * .72);border-radius:var(--kr);background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule);font-size:calc(16px * var(--kf));color:var(--key-ink,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.sugg button.first{font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}
.rac{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--kg);padding:0 10px var(--kg)}
.rac[hidden]{display:none}
.app .kbd .rac .k{height:calc(var(--kh) * .72);font-size:calc(16px * var(--kf));background:var(--key-op);padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res.neg,.big.neg{color:var(--warn)!important}
.sheet[data-lines="zebre"] .row{border-bottom-color:transparent}
.sheet[data-lines="zebre"] .row:nth-child(even):not(.on):not(.sel){background:color-mix(in srgb, var(--ink) 4%, var(--surface))}
.sheet[data-lines="aucune"] .row{border-bottom-color:transparent}
.sheet[data-lines="aucune"] .row.head{border-bottom-color:var(--ink)}
.app[data-big="m"][data-layout] .display .big{font-size:calc(26px * var(--z))}
.app[data-big="m"] .display{min-height:48px}
.app[data-big="s"][data-layout] .display .big{font-size:calc(19px * var(--z))}
.app[data-big="s"] .display{min-height:34px;padding-top:4px;padding-bottom:2px}
.app[data-big="off"] .display{display:none}
.grp{border-bottom:1px solid var(--rule)}
.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:16px;font-weight:600}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:6px;transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg)}
.grp>div{padding-bottom:16px}
.grp>div>h3:first-child{margin-top:0}
.racedit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.racedit input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:9px 4px;text-align:center}
.k.on{background:var(--accent);color:var(--accent-ink)}
.pop{position:fixed;z-index:25;display:flex;gap:3px;padding:4px;border-radius:12px;background:var(--surface);color:var(--ink);
  box-shadow:0 6px 22px rgb(0 0 0 / .28),inset 0 0 0 1px var(--rule);pointer-events:none}
.pop span{min-width:38px;height:46px;display:grid;place-items:center;border-radius:9px;font-size:21px}
.pop span.hi{background:var(--accent);color:var(--accent-ink)}
.tiles{height:calc(var(--padh) + 10px);overflow-y:auto;overscroll-behavior:contain;padding:0 10px 10px}
.tiles h4{margin:6px 2px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.tiles h4:first-child{margin-top:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{position:relative;overflow:hidden;min-height:58px;border-radius:12px;background:var(--key);box-shadow:0 1px 0 var(--rule);
  padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:3px;touch-action:manipulation;user-select:none}
.tile b{font-size:calc(15px * var(--z));font-weight:600;line-height:1.15}
.tile small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.fav{background:color-mix(in srgb, var(--accent) 13%, var(--key))}
.tile.fav::before{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tile:active{filter:brightness(.93)}
.tile::after{content:"";position:absolute;inset:0;background:var(--accent);opacity:.22;transform:scaleX(0);transform-origin:left;pointer-events:none}
.tile.hold::after{transform:scaleX(1);transition:transform .6s linear}
.tiles p{font-size:12px;color:var(--muted);margin:10px 2px 0}
.k{position:relative;overflow:hidden;height:var(--kh);border-radius:var(--kr);background:var(--key);font-size:calc(21px * var(--kf));
  box-shadow:0 1px 0 var(--rule);touch-action:manipulation;user-select:none;color:var(--key-ink,var(--ink))}
.k.op{background:var(--key-op)}
.k.fn{background:var(--key-op);font-size:calc(16px * var(--kf))}
.k.go{background:var(--accent);color:var(--accent-ink);font-size:calc(22px * var(--kf));font-weight:500}
.k.tl{font-size:calc(15px * var(--kf));font-weight:500}
.k:active{filter:brightness(.92)}
.k::after{content:"";position:absolute;inset:0;background:var(--warn);opacity:.28;transform:scaleX(0);transform-origin:left;pointer-events:none}
.k.hold::after{transform:scaleX(1);transition:transform .6s linear}

/* Dispositions */
.app[data-layout="tableur"] .row{min-height:calc(36px * var(--z))}
.app[data-layout="tableur"] .ex,.app[data-layout="tableur"] .res{padding-top:6px;padding-bottom:6px;font-size:calc(15px * var(--z))}
.app[data-layout="tableur"] .row{grid-template-columns:30px minmax(0,1fr) minmax(0,40%)}
.app[data-layout="tableur"] .res{border-left:1px solid var(--rule);max-width:none;align-self:stretch;display:flex;align-items:center;justify-content:flex-end}
.app[data-layout="tableur"] .res.var::before{margin-right:.3em}
.app[data-layout="tableur"] .display{min-height:40px;padding-top:4px}
.app[data-layout="tableur"] .display .big{font-size:calc(22px * var(--z))}
.app[data-layout="tableur"] .k{height:calc(var(--kh) * .82);font-size:calc(18px * var(--kf));border-radius:calc(var(--kr) * .75)}
.app[data-layout="tableur"] .k.fn{font-size:calc(14px * var(--kf))}
.app[data-layout="tableur"]{--padh:calc(var(--kh) * .82 * 5 + var(--kg) * 4)}
.app .abc .k{height:auto;flex:1;min-width:0;padding:0;font-size:calc(19px * var(--kf));border-radius:calc(var(--kr) * .75)}
.app .abc .k.w15{flex:1.5;font-size:calc(16px * var(--kf))}
.app .abc .k.sp{flex:4;font-size:calc(14px * var(--kf));color:var(--muted)}
.app .abc .k.op{font-size:calc(19px * var(--kf))}
.app[data-layout="calc"] .display{min-height:72px}
.app[data-layout="calc"] .display .big{font-size:calc(40px * var(--z))}
@media (min-width:640px){
  .app[data-layout="cote"]{max-width:1100px;flex-direction:row;gap:14px;padding:12px}
  .app[data-layout="cote"] .main{min-width:0}
  .app[data-layout="cote"] .sheet{border:1px solid var(--rule);border-radius:12px}
  .app[data-layout="cote"] .panel{width:min(380px,42%);justify-content:flex-end}
}
@media (min-width:700px){ .app:not([data-layout="cote"]){padding-top:16px} .app:not([data-layout="cote"]) .sheet{border:1px solid var(--rule);border-radius:12px} }

/* Panneaux */
/* Apparence : papier, titres, hauteur des lignes, résultats, touches */
.sheet[data-paper="ligne"]{background-image:linear-gradient(90deg,transparent 33px,color-mix(in srgb, var(--warn) 45%, transparent) 33px 34px,transparent 34px)}
.sheet[data-paper="ligne"] .row{border-bottom-color:color-mix(in srgb, var(--accent) 28%, var(--surface))}
.sheet[data-paper="quadrille"]{background-image:linear-gradient(color-mix(in srgb, var(--accent) 14%, transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb, var(--accent) 14%, transparent) 1px,transparent 1px);background-size:22px 22px;background-attachment:local}
.sheet[data-paper="quadrille"] .row:not(.head){border-bottom-color:transparent}
.sheet[data-paper="points"]{background-image:radial-gradient(color-mix(in srgb, var(--ink) 22%, transparent) 1.1px,transparent 1.4px);background-size:20px 20px;background-attachment:local}
.sheet[data-paper="points"] .row:not(.head){border-bottom-color:transparent}
.sheet[data-heads="couleur"] .row.head .ex{color:var(--headc,var(--accent))}
.sheet[data-heads="couleur"] .row.head{border-bottom-color:var(--headc,var(--accent))}
.sheet[data-heads="bandeau"] .row.head{background:color-mix(in srgb, var(--headc,var(--accent)) 16%, var(--surface));border-bottom-color:transparent}
.sheet[data-heads="bandeau"] .row.head .ex{color:color-mix(in srgb, var(--headc,var(--accent)) 75%, var(--ink))}
.sheet[data-heads="discret"] .row.head{border-bottom-color:var(--rule)}
.sheet[data-heads="discret"] .row.head .ex{font-weight:500;color:var(--muted);font-size:calc(13px * var(--z))}
.app[data-dens="serree"] .row{min-height:calc(34px * var(--z))}
.app[data-dens="serree"] .ex,.app[data-dens="serree"] .res{padding-top:5px;padding-bottom:5px}
.app[data-dens="aeree"] .row{min-height:calc(56px * var(--z))}
.app[data-dens="aeree"] .ex,.app[data-dens="aeree"] .res{padding-top:15px;padding-bottom:15px}
.app[data-resw="gras"] .res{font-weight:700}
.app[data-resw="fin"] .res{font-weight:400}
.app[data-enter="sobre"] .k.go{background:var(--key-op);color:var(--key-ink,var(--ink))}
.app[data-sheetr="rond"] .sheet{border-radius:16px;margin:0 8px;border:1px solid var(--rule)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.preset{border-radius:12px;padding:10px;text-align:left;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12);min-height:72px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.preset b{font-size:13px;font-weight:600}
.preset i{display:flex;gap:4px}

<script>/* bandeaux : début */
// =====================================================================================
//  Bandeaux du haut et du bas — pour l'application Android / iPhone, où la page s'étend sous
//  la barre d'état (heure, batterie) et sous la barre de navigation (◁ ○ □).
//  Deux bandes de la couleur de la barre de l'appli recouvrent ces zones : rien n'y passe dessous,
//  et l'on ne clique jamais « derrière » les boutons du téléphone. Sur ordinateur ou dans un
//  navigateur, ces zones mesurent 0 : rien ne change. (Module commun, recopié tel quel dans chaque
//  appli, dans le <head>, entre les repères « bandeaux : début » et « bandeaux : fin ». Modifier ici, puis recopier.)
//  La couleur suit celle de l'en-tête de l'appli, tout de suite quand on la personnalise.
// =====================================================================================
(function () {
  "use strict";
  if (window.__bandeaux) return; window.__bandeaux = true;
  var css = ""
    // env() : navigateur et WebView récents ; --safe-area-inset-* : valeurs posées par l'application Capacitor
    + ":root{--bandeau-haut:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));"
    + "--bandeau-bas:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}"
    + "html::before,html::after{content:'';position:fixed;left:0;right:0;pointer-events:none;background:var(--bandeau,var(--hb-barre,#0c2d39))}"
    + "html::before{top:0;height:var(--bandeau-haut);z-index:2147483600}"
    // en bas, sous les barres et fenêtres de l'appli (qui ont déjà leur marge), mais au-dessus du contenu
    + "html::after{bottom:0;height:var(--bandeau-bas);z-index:14}"
    + "@media (max-width:760px){html,body{overflow-x:clip}}"   // pas de glissement de côté sur téléphone
    + "@media print{html::before,html::after{display:none}}";
  var s = document.createElement("style"); s.id = "bandeaux-style"; s.textContent = css;
  (document.head || document.documentElement).appendChild(s);
  var ENTETES = "header.haut,header.top,header.entete,body>header";
  var minuteur = 0;
  function maj() {
    clearTimeout(minuteur);
    minuteur = setTimeout(function () {
      var h = document.querySelector(ENTETES), c = "";
      if (h) { c = getComputedStyle(h).backgroundColor; if (/rgba\(.*,\s*0\)$|transparent/.test(c)) c = ""; }
      var r = document.documentElement.style, avant = r.getPropertyValue("--bandeau").trim();
      if (c === avant) return;   // rien à changer (et pas de boucle avec l'observateur ci-dessous)
      if (c) r.setProperty("--bandeau", c); else r.removeProperty("--bandeau");
    }, 60);
  }
  document.addEventListener("DOMContentLoaded", function () {
    maj();
    try {   // personnalisation (styles ajoutés, thème jour / nuit) : la couleur suit
      new MutationObserver(maj).observe(document.head, { childList: true, subtree: true, characterData: true });
      // couleurs posées dans l'attribut style de la page (Personnaliser), classes, thème…
      new MutationObserver(maj).observe(document.documentElement, { attributes: true });
      new MutationObserver(maj).observe(document.body, { attributes: true });
      document.addEventListener("visibilitychange", maj);
      if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", maj);
    } catch (e) {}
  });
  window.addEventListener("load", maj);
})();
/* bandeaux : fin */</script>

<script>
{
"use strict";

/* ===================== Barèmes 2026 ===================== */
// IR : loi de finances 2026, revenus 2025. Plafonnement et décote : service-public.gouv.fr (revenus 2025).
// Succession / donation : CGI art. 777 et 779. IFI : CGI art. 977. Usufruit : CGI art. 669. PFU : 12,8 % + 18,6 % (2026).
const B = {
  ir:[[11600,0],[29579,.11],[84577,.30],[181917,.41],[Infinity,.45]],
  qfDemiPart:1807, decote:{seul:[1982,897],couple:[3277,1483],taux:.4525},
  ld:[[8072,.05],[12109,.10],[15932,.15],[552324,.20],[902838,.30],[1805677,.40],[Infinity,.45]],
  fs:[[24430,.35],[Infinity,.45]],
  conj:[[8072,.05],[15932,.10],[31865,.15],[552324,.20],[902838,.30],[1805677,.40],[Infinity,.45]],   // donation entre époux / Pacs (art. 777, tableau II)
  // Successions (art. 779, 788) : conjoint et Pacs exonérés ; petit-enfant qui hérite directement : 1 594 €
  abatS:{enfant:100000,pe:1594,ape:1594,frere:15932,neveu:7967,tiers:1594},
  // Donations (art. 779, 790 B, 790 D, 790 E, 790 F) : pas d'abattement entre personnes sans lien
  abatD:{enfant:100000,pe:31865,ape:5310,conj:80724,frere:15932,neveu:7967,tiers:0},
  handicap:159325,
  ifi:[[800000,0],[1300000,.005],[2570000,.007],[5000000,.01],[10000000,.0125],[Infinity,.015]],
  usuf:[[20,.9],[30,.8],[40,.7],[50,.6],[60,.5],[70,.4],[80,.3],[90,.2],[Infinity,.1]],
  pfu:.314, ps:.186
};
const tranches=(x,t)=>{ let s=0,p=0; for(const [lim,r] of t){ if(x>p) s+=(Math.min(x,lim)-p)*r; p=lim; } return s; };
const irBrut=(R,parts)=>tranches(Math.max(0,R)/parts,B.ir)*parts;
function impotIR(R,parts,base){
  parts=Math.max(1,parts||1); base=base||(parts>=2?2:1); base=Math.min(base,parts);
  const a=irBrut(R,parts), b=irBrut(R,base)-(parts-base)*2*B.qfDemiPart;
  let imp=Math.round(Math.max(a,b));
  const [seuil,forf]=base>=2?B.decote.couple:B.decote.seul;
  if(imp<=seuil) imp=Math.max(0,imp-Math.max(0,forf-B.decote.taux*imp));
  return Math.round(imp);
}
const tmiIR=(R,parts)=>{ const q=Math.max(0,R)/Math.max(1,parts||1); let p=0; for(const [lim,r] of B.ir){ if(q<=lim) return r; p=lim; } return .45; };
const droits=(part,abat,t)=>Math.round(tranches(Math.max(0,part-abat),t));
function ifiCalc(P){ if(P<1300000) return 0; let x=tranches(P,B.ifi); if(P<1400000) x-=17500-.0125*P; return Math.round(Math.max(0,x)); }
const usufTaux=age=>{ for(const [m,r] of B.usuf) if(age<=m) return r; return .1; };

/* ===================== Moteur de calcul ===================== */
class Pct{ constructor(v){ this.v=v; } }
const num = x => x instanceof Pct ? x.v/100 : Array.isArray(x) ? x.reduce((s,y)=>s+y,0) : x;
const flat = args => args.flatMap(a => Array.isArray(a) ? a : [num(a)]);
const rad = d => d*Math.PI/180;
const fixRound = (x,n,f) => { const p=10**(n||0); return f(x*p)/p; };
const pctArg = r => r instanceof Pct ? r.v : num(r);           // 3,5 % ou 3,5 → 3,5
const need=(a,n,nom)=>{ if(a.length<n) throw new Error(nom+' : '+n+' valeur'+(n>1?'s':'')+' attendue'+(n>1?'s':'')+' (séparées par ;)'); };

const ALIAS = {somme:'sum',sum:'sum',moy:'avg',moyenne:'avg',avg:'avg',min:'min',max:'max',nb:'count',
  arrondi:'round',round:'round',plancher:'floor',floor:'floor',plafond:'ceil',ceil:'ceil',
  racine:'sqrt',sqrt:'sqrt',abs:'abs',ln:'ln',log:'log',exp:'exp',sin:'sin',cos:'cos',tan:'tan',
  puissance:'pow',pow:'pow',ttc:'ttc',ht:'ht',tva:'tva',evol:'evol',si:'if',if:'if',
  mensualite:'pmt','mensualité':'pmt',cout:'cost','coût':'cost',capital:'cap',vf:'fv',va:'pv',
  interets:'cumint','intérêts':'cumint',crd:'crd',
  ir:'ir',tmi:'tmi',parts:'parts',ifi:'ifi',pfu:'pfu',ps:'ps',
  succ:'succ',succpe:'succpe',succape:'succape',succfrere:'succfrere',succneveu:'succneveu',succtiers:'succtiers',succconjoint:'succconj',
  don:'don',donation:'don',donpe:'donpe',donape:'donape',donconjoint:'donconj',donfrere:'donfrere',donneveu:'donneveu',dontiers:'dontiers',
  usufruit:'usuf',np:'np'};
const FISCAL = new Set(['cumint','crd','ir','ifi','pfu','ps','succ','succpe','succape','succfrere','succneveu','succtiers','succconj','don','donpe','donape','donconj','donfrere','donneveu','dontiers','usuf','np','pmt','cost','cap']);
let PREF_TVA = 20, PREF_PARTS = 1;
const FN = {
  sum:a=>flat(a).reduce((s,x)=>s+x,0),
  avg:a=>{const f=flat(a); if(!f.length) throw new Error('Moyenne de rien'); return f.reduce((s,x)=>s+x,0)/f.length;},
  count:a=>flat(a).length,
  min:a=>Math.min(...flat(a)), max:a=>Math.max(...flat(a)),
  round:a=>fixRound(num(a[0]),num(a[1]??0),Math.round),
  floor:a=>fixRound(num(a[0]),num(a[1]??0),Math.floor),
  ceil:a=>fixRound(num(a[0]),num(a[1]??0),Math.ceil),
  sqrt:a=>Math.sqrt(num(a[0])), abs:a=>Math.abs(num(a[0])),
  ln:a=>Math.log(num(a[0])), log:a=>Math.log10(num(a[0])), exp:a=>Math.exp(num(a[0])),
  sin:a=>Math.sin(rad(num(a[0]))), cos:a=>Math.cos(rad(num(a[0]))), tan:a=>Math.tan(rad(num(a[0]))),
  pow:a=>{need(a,2,'puissance'); return num(a[0])**num(a[1]);},
  ttc:a=>num(a[0])*(1+(a[1]===undefined?PREF_TVA:pctArg(a[1]))/100),
  ht:a=>num(a[0])/(1+(a[1]===undefined?PREF_TVA:pctArg(a[1]))/100),
  tva:a=>num(a[0])*(a[1]===undefined?PREF_TVA:pctArg(a[1]))/100,
  evol:a=>{need(a,2,'evol'); const x=num(a[0]),y=num(a[1]); return new Pct((y-x)/x*100);},
  if:a=>{need(a,2,'si'); return num(a[0]) ? a[1] : (a[2]??0);},
  pmt:a=>{need(a,3,'mensualite'); const C=num(a[0]), r=pctArg(a[1])/1200, n=num(a[2])*12; return r? C*r/(1-(1+r)**-n) : C/n;},
  cost:a=>{need(a,3,'cout'); const n=num(a[2])*12; return FN.pmt(a)*n-num(a[0]);},
  cap:a=>{need(a,3,'capital'); const m=num(a[0]), r=pctArg(a[1])/1200, n=num(a[2])*12; return r? m*(1-(1+r)**-n)/r : m*n;},
  cumint:a=>{need(a,5,'interets'); const C=num(a[0]), r=pctArg(a[1])/1200, N=Math.round(num(a[2])*12);
    const m=r? C*r/(1-(1+r)**-N) : C/N, d=Math.max(1,Math.round(num(a[3]))), f=Math.min(N,Math.round(num(a[4])));
    let crd=C, s=0; for(let k=1;k<=f;k++){ const i=crd*r; if(k>=d) s+=i; crd-=m-i; } return s;},
  crd:a=>{need(a,4,'crd'); const C=num(a[0]), r=pctArg(a[1])/1200, N=Math.round(num(a[2])*12), k=Math.min(N,Math.max(0,Math.round(num(a[3]))));
    const m=r? C*r/(1-(1+r)**-N) : C/N; return r? Math.max(0,C*(1+r)**k-m*((1+r)**k-1)/r) : Math.max(0,C-m*k);},
  fv:a=>{need(a,3,'vf'); return num(a[0])*(1+pctArg(a[1])/100)**num(a[2]);},
  pv:a=>{need(a,3,'va'); return num(a[0])/(1+pctArg(a[1])/100)**num(a[2]);},
  ir:a=>{need(a,1,'ir'); return impotIR(num(a[0]), a[1]===undefined?PREF_PARTS:num(a[1]), a[2]===undefined?0:num(a[2]));},
  tmi:a=>{need(a,1,'tmi'); return new Pct(tmiIR(num(a[0]), a[1]===undefined?PREF_PARTS:num(a[1]))*100);},
  parts:a=>{ const couple=num(a[0]??0)?2:1, e=Math.max(0,Math.floor(num(a[1]??0))); return couple+(e<=2?e*.5:1+(e-2)); },
  ifi:a=>{need(a,1,'ifi'); return ifiCalc(num(a[0]));},
  pfu:a=>{need(a,1,'pfu'); return num(a[0])*B.pfu;},
  ps:a=>{need(a,1,'ps'); return num(a[0])*(a[1]===undefined?B.ps:pctArg(a[1])/100);},
  // Successions
  succ:a=>{need(a,1,'succ'); return droits(num(a[0]), a[1]===undefined?B.abatS.enfant:num(a[1]), B.ld);},
  succpe:a=>{need(a,1,'succpe'); return droits(num(a[0]), a[1]===undefined?B.abatS.pe:num(a[1]), B.ld);},
  succape:a=>{need(a,1,'succape'); return droits(num(a[0]), a[1]===undefined?B.abatS.ape:num(a[1]), B.ld);},
  succfrere:a=>{need(a,1,'succfrere'); return droits(num(a[0]), a[1]===undefined?B.abatS.frere:num(a[1]), B.fs);},

const RESERVED = new Set([...Object.keys(ALIAS),'pi','e','ans','total','de','of','du','des','mod','et','ou']);
const CMP = new Set(['<','>','<=','>=','=','==','<>','!=']);

function preprocess(s){
  s = s.replace(/[−–]/g,'-').replace(/[×·∙]/g,'*').replace(/÷/g,'/').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/≠/g,'<>')
       .replace(/√/g,'racine').replace(/²/g,'^2').replace(/³/g,'^3').replace(/π/g,'pi');
  for(let i=0;i<3;i++) s = s.replace(/(\d)[   ](?=\d{3}(?!\d))/g,'$1');
  s = s.replace(/(\d),(\d)/g,'$1.$2');
  s = s.replace(/(^|[-+*/^(;=<>:])(\s*),(?=\d)/g,'$1$2.');   // « ,3 » = 0,3
  for(let i=0;i<3;i++) s = s.replace(/(\d|\))\s*[xX]\s*(?=[\d(.])/g,'$1*');
  return s;
}
function tokenize(s){
  const out=[]; let i=0;
  while(i<s.length){
    const r=s.slice(i); let m;
    if(/^\s/.test(r)){ i++; continue; }
    if((m=r.match(/^[lL](\d+)\s*:\s*[lL](\d+)/))){ out.push({t:'range',a:+m[1],b:+m[2]}); i+=m[0].length; continue; }
    if((m=r.match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/))){ out.push({t:'num',v:parseFloat(m[0])}); i+=m[0].length; continue; }
    if((m=r.match(/^[\p{L}_][\p{L}\d_]*/u))){ out.push({t:'id',v:m[0].toLowerCase(),raw:m[0]}); i+=m[0].length; continue; }
    if((m=r.match(/^(\*\*|<=|>=|<>|!=|==|[-+*/^%(),;!<>=])/))){ out.push({t:'op',v:m[0]==='**'?'^':m[0]}); i+=m[0].length; continue; }
    throw new Error('Caractère inattendu : '+r[0]);
  }
  return out;
}

function evaluate(src, ctx){

  const expect=v=>{ if(!isOp(v)) throw new Error(v===')'?'Parenthèse fermante manquante':'« '+v+' » attendu'); p++; };
  const NOJUX=['de','of','du','des','mod','et','ou'];

  function logic(){
    let l=cmp();
    for(;;){
      if(isId('et')){ p++; const r=cmp(); l=(num(l)&&num(r))?1:0; }
      else if(isId('ou')){ p++; const r=cmp(); l=(num(l)||num(r))?1:0; }

    }
  }
  function cmp(){

      const op=tk[p++].v, a=num(l), b=num(add()), eq=Math.abs(a-b)<1e-9*Math.max(1,Math.abs(a),Math.abs(b));
      l = ({'<':a<b&&!eq,'>':a>b&&!eq,'<=':a<b||eq,'>=':a>b||eq,'=':eq,'==':eq,'<>':!eq,'!=':!eq})[op]?1:0;
    }

  }
  function add(){

      if(r instanceof Pct && l instanceof Pct) l=new Pct(l.v+s*r.v);
      else if(r instanceof Pct) l=num(l)*(1+s*r.v/100);
      else l=num(l)+s*num(r);
    }
    return l;
  }
  function mul(){
    let l=unary();
    for(;;){
      if(isOp('*')){ p++; l=num(l)*num(unary()); }
      else if(isOp('/')){ p++; l=num(l)/num(unary()); }
      else if(isId('mod')){ p++; const b=num(unary()), a=num(l); l=((a%b)+b)%b; }
      else if(isOp('(') || (peek()&&peek().t==='id'&&!NOJUX.includes(peek().v)) || (peek()&&peek().t==='range')){ l=num(l)*num(unary()); }

      for(let n=a;n<=b;n++){ if(n-1===ctx.results.length) continue; const r=lineAt(n-1); if(r&&r.kind==='value'&&!r.isPct){ out.push(r.value); ctx.touch(r.cur);} }
      return out; }
    if(isOp('(')){ p++; const v=logic(); expect(')'); return v; }
    if(t.t==='id'){
      p++;
      if(isOp('(')){
        p++;
        if(ctx.funcs.has(t.v)){
          const f=ctx.funcs.get(t.v), a=args();
          if(a.length!==f.params.length) throw new Error(t.raw+' attend '+f.params.length+' valeur'+(f.params.length>1?'s':''));
          if((ctx.depth||0)>20) throw new Error('Fonction qui s’appelle en boucle');
          const sub=Object.create(ctx); sub.vars=new Map(ctx.vars); sub.depth=(ctx.depth||0)+1;
          f.params.forEach((n,i)=>sub.vars.set(n,a[i] instanceof Pct?{v:a[i].v,cur:'',pct:true}:{v:num(a[i]),cur:''}));
          return evaluate(f.body,sub);
        }
        const name=ALIAS[t.v]; if(!name) throw new Error('Fonction inconnue : '+t.raw);
        if(FISCAL.has(name)) ctx.touch('€');
        const av=args();
        if((name==='ir'||name==='tmi') && !ctx.note){ const pt=av[1]===undefined?PREF_PARTS:num(av[1]); ctx.note=(name==='ir'?'Impôt':'TMI')+' pour '+fmt(pt)+' part'+(pt>1?'s':'')+(av[1]===undefined?' (par défaut, ajoutez ; parts)':''); }
        return FN[name](av);

      if(!ctx.vars.has(t.v) && ctx.declared.has(t.v)) ctx.flags.fwd=true;   // variable définie plus bas
      if(ctx.vars.has(t.v)||(ctx.prevVars&&ctx.prevVars.has(t.v))){   // variable définie plus haut, ou plus bas (passage précédent)
        if(!ctx.vars.has(t.v)) ctx.flags.fwd=true;

let lastFuncs=new Map();
// Une ligne peut utiliser une ligne (ou une variable) située plus bas : on recalcule la feuille
// tant que les résultats changent, comme un tableur. Au-delà de 25 passages, c'est une boucle.
function computeSheet(lines){
  let prev=null, prevVars=null, out=null;
  for(let pass=0;pass<25;pass++){
    const r=computeOnce(lines,prev,prevVars); out=r.results;
    if(!r.fwd) return out;
    if(prev && sameResults(out,prev)) return out;
    prev=out; prevVars=r.vars;
  }
  out.forEach((x,i)=>{ if(x.kind==='value' && prev && (!prev[i] || prev[i].value!==x.value)){ x.kind='error'; x.msg='Calcul en boucle : des lignes s’utilisent entre elles'; } });
  return out;
}
function sameResults(a,b){
  if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++){ const x=a[i], y=b[i]; if(x.kind!==y.kind || (x.kind==='value' && Math.abs(x.value-y.value)>1e-9*Math.max(1,Math.abs(x.value)))) return false; }
  return true;
}
function computeOnce(lines,prev,prevVars){

    touch(c){ if(c&&!this.lineCur) this.lineCur=c; }};

  for(const raw of lines){
    const m=raw.trim().match(/^([\p{L}_][\p{L}\d_]*)\s*\(([^)]*)\)\s*=(?!=)\s*(.+)$/u);
    if(m){ const n=m[1].toLowerCase(), ps=m[2].split(/[;,]/).map(s=>s.trim().toLowerCase()).filter(Boolean);
      if(!RESERVED.has(n) && ps.every(x=>/^[\p{L}_][\p{L}\d_]*$/u.test(x))) ctx.funcs.set(n,{params:ps,body:m[3]}); }
  }

    const res={kind:'empty'}; let t=raw.trim();
    if(!t){ ctx.block=[]; ctx.blockCur=''; ctx.results.push(res); continue; }
    if(t.startsWith('#')){ res.kind='head'; ctx.block=[]; ctx.blockCur=''; ctx.results.push(res); continue; }
    t=t.split('//')[0].trim();
    let m=t.match(/^([\p{L}_][\p{L}\d_]*)\s*\(([^)]*)\)\s*=(?!=)\s*(.+)$/u);

      else if(!ctx.funcs.has(n)){ res.kind='error'; res.msg='Paramètres invalides'; }
      else { res.kind='fn'; res.label='fonction '+m[1]+'('+ctx.funcs.get(n).params.join('; ')+')'; }
      res.run=ctx.block.reduce((s,x)=>s+x,0); res.runCur=ctx.blockCur; res.runCount=ctx.block.length;

    }
    m=t.match(/^((?:[^:()=<>]|\([^()]*\))+?)\s*:\s*(.+)$/);
    if(m && /\p{L}/u.test(m[1]) && !/^\s*l\d+\s*$/i.test(m[1])) t=m[2];
    t=t.replace(/^=\s*/,'');
    let name=null;
    m=t.match(/^([\p{L}_][\p{L}\d_]*)\s*=(?!=)\s*(.+)$/u);

}

let NF=null, DEC='auto';
function setDecimals(d){ DEC=d; NF = d==='auto' ? new Intl.NumberFormat('fr-FR',{maximumFractionDigits:8}) : new Intl.NumberFormat('fr-FR',{minimumFractionDigits:+d,maximumFractionDigits:+d}); }
setDecimals('auto');
const NF_MONEY=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
let SEP='\u202f';
function fmt(n,money){ const t=fmt0(n,money); return SEP==='\u202f'?t:t.replace(/[\u202f\u00a0]/g,SEP); }
function fmt0(n,money){
  if(!Number.isFinite(n)) return Number.isNaN(n)?'Erreur':(n>0?'∞':'−∞');
  const r=Number(n.toPrecision(12)), a=Math.abs(r);
  if(a!==0 && (a>=1e15 || (DEC==='auto' && a<1e-9 && !money))) return r.toExponential(6).replace(/\.?0+e/,'e').replace('.',',');
  if(money && DEC==='auto'){ const c=Math.round(r*100)/100; return c%1 ? c.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) : NF_MONEY.format(c); }
  return NF.format(r);
}
const raw = n => String(Number(n.toPrecision(12))).replace('.',',');
function show(r){ return r.isPct ? fmt(r.display)+' %' : fmt(r.value,!!r.cur)+(r.cur?' '+r.cur:''); }

function mixHex(a,b,w){ // w = part de a
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return '#'+pa.map((v,i)=>Math.round(v*w+pb[i]*(1-w)).toString(16).padStart(2,'0')).join('');
}
function fondPerso(c){
  const dark=lum(c)<.18, base=dark?AMB.encre:AMB.brume;
  return dark
    ? {...base,n:'Perso',dark:true,bg:c,surface:mixHex(c,'#ffffff',.9),rule:mixHex(c,'#ffffff',.78),key:mixHex(c,'#ffffff',.84),keyop:mixHex(c,'#ffffff',.74),muted:mixHex('#ffffff',c,.6)}
    : {...base,n:'Perso',dark:false,bg:c,surface:mixHex(c,'#ffffff',.35),rule:mixHex(c,'#000000',.86),key:mixHex(c,'#ffffff',.18),keyop:mixHex(c,'#000000',.9)};
}
// Appli Android : barre d'état de la couleur du fond, icônes (heure, batterie, ◁ ○ □) claires ou foncées selon l'ambiance
function barresNatives(bg,dark){
  const P=window.Capacitor&&window.Capacitor.Plugins; if(!P) return;
  const st=dark?'DARK':'LIGHT', go=f=>{ try{ Promise.resolve(f()).catch(()=>{}); }catch(e){} };
  if(P.SystemBars) go(()=>P.SystemBars.setStyle({style:st}));
  if(P.StatusBar){ go(()=>P.StatusBar.setBackgroundColor({color:bg})); go(()=>P.StatusBar.setStyle({style:st})); }
}
function hexOk(h){ return /^#[0-9a-f]{6}$/i.test(h); }
function lum(h){ const c=[1,3,5].map(i=>{ const v=parseInt(h.substr(i,2),16)/255; return v<=.03928?v/12.92:((v+.055)/1.055)**2.4; }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; }
const mql = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyPrefs(){
  const P=state.prefs, root=document.documentElement;
  let a=P.ambiance;
  if(a==='auto'){ const vt=root.getAttribute('data-theme'); a=(vt==='dark'||(!vt&&mql&&mql.matches))?'encre':'brume'; }
  let t=AMB[a]||AMB.brume; const s=root.style;
  if(hexOk(P.bgc)) t=fondPerso(P.bgc);
  for(const [k,v] of Object.entries({bg:t.bg,surface:t.surface,ink:t.ink,muted:t.muted,rule:t.rule,key:t.key,'key-op':t.keyop,warn:t.warn})) s.setProperty('--'+k,v);
  let acc=hexOk(P.accent)?P.accent:'#2557E8';
  // un accent trop proche du fond reste lisible
  const la=lum(acc), lb=lum(t.surface);
  if((Math.max(la,lb)+.05)/(Math.min(la,lb)+.05)<1.9) acc=t.dark?'#8EADFF':'#2557E8';
  s.setProperty('--accent',acc);
  s.setProperty('--accent-ink',lum(acc)>.42?'#141414':'#FFFFFF');
  s.setProperty('--active',`color-mix(in srgb, ${acc} ${t.dark?18:9}%, ${t.surface})`);
  s.setProperty('--res',P.rescol==='encre'?t.ink:`color-mix(in srgb, ${acc} ${t.dark?60:85}%, ${t.ink})`);
  s.colorScheme=t.dark?'dark':'light';
  const f=FONTS[P.font]||FONTS.plex;
  s.setProperty('--font',(f.css?f.css+', ':'')+'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif');
  const link=document.getElementById('fontLink');
  const href=f.g?'https://fonts.googleapis.com/css2?family='+f.g+'&display=swap':'';
  if(href && link.getAttribute('href')!==href) link.setAttribute('href',href);
  s.setProperty('--z',P.zoom);
  s.setProperty('--kh','calc(clamp(34px, 5.8vh, 50px) * '+(P.kbh/100)+')');
  s.setProperty('--kf',P.kbf/100);
  s.setProperty('--kg',{serre:'3px',normal:'6px',large:'9px'}[P.kbg]);
  s.setProperty('--kr',{rond:'12px',doux:'6px',carre:'2px'}[P.kbr]);
  if(typeof renderPad==='function' && applyPrefs.kbl!==P.kbl){ const first=applyPrefs.kbl===undefined; applyPrefs.kbl=P.kbl; if(!first) renderPad(); }
  document.getElementById('app').dataset.layout=P.layout;
  document.getElementById('app').dataset.big=P.big;
  document.getElementById('sheet').dataset.lines=P.lines;
  const A=document.getElementById('app').dataset, S=document.getElementById('sheet').dataset;
  S.paper=P.paper; S.heads=P.heads; A.dens=P.dens; A.resw=P.resw; A.enter=P.enter; A.sheetr=P.sheetr;
  if(P.keyc==='teinte'){ s.setProperty('--key',`color-mix(in srgb, ${acc} ${t.dark?16:9}%, ${t.key})`); s.setProperty('--key-op',`color-mix(in srgb, ${acc} ${t.dark?28:20}%, ${t.key})`); s.removeProperty('--key-ink'); }
  else if(P.keyc==='contraste'){ s.setProperty('--key',t.dark?mixHex(t.ink,t.bg,.86):mixHex(t.ink,t.bg,.9)); s.setProperty('--key-op',t.dark?mixHex(t.ink,t.bg,.66):mixHex(t.ink,t.bg,.72)); s.setProperty('--key-ink',t.dark?t.bg:'#FFFFFF'); }
  else s.removeProperty('--key-ink');
  if(hexOk(P.headc)) s.setProperty('--headc',P.headc); else s.removeProperty('--headc');
  SEP={espace:'\u202f',point:'.',aucun:''}[P.sep]; PREF_PARTS=P.parts;
  setDecimals(P.decimals); PREF_TVA=+P.tva||20;
  if(typeof renderRac==='function') renderRac();
  const meta=document.querySelector('meta[name="theme-color"]')||document.head.appendChild(Object.assign(document.createElement('meta'),{name:'theme-color'}));
  meta.content=t.bg;
  barresNatives(t.bg,t.dark);
}

const KEY='calc-lignes.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const SAMPLE=['# Budget du mois','Loyer : loyer = 850','courses = 4 × 85,50','Abonnements : 13,99 + 9,99 + 4,99','total','',
  '# Calculs express','1 200 + 20%','15% de 80','ttc(150)','evol(850; 910)','',
  '# Fiscalité 2026','Impôt, couple 2 enfants : ir(90 000; 3)','Taux marginal : tmi(90 000; 3)','Droits, un enfant : succ(400 000)','IFI : ifi(2 000 000)','Mensualité : mensualite(250 000; 3,4%; 20)',''];
function fresh(){ const id=uid(); return {sheets:[{id,name:'Budget',lines:SAMPLE.slice()}],cur:id,prefs:{...DEF_PREFS},updatedAt:0}; }
function sanitize(s){
  if(!s||!Array.isArray(s.sheets)||!s.sheets.length) return fresh();
  s.sheets=s.sheets.filter(x=>x&&Array.isArray(x.lines)).map(x=>({id:String(x.id||uid()),name:String(x.name||'Feuille'),lines:x.lines.map(String)}));
  if(!s.sheets.length) return fresh();
  s.sheets.forEach(x=>{ if(!x.lines.length) x.lines=['']; });
  if(!s.sheets.some(x=>x.id===s.cur)) s.cur=s.sheets[0].id;
  const P={...DEF_PREFS,...(s.prefs&&typeof s.prefs==='object'?s.prefs:{})};
  if('pad' in s){ P.pad=s.pad!==false; delete s.pad; }   // ancienne version : réglage du pavé au premier niveau
  P.pad=P.pad!==false;
  if(!AMB[P.ambiance]&&P.ambiance!=='auto') P.ambiance='auto';
  if(!FONTS[P.font]) P.font='plex';
  if(!LAYOUTS.some(l=>l[0]===P.layout)) P.layout='calc';
  if(!KEYSZ.some(l=>l[0]===P.keys)) P.keys='normal';
  if(!(s.prefs&&'kbh' in s.prefs)) P.kbh={compact:75,normal:90,grand:110}[P.keys]||90;   // ancien réglage « Touches »
  P.kbh=Math.min(140,Math.max(60,Math.round(+P.kbh||90)));
  P.kbf=Math.min(140,Math.max(70,Math.round(+P.kbf||100)));
  if(!KBG.some(l=>l[0]===P.kbg)) P.kbg='normal';
  if(!KBR.some(l=>l[0]===P.kbr)) P.kbr='rond';
  if(!KBL.some(l=>l[0]===P.kbl)) P.kbl='azerty';
  if(!DECS.some(l=>l[0]===String(P.decimals))) P.decimals='auto';
  P.decimals=String(P.decimals);
  P.zoom=Math.min(1.5,Math.max(.8,+P.zoom||1));
  P.tva=Number.isFinite(+P.tva)?+P.tva:20;
  if(!hexOk(P.accent)) P.accent=DEF_PREFS.accent;
  if(!BIGS.some(l=>l[0]===P.big)) P.big='l';
  if(!LINES.some(l=>l[0]===P.lines)) P.lines='traits';
  if(!RESCOL.some(l=>l[0]===P.rescol)) P.rescol='couleur';
  if(!SEPS.some(l=>l[0]===P.sep)) P.sep='espace';
  P.neg=!!P.neg; P.rac=P.rac!==false;
  P.parts=Math.min(10,Math.max(1,Math.round((+P.parts||1)*4)/4));
  if(Array.isArray(P.racKeys) && P.racKeys.join('|')==='<|>|total|somme(|€') P.racKeys=RAC_DEF.slice();   // anciens raccourcis d'origine
  for(const [k,L] of [['paper',PAPERS],['heads',HEADS],['dens',DENS],['resw',RESW],['keyc',KEYC],['enter',ENTERS],['sheetr',SHEETR]]) if(!L.some(l=>l[0]===P[k])) P[k]=DEF_PREFS[k];
  if(P.bgc && !hexOk(P.bgc)) P.bgc='';
  if(P.headc && !hexOk(P.headc)) P.headc='';
  P.racKeys=Array.from({length:5},(_,i)=>{ const k=Array.isArray(P.racKeys)?P.racKeys[i]:undefined; return typeof k==='string'?k.slice(0,12):RAC_DEF[i]; });
  P.favs=Array.isArray(P.favs)?P.favs.filter(x=>typeof x==='string').slice(0,24):DEF_PREFS.favs.slice();
  s.prefs=P; s.updatedAt=+s.updatedAt||0; return s;
}
let state;
try{ state=sanitize(JSON.parse(localStorage.getItem(KEY))); }catch(e){ state=fresh(); }

let remote=null, writing=false, again=false, pushT=null;
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
  clearTimeout(pushT); pushT=setTimeout(push,1200);
}
async function push(){
  if(!remote) return;
  if(writing){ again=true; return; }
  writing=true;
  try{ await remote.set({state:JSON.parse(JSON.stringify(state))}); }catch(e){}
  writing=false; if(again){ again=false; push(); }
}
async function initRemote(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc('data/users/'+id+'/calc');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej(0),10000))]);
    remote=ref;
    const d=snap.exists?snap.data():null;
    if(d&&d.state&&(+d.state.updatedAt||0)>state.updatedAt){
      state=sanitize(d.state); try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
      active=-1; applyPrefs(); renderAll();
    } else if(!d || state.updatedAt>(+d.state?.updatedAt||0)) push();
  }catch(e){}
}

const $=id=>document.getElementById(id);
const sheetEl=$('sheet'), tabsEl=$('tabs'), menuEl=$('menu');
let active=-1, results=[], menuOpen=false, renaming=false, delArmed=false;
const cur=()=>state.sheets.find(s=>s.id===state.cur);
const el=(tag,props,...kids)=>{ const e=document.createElement(tag); if(props) for(const [k,v] of Object.entries(props)){ if(k==='on') for(const [ev,fn] of Object.entries(v)) e.addEventListener(ev,fn); else if(k in e && k!=='style') e[k]=v; else e.setAttribute(k,v); } e.append(...kids.filter(x=>x!=null)); return e; };

function renderTabs(){
  tabsEl.innerHTML='';
  state.sheets.forEach(s=>{
    const b=el('button',{className:'tab',role:'tab','aria-current':s.id===state.cur?'true':'false'});
    if(renaming && s.id===state.cur){
      const i=el('input',{value:s.name,'aria-label':'Nom de la feuille'});
      const done=()=>{ if(!renaming) return; renaming=false; s.name=i.value.trim()||s.name; save(); renderTabs(); };
      i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); done(); } });
      i.addEventListener('blur',done);
      b.appendChild(i); tabsEl.appendChild(b); setTimeout(()=>{ i.focus(); i.select(); });
      return;
    }
    b.textContent=s.name;
    b.addEventListener('click',()=>{
      if(s.id===state.cur){ menuOpen=!menuOpen; delArmed=false; renderMenu(); return; }
      state.cur=s.id; active=-1; menuOpen=false; save(); renderAll();
    });
    tabsEl.appendChild(b);
  });
}
function renderMenu(){
  menuEl.classList.toggle('open',menuOpen);
  const d=menuEl.querySelector('[data-act="del"]');
  d.textContent=delArmed?'Confirmer la suppression':'Supprimer';
  d.disabled=state.sheets.length<2; d.style.opacity=state.sheets.length<2?.4:1;
}
function sheetText(s){
  const r=computeSheet(s.lines);
  return s.lines.map((l,i)=>{ const x=r[i]; return x.kind==='value'? l+'  →  '+show(x) : l; }).join('\n').replace(/\n+$/,'');
}
menuEl.addEventListener('click',e=>{
  const act=e.target.dataset&&e.target.dataset.act; if(!act) return;
  const s=cur();
  if(act==='rename'){ renaming=true; menuOpen=false; renderMenu(); renderTabs(); }
  if(act==='copy'){ copy(sheetText(s),'Feuille copiée'); menuOpen=false; renderMenu(); }
  if(act==='export'){ menuOpen=false; renderMenu(); openExport(); }
  if(act==='dup'){ const id=uid(); state.sheets.splice(state.sheets.indexOf(s)+1,0,{id,name:s.name+' (copie)',lines:s.lines.slice()}); state.cur=id; menuOpen=false; save(); renderAll(); toast('Feuille dupliquée'); }
  if(act==='clear'){ menuOpen=false; renderMenu(); clearAll(); }
  if(act==='del'){
    if(!delArmed){ delArmed=true; renderMenu(); return; }
    const i=state.sheets.indexOf(s), copyS={...s,lines:s.lines.slice()};
    state.sheets.splice(i,1); state.cur=state.sheets[Math.max(0,i-1)].id;
    menuOpen=false; delArmed=false; active=-1; save(); renderAll();
    toast('Feuille supprimée',{label:'Annuler',fn:()=>{ state.sheets.splice(i,0,copyS); state.cur=copyS.id; save(); renderAll(); }});
  }
});
$('addSheet').addEventListener('click',()=>{
  const id=uid(); state.sheets.push({id,name:'Feuille '+(state.sheets.length+1),lines:['']});
  state.cur=id; active=0; menuOpen=false; save(); renderAll(); focusRow(0,0);

function renderRows(){

function motsPerso(){   // mots de vos feuilles et noms de formules : favorisés
  const m=new Map();
  const add=(w,b)=>{ const n=normMot(w); if(/^[a-z]{2,}$/.test(n) && !(m.has(n) && m.get(n).b>=b)) m.set(n,{w,n,r:0,b}); };
  VOCAB_APP.forEach(w=>add(w,.35));
  Object.keys(ALIAS).forEach(w=>add(w,.35));
  state.sheets.forEach(sh=>sh.lines.forEach(l=>(l.match(/[\p{L}]{2,}/gu)||[]).forEach(w=>add(/^[A-ZÀ-Ý]/.test(w)&&w.slice(1)===w.slice(1).toLowerCase()?w.toLowerCase():w,.6))));
  return m;
}
function centresTouches(){
  const c={}, k=[...$('abc').querySelectorAll('.k')].filter(b=>/^[a-z]$/i.test(b.dataset.v));
  k.forEach(b=>{ const r=b.getBoundingClientRect(); c[b.dataset.v.toLowerCase()]={x:r.left+r.width/2,y:r.top+r.height/2}; });
  const r0=k[0].getBoundingClientRect(); return {c,kw:r0.width,kh:r0.height};
}
function reech(pts,N){   // rééchantillonne un tracé en N points également espacés
  if(pts.length===1) return Array(N).fill(pts[0]);
  let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  if(L===0) return Array(N).fill(pts[0]);
  const step=L/(N-1), out=[pts[0]]; let acc=0, prev=pts[0];
  for(let i=1;i<pts.length && out.length<N;i++){
    let cur=pts[i], d=Math.hypot(cur.x-prev.x,cur.y-prev.y);
    while(acc+d>=step && out.length<N){ const t=(step-acc)/d, q={x:prev.x+t*(cur.x-prev.x),y:prev.y+t*(cur.y-prev.y)}; out.push(q); prev=q; d=Math.hypot(cur.x-prev.x,cur.y-prev.y); acc=0; }
    acc+=d; prev=cur;
  }
  while(out.length<N) out.push(pts[pts.length-1]);
  return out;
}
function longueur(p){ let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); return L; }
function devinerMots(pts){
  if(!DICO || pts.length<2) return [];
  const {c,kw}=centresTouches(), N=32, U=reech(pts,N), UL=longueur(pts), dense=reech(pts,96);
  const pres=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const debut=pts[0], fin=pts[pts.length-1], tol=kw*1.25;
  const okDebut=new Set(Object.keys(c).filter(l=>pres(c[l],debut)<tol)), okFin=new Set(Object.keys(c).filter(l=>pres(c[l],fin)<tol));
  const perso=motsPerso(), vus=new Set(), res=[];
  const essai=(x,bonus)=>{
    if(vus.has(x.n)) return; const n=x.n;
    if(!okDebut.has(n[0]) || !okFin.has(n[n.length-1])) return;
    const lettres=[]; for(const ch of n){ if(!c[ch]) return; if(lettres[lettres.length-1]!==ch) lettres.push(ch); }
    if(lettres.length<2) return;
    const T=lettres.map(l=>c[l]), TL=longueur(T);
    if(TL<UL*.45 || TL>UL*1.9) return;
    const R=reech(T,N); let forme=0; for(let i=0;i<N;i++) forme+=pres(R[i],U[i]); forme/=N*kw;
    let lieu=0; for(const t of T){ let m=1e9; for(const q of dense){ const d=pres(t,q); if(d<m) m=d; } lieu+=Math.max(0,m-.55*kw)/kw; }
    const score=forme+1.6*lieu+.11*Math.log2(x.r+2)-bonus;
    vus.add(n); res.push({w:x.w,n,score});
  };
  perso.forEach(x=>essai(x,x.b));
  DICO.forEach(x=>essai(x,0));
  return res.sort((a,b)=>a.score-b.score).slice(0,4);
}
let dernierGlisse=null;   // {i, avant, texte, choix} : pour remplacer le mot par une suggestion
function formeMot(w){ if(shift===2) return w.toUpperCase(); if(shift===1) return w[0].toUpperCase()+w.slice(1); return w; }
function versionFormule(w){   // « somme » tapé là où une formule est attendue : « somme( »
  const e=cible||inputAt(active); const avant=e?e.value.slice(0,e.selectionStart??e.value.length):'';
  const ctxFormule=/[=:(;+\-*\/^<>×÷−]$/.test(avant.trimEnd());
  return ALIAS[normMot(w)] && ctxFormule ? w+'(' : w;
}
function ecrireMot(texte,choix){
  const e=ensureActive(), pos=e.selectionStart??e.value.length, avant=e.value.slice(0,pos);
  const sep=/[\p{L}\d)]$/u.test(avant)?' ':'';
  insert(sep+texte);

  if(shift===1){ shift=0; updShift(); }

}
function montrerSugg(){
  const S=$('sugg'); S.innerHTML='';
  const g=dernierGlisse; if(!g || !g.choix.length){ S.hidden=true; return; }
  S.hidden=false;
  g.choix.forEach((w,k)=>S.append(el('button',{type:'button',className:k===0?'first':'',textContent:w,on:{click:()=>remplacerMot(w)}})));
}
function cacherSugg(){ dernierGlisse=null; const S=$('sugg'); if(S){ S.hidden=true; S.innerHTML=''; } }
function remplacerMot(w){
  const g=dernierGlisse, s=cur(); if(!g || (g.cible||null)!==cible || (!cible && (g.id!==s.id || g.i!==active))) return cacherSugg();
  const e=cible||inputAt(active), v=e.value;
  if(v.slice(g.debut,g.debut+g.texte.length)!==g.texte) return cacherSugg();
  const sep=g.texte.startsWith(' ')?' ':'', nouveau=sep+w;
  e.value=v.slice(0,g.debut)+nouveau+v.slice(g.debut+g.texte.length);
  const p=g.debut+nouveau.length; try{ e.setSelectionRange(p,p); }catch(_){}
  if(cible) cibleSaisie(); else { s.lines[active]=e.value; save(); refresh(); }
  g.texte=nouveau; g.choix=g.choix.filter(x=>x!==w); g.choix.unshift(w); montrerSugg();
}
function finGlisse(pts){
  if(!DICO){ toast(dicoP?'Dictionnaire en cours de chargement…':'Écriture glissée indisponible ici (dictionnaire introuvable)'); loadDico(); return; }
  const r=devinerMots(pts);
  if(!r.length){ toast('Mot non reconnu, réessayez ou tapez-le'); return; }
  const choix=[]; r.forEach(x=>{ const f=formeMot(x.w); if(!choix.includes(f)) choix.push(f); });
  const premier=versionFormule(choix[0]); if(premier!==choix[0]) choix.unshift(premier);
  ecrireMot(choix[0],choix);
}
// tracé du doigt
const trace={pts:[],on:false,ctx:null};
function traceDebut(){
  const cv=$('trail'), K=$('kbd'), r=K.getBoundingClientRect(), d=devicePixelRatio||1;
  cv.width=r.width*d; cv.height=r.height*d; cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  trace.ctx=cv.getContext('2d'); trace.ctx.setTransform(d,0,0,d,-r.left*d,-r.top*d); trace.r=r;
}
function traceDessin(){
  const g=trace.ctx; if(!g) return; const r=trace.r, P=trace.pts;
  g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,g.canvas.width,g.canvas.height); g.restore();
  if(P.length<2) return;
  g.lineCap='round'; g.lineJoin='round'; g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#2557E8';
  g.globalAlpha=.55; g.lineWidth=Math.max(6,(r.width/40));
  g.beginPath(); g.moveTo(P[0].x,P[0].y); for(let i=1;i<P.length;i++) g.lineTo(P[i].x,P[i].y); g.stroke();
}
function traceFin(){ const g=trace.ctx; if(g){ g.save(); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,g.canvas.width,g.canvas.height); g.restore(); } trace.ctx=null; trace.pts=[]; trace.on=false; }

/* Gestes du clavier : appui (la touche part au relâché), maintien (C, ⌫, accents), glisser sur les lettres (écriture glissée) */
const kb={id:null,key:null,sx:0,sy:0,x:0,done:false,timer:null,rep:null,pop:null,hi:null};
function closePop(){ if(kb.pop){ kb.pop.remove(); kb.pop=null; kb.hi=null; } }
function kbStop(){
  clearTimeout(kb.timer); clearInterval(kb.rep); kb.timer=kb.rep=null;
  if(kb.key) kb.key.classList.remove('hold','down');
  closePop();
}
function openPop(k){
  const base=k.dataset.v, vars=[...ACC[base]].map(c=>shift?c.toUpperCase():c);
  const pop=el('div',{className:'pop','aria-hidden':'true'},...vars.map(c=>el('span',{textContent:c})));
  document.body.appendChild(pop);
  const r=k.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
  pop.style.left=Math.max(4,Math.min(innerWidth-pw-4,r.left+r.width/2-pw/2))+'px';
  pop.style.top=Math.max(4,r.top-ph-6)+'px';
  kb.pop=pop; kb.done=true; k.classList.remove('down'); popHi(kb.x,kb.sy); buzz(12);
}
function popHi(x,y){
  // premier accent sous le doigt, puis on glisse vers la droite pour les suivants
  const spans=[...kb.pop.children], kr=kb.key.getBoundingClientRect(), step=spans[0].offsetWidth+3;
  const hi = y<kr.bottom+40 ? spans[Math.max(0,Math.min(spans.length-1,Math.round((x-kb.sx)/step)))] : null;
  spans.forEach(s=>s.classList.toggle('hi',s===hi)); kb.hi=hi;
}
function kbFinish(){
  const k=kb.key, v=k&&k.dataset.v;
  if(trace.on){ const pts=trace.pts.slice(); kbStop(); traceFin(); kb.id=null; kb.key=null; finGlisse(pts); return; }
  trace.pts=[];
  if(kb.pop){
    const c=kb.hi&&kb.hi.textContent; kbStop();
    if(c){ insert(c); if(shift===1){ shift=0; updShift(); } }
  } else {
    const fire=!kb.done&&k; kbStop();
    if(fire){ cacherSugg(); press(v); }
  }
  kb.id=null; kb.key=null;
}
(()=>{
  const K=$('kbd');
  K.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    e.preventDefault();                       // la ligne garde le curseur
    if(e.target.closest('#sugg')) return;     // suggestions de l'écriture glissée : simple bouton
    if(kb.id!==null) kbFinish();  // frappe à deux pouces : la touche précédente part tout de suite
    const k=e.target.closest('.k');
    Object.assign(kb,{id:e.pointerId,key:k,sx:e.clientX,sy:e.clientY,x:e.clientX,done:false});
    try{ K.setPointerCapture(e.pointerId); }catch(_){}
    if(!k) return;
    k.classList.add('down');
    const v=k.dataset.v;
    trace.pts = kbPage===1 && state.prefs.glisse!==false && /^[a-z]$/i.test(v) ? [{x:e.clientX,y:e.clientY}] : [];
    if(trace.pts.length) loadDico();
    if(v==='clear'){ k.classList.add('hold'); kb.timer=setTimeout(()=>{ kb.done=true; k.classList.remove('hold','down'); buzz(25); clearAll(); },600); }
    else if(v==='back'){ kb.timer=setTimeout(()=>{ kb.done=true; if(backspace(true)) kb.rep=setInterval(()=>{ if(!backspace(true)){ clearInterval(kb.rep); kb.rep=null; } },70); },420); }
    else if(ACC[v]) kb.timer=setTimeout(()=>openPop(k),380);
  });
  K.addEventListener('pointermove',e=>{
    if(e.pointerId!==kb.id) return;
    kb.x=e.clientX;
    if(kb.pop){ popHi(e.clientX,e.clientY); return; }
    if(trace.pts.length){
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
      (evs.length?evs:[e]).forEach(v=>trace.pts.push({x:v.clientX,y:v.clientY}));
      if(!trace.on && Math.hypot(e.clientX-kb.sx,e.clientY-kb.sy)>Math.max(24,(kb.key?kb.key.offsetWidth:30)*.7)){
        trace.on=true; kb.done=true; clearTimeout(kb.timer); kb.timer=null; if(kb.key) kb.key.classList.remove('hold','down'); traceDebut();
      }
      if(trace.on){ traceDessin(); return; }
    }
    // le doigt a glissé loin de la touche : on annule (rien n'est tapé)
    if(!kb.done && Math.hypot(e.clientX-kb.sx,e.clientY-kb.sy)>28){ kb.done=true; clearTimeout(kb.timer); kb.timer=null; if(kb.key) kb.key.classList.remove('hold','down'); }
  });
  K.addEventListener('pointerup',e=>{ if(e.pointerId===kb.id) kbFinish(); });
  K.addEventListener('pointercancel',e=>{
    if(e.pointerId!==kb.id) return;
    kbStop(); traceFin(); kb.id=null; kb.key=null;
  });
  // touches activées au clavier physique (Tab puis Entrée) : pas de pointeur
  K.addEventListener('click',e=>{ if(e.detail!==0) return; const k=e.target.closest('.k'); if(k) press(k.dataset.v); });
  K.addEventListener('contextmenu',e=>e.preventDefault());
})();

/* Panneaux */
let openOver=null;
function showOver(id){ openOver=$(id); openOver.classList.add('open'); }
// Saisie dans un panneau (recherche, couleurs, formulaire) : le panneau monte en haut de l'écran,
// au-dessus du clavier du téléphone, et la case reste visible.
function vvh(){ const h=window.visualViewport?visualViewport.height:innerHeight; document.documentElement.style.setProperty('--vvh',h+'px'); }
vvh(); if(window.visualViewport) visualViewport.addEventListener('resize',()=>{ vvh(); const a=document.activeElement; if(a&&a.closest&&a.closest('.over')) a.scrollIntoView({block:'nearest'}); });
function poserCible(c){
  if(cible===c) return;
  cible=c; cacherSugg(); document.body.classList.toggle('clavform',!!c);
  if(c){ const P=document.querySelector('.panel'); document.documentElement.style.setProperty('--panelH',P.offsetHeight+'px'); setTimeout(()=>c.scrollIntoView({block:'nearest'}),60); }
}
document.addEventListener('focusin',e=>{
  if(e.target.classList&&e.target.classList.contains('clav')){ poserCible(e.target); return; }
  if(!cible || e.target.closest('#kbd,#tiles')) return;
  const dansFenetre=cible.closest('.over')&&cible.closest('.over').contains(e.target);
  if(!dansFenetre || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) poserCible(null);
});
document.addEventListener('focusin',e=>{ if(e.target.classList&&e.target.classList.contains('clav')) return; const o=e.target.closest&&e.target.closest('.over'); if(o&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ o.classList.add('typing'); setTimeout(()=>e.target.scrollIntoView({block:'nearest'}),350); } });
document.addEventListener('focusout',e=>{ const o=e.target.closest&&e.target.closest('.over'); if(o) setTimeout(()=>{ const a=document.activeElement; if(!(a&&o.contains(a)&&/^(INPUT|TEXTAREA)$/.test(a.tagName))) o.classList.remove('typing'); },50); });
function closeOver(){ poserCible(null); if(openOver){ openOver.classList.remove('open','typing'); openOver=null; } }
$('fxBtn').addEventListener('click',()=>{ $('fxSearch').value=''; renderFx(''); showOver('fxOver'); });
$('setBtn').addEventListener('click',()=>{ renderSettings(); showOver('setOver'); });
document.querySelectorAll('.over').forEach(o=>{
  o.addEventListener('click',e=>{ if(e.target===o||e.target.closest('[data-close]')) closeOver(); });
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOver(); });

/* Utilitaires */
let tt=null;
function toast(msg,action){
  const t=$('toast'); t.textContent=msg; t.classList.toggle('act',!!action);
  if(action) t.appendChild(el('button',{type:'button',textContent:action.label,on:{click:()=>{ t.classList.remove('show'); action.fn(); }}}));
  t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show','act'),action?4500:1800);
}
function copy(text,msg){
  const ok=()=>toast(msg||('Copié : '+text));
  const fallback=()=>{ try{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }catch(e){ toast('Copie impossible ici'); } };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok,fallback); else fallback();
}



/* ===================== Clavier caché pendant le défilement ===================== */
(()=>{
  const S=sheetEl, SEUIL=70; let depart=null, finDoigt=0;
  const cacher=v=>{ if(document.body.classList.contains('kbcache')===v) return; const y=S.scrollTop; document.body.classList.toggle('kbcache',v); S.scrollTop=y; };
  S.addEventListener('touchstart',()=>{ depart=S.scrollTop; finDoigt=0; },{passive:true});
  S.addEventListener('touchend',()=>{ finDoigt=Date.now(); },{passive:true});
  S.addEventListener('scroll',()=>{
    if(depart===null || state.prefs.cacheClavier===false) return;
    if(finDoigt && Date.now()-finDoigt>900){ depart=null; return; }
    if(Math.abs(S.scrollTop-depart)>SEUIL){ cacher(true); depart=null; }
  },{passive:true});
  // retour : toucher une ligne, une case du tableau, ou le bouton
  S.addEventListener('click',e=>{ if(e.target.closest('.row,.tbl .cell')) cacher(false); });
  S.addEventListener('focusin',()=>cacher(false));
  $('kbRetour').addEventListener('click',()=>{ cacher(false); ensureActive(); });
})();

/* ===================== Séries en tableau ===================== */
// Les lignes « Intérêts 2026 », « Résultat 2026 »… s'affichent en tableau (années en lignes, séries en colonnes) ;
// les lignes uniques (loyer, taux, emprunt…) restent des lignes. Rien ne change dans la feuille elle-même.
function tableauInfo(){
  const s=cur(), L=s.lines, T=seriesDe(s,results); if(!T) return null;
  const inSerie=new Set(T.cols.flatMap(c=>Object.values(c.vals).map(it=>it.i))), cache=new Set(inSerie);
  for(let k=0;k<L.length;k++){
    if(!L[k].trim().startsWith('#')) continue;
    const bloc=[]; for(let j=k+1;j<L.length && !L[j].trim().startsWith('#');j++) bloc.push(j);
    const utiles=bloc.filter(b=>L[b].trim()!=='');
    if(utiles.some(b=>inSerie.has(b)) && utiles.every(b=>inSerie.has(b)||(results[b]&&results[b].isTotal))){ cache.add(k); bloc.forEach(b=>cache.add(b)); }
  }
  cache.delete(L.length-1);
  return {T,cache};
}
let tabInfo=null;
// En cours de formule (après +, −, ×, (, ; …), toucher une case insère sa référence, comme dans un tableur
function attendValeur(){
  const e=active>=0?inputAt(active):null; if(!e||document.activeElement!==e) return false;
  const avant=e.value.slice(0,e.selectionStart??e.value.length).trimEnd();
  return /[+\-−×*\/÷^(;=<>≤≥]$/.test(avant) || /^[^:#]*\p{L}[^:]*:$/u.test(avant);
}

  sheetEl.querySelectorAll('.tbl').forEach(x=>x.remove());
  tabInfo=state.prefs.tableau!==false&&!sel.size?tableauInfo():null;

  sheetEl.querySelectorAll('.row').forEach(row=>{ const i=+row.dataset.i; row.classList.toggle('entab',!!tabInfo&&tabInfo.cache.has(i)&&i!==active); });
  if(!tabInfo) return;
  const {T,cache}=tabInfo, first=Math.min(...cache), row0=sheetEl.querySelector('.row[data-i="'+first+'"]');
  const neg=v=>state.prefs.neg&&v<0;
  const tb=el('table',null,
    el('thead',null,el('tr',null,el('th',{textContent:'Année'}),...T.cols.map((c,k)=>el('th',{textContent:c.nom,'data-col':k,title:'Maintenir pour renommer'})),
      el('th',{className:'plus'},el('button',{type:'button',className:'addcol',textContent:'+ Colonne','aria-label':'Ajouter une colonne calculée'})))),

      ...T.cols.map(c=>{ const it=c.vals[y]; if(!it) return el('td');
        return el('td',null,el('button',{type:'button',className:'cell'+(it.i===active?' on':'')+(neg(it.x.value)?' neg':''),textContent:show(it.x),'data-i':it.i,'aria-label':c.nom+' '+y+' : '+show(it.x)})); }),el('td'))),

        return el('td',{className:neg(v)?'neg':'',textContent:fmt(v,c.argent)+(c.argent?' €':'')}); }),el('td'))));
  const w=el('div',{className:'tbl'+(attendValeur()?' pointe':'')},tb);

function choixTuiles(met){

    box.innerHTML='';
    const bar=el('div',{className:'tbar'}), grid=el('div',{className:'tgrid'});
    box.append(bar,grid);
    const fermer=el('button',{type:'button',className:'ferme',textContent:'✕','aria-label':'Fermer les tuiles',on:{click:()=>{ box.hidden=true; theme=null; }}});
    if(theme===null){

      TILES.forEach(([nom,aide])=>grid.append(el('button',{className:'tile theme',type:'button',on:{click:()=>{ theme=nom; dessine(); }}},el('b',{textContent:nom}),el('small',{textContent:aide}))));
      return;
    }
    const th=TILES.find(t=>t[0]===theme);
    bar.append(el('button',{type:'button',textContent:'← Thèmes',on:{click:()=>{ theme=null; dessine(); }}}),el('span',{textContent:theme}),fermer);

function libelle(line,res){

// Lignes « Libellé 2026 », « Libellé 2027 »… : une série par libellé (ou par titre du bloc)
function seriesDe(s,r){
  const items=[]; let titre='';
  s.lines.forEach((line,i)=>{
    const t=line.trim();
    if(t.startsWith('#')){ titre=t.replace(/^#+\s*/,'').trim(); return; }
    const x=r[i]; if(!t || !x || x.kind!=='value') return;
    const lab=libelle(line,x); if(lab===t) return;
    const m=lab.match(/^(.*?)\s*\b((?:19|20)\d{2})\b\s*(?:\(([^)]*)\))?\s*$/u); if(!m) return;
    items.push({i,stem:m[1].trim(),year:+m[2],note:(m[3]||'').trim(),titre,x});
  });
  const groupes=new Map();
  items.forEach(it=>{ const k=it.titre+'|'+it.stem.toLowerCase(); if(!groupes.has(k)) groupes.set(k,[]); groupes.get(k).push(it); });
  let cols=[...groupes.values()].filter(g=>new Set(g.map(x=>x.year)).size>=2);
  const parTitre={}; cols.forEach(g=>{ parTitre[g[0].titre]=(parTitre[g[0].titre]||0)+1; });
  cols=cols.map(g=>{ const t=g[0].titre, st=g[0].stem;
    const nom=(t && parTitre[t]===1 && (st.length<3 || !st)) ? t : (st || t || 'Série');
    const vals={}; g.forEach(it=>{ vals[it.year]=it; });
    const argent=g.some(it=>it.x.cur==='€'), pct=g.every(it=>it.x.isPct);
    return {nom,vals,argent,pct,premier:g[0].i}; }).sort((a,b)=>a.premier-b.premier);
  const annees=[...new Set(cols.flatMap(c=>Object.keys(c.vals).map(Number)))].sort((a,b)=>a-b);
  const notes={}; items.forEach(it=>{ if(it.note && !notes[it.year]) notes[it.year]=it.note; });
  // hypothèses : lignes fixes utilisées par les séries (L5, loyer, taux…)
  const dansSerie=new Set(cols.flatMap(c=>Object.values(c.vals).map(it=>it.i)));
  const varIdx={}; r.forEach((x,k)=>{ if(x&&x.kind==='value'&&x.name) varIdx[x.name]=k; });
  const hyp=new Set();
  const refs=k=>{ const t=s.lines[k], f=t.replace(/^((?:[^:()=<>]|\([^()]*\))+?)\s*:\s*/,'');

    (f.match(/[\p{L}_][\p{L}\d_]*/gu)||[]).forEach(w=>{ const j=varIdx[w.toLowerCase()]; if(j!==undefined && j!==k && !dansSerie.has(j)) hyp.add(j); }); };
  dansSerie.forEach(refs);
  const hypo=[...hyp].sort((a,b)=>a-b).map(k=>{ const l=libelle(s.lines[k],r[k]); return {label:l.charAt(0).toUpperCase()+l.slice(1),valeur:show(r[k])}; });
  return cols.length && annees.length>=2 ? {cols,annees,notes,hypo} : null;
}
