# Construit l'appli Android « Calcul en lignes » (dossier « calcul ») et la publie dans la version « calcul » du dépôt :
#   https://github.com/Yvanov40/public/releases/download/calcul/calcul-en-lignes.apk
name: Calcul Android
on:
  push:
    branches: [main]
    paths: ["calcul/**", ".github/workflows/calcul-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Clé de signature de Mes applis (secret APPLI_KEYSTORE_B64, si présent)
        env: { CLE: "${{ secrets.APPLI_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$CLE" ]; then echo "$CLE" | base64 -d > "$RUNNER_TEMP/appli.keystore"; echo "APPLI_KEYSTORE_FICHIER=$RUNNER_TEMP/appli.keystore" >> "$GITHUB_ENV"; fi
      - name: Préparer Capacitor
        working-directory: calcul
        env: { NUMERO: "${{ github.run_number }}" }
        run: |
          npm ci
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          node preparer-android.js
      - name: Construire l'APK
        working-directory: calcul/android
        env: { APPLI_KEYSTORE_MDP: "${{ secrets.APPLI_KEYSTORE_MDP }}", APPLI_KEYSTORE_ALIAS: "${{ secrets.APPLI_KEYSTORE_ALIAS }}" }
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renommer
        run: cp calcul/android/app/build/outputs/apk/release/app-release.apk calcul-en-lignes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: calcul
          name: "Calcul en lignes — Android"
          body: |
            Calculatrice en lignes, entre le tableur et la calculatrice de téléphone.
            Sur le téléphone : télécharger « calcul-en-lignes.apk », l'ouvrir, autoriser l'installation depuis le navigateur si Android le demande.
          files: calcul-en-lignes.apk
          make_latest: false
